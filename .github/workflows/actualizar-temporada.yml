name: Actualizar informe temporada 26-27

# ACTUALIZACIÓN SEMANAL, LOS JUEVES, A PRUEBA DE FALLOS
# El cron de GitHub no es fiable (en la web de coches llegó a saltarse días
# enteros). Por eso no dependemos de UN disparo: GitHub revisa 3 veces al día
# de jueves a sábado y el job solo actualiza si esta semana (desde el jueves a
# las 00:00, hora de Madrid) todavía no hubo una actualización AUTOMÁTICA. Lo
# normal es que salga el jueves; si ese día falla, la recupera el viernes o el sábado.
# Las manuales no cuentan, así cada semana llega un correo «automática» que
# demuestra que el sistema funciona. Las dos (automática y manual) descargan
# siempre los datos nuevos de la RFEN.
# El asunto del correo y el commit dicen si fue automática o MANUAL (como en la web de coches).
on:
  schedule:                   # horas en UTC (Madrid = UTC+1 en invierno, +2 en verano): jueves, viernes y sábado
    - cron: '23 5 * * 4,5,6'
    - cron: '41 11 * * 4,5,6'
    - cron: '7 18 * * 4,5,6'
  workflow_dispatch:          # botón "Run workflow" → actualiza al momento


# una actualización detrás de otra (nunca dos a la vez)
concurrency:
  group: actualizar-temporada
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      correr: ${{ steps.c.outputs.correr }}
    steps:
      - id: c
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Lanzado a mano — se actualiza ya."; echo "correr=si" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # última actualización AUTOMÁTICA (las manuales no reinician la cuenta semanal).
          # Se buscan los commits del robot (github-actions[bot]) SIN filtrar por archivo: si los datos no cambiaron,
          # la automática no toca temporada.html y antes no se encontraba («nunca») → actualizaba 3 veces al día.
          ULTIMO=$(gh api "repos/${{ github.repository }}/commits?author=41898282%2Bgithub-actions%5Bbot%5D%40users.noreply.github.com&per_page=100" \
                   --jq '[.[] | select(.commit.message | startswith("Actualizar informe temporada 26-27 (automática)"))][0].commit.committer.date // ""' \
                   2>/dev/null || echo "")
          # jueves de esta semana a las 00:00 en Madrid (si hoy es jueves, hoy)
          N=$(( ($(TZ=Europe/Madrid date +%u) + 3) % 7 ))      # días desde el jueves (jueves 0, viernes 1 … miércoles 6)
          DIA=$(TZ=Europe/Madrid date -d "$(TZ=Europe/Madrid date +%F) -$N days" +%F)
          JUEVES=$(TZ=Europe/Madrid date -d "$DIA 00:00" +%s)
          if [ -n "$ULTIMO" ] && [ "$(date -u -d "$ULTIMO" +%s)" -ge "$JUEVES" ]; then
            echo "Esta semana ya hubo actualización automática ($ULTIMO, semana desde el jueves $DIA) — no toca."
            echo "correr=no" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "Toca la actualización automática (última: ${ULTIMO:-nunca})."; echo "correr=si" >> "$GITHUB_OUTPUT"

  actualizar:
    needs: check
    if: needs.check.outputs.correr == 'si'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: write
    env:
      TZ: Europe/Madrid
      # automática = la lanzó el horario; manual = botón «Run workflow» (o un disparo a mano)
      TIPO: ${{ github.event_name == 'schedule' && 'automática' || 'manual' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - run: pip install requests

      - name: Descargar marcas 26-27 de la RFEN
        env:
          RFEN_USER: ${{ secrets.RFEN_USER }}
          RFEN_PASS: ${{ secrets.RFEN_PASS }}
          CNA_RAW_OUT: raw_2627
        run: python pipeline/descargar.py --temporada 2627

      - name: Generar informe
        env:
          CNA_BASE: pipeline/base_2526.json.gz
          CNA_NEW: raw_2627
          CNA_OUT: temporada.html
          CNA_SUMMARY: resumen.txt
        run: python pipeline/generar.py

      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # la automática deja SIEMPRE su commit (aunque no cambie nada): es la marca que usa «check» para saber que esta semana ya se hizo
          VACIO=""; [ "$TIPO" = "automática" ] && VACIO="--allow-empty"
          git add temporada.html club.html historial.json ranking.json historico_ranking.json.gz comparar.json cronometro/nadadores.json
          git commit $VACIO -m "Actualizar informe temporada 26-27 (${TIPO}) — $(date '+%d/%m/%Y %H:%M')" || echo "Sin cambios"
          for i in 1 2 3; do
            git push origin main && exit 0
            # si otra actualización (o un cambio de código) llegó antes: rehacer sobre la versión más reciente
            git fetch origin main
            git reset --hard origin/main
            CNA_BASE=pipeline/base_2526.json.gz CNA_NEW=raw_2627 CNA_OUT=temporada.html CNA_SUMMARY=resumen.txt python pipeline/generar.py
            git add temporada.html club.html historial.json ranking.json historico_ranking.json.gz comparar.json cronometro/nadadores.json
            git commit $VACIO -m "Actualizar informe temporada 26-27 (${TIPO}) — $(date '+%d/%m/%Y %H:%M')" || exit 0
          done
          exit 1

      - name: Preparar correo
        id: correo
        run: |
          {
            echo "fecha=$(date '+%d/%m/%Y %H:%M')"
            d="EOF_$(openssl rand -hex 8)"
            echo "cuerpo<<$d"
            if [ "$TIPO" = "manual" ]; then
              echo "🖐️ ACTUALIZACIÓN MANUAL — lanzada a mano (botón «Run workflow»), no por el horario automático."
            else
              echo "✅ ACTUALIZACIÓN AUTOMÁTICA — la semanal, lanzada por el horario. El sistema funciona."
            fi
            echo; cat resumen.txt
            echo; echo "📊 Visitas a la web (solo tú, con tu contraseña): https://andresvazquez11.goatcounter.com"
            echo "   Qué secciones visita más la gente: en el panel, la lista «Pages»."
            echo "$d"
          } >> "$GITHUB_OUTPUT"

      - name: Correo de éxito
        uses: dawidd6/action-send-mail@4226df7daafa6fc901a43789c49bf7ab309066e7 # v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: andrescovidelpi@gmail.com
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          from: Natación C.N. Axarquía <andrescovidelpi@gmail.com>
          to: andrescovidelpi@gmail.com
          subject: "${{ github.event_name == 'schedule' && '✅ Actualización automática' || '🖐️ Actualización MANUAL' }} del informe de natación 26-27 — ${{ steps.correo.outputs.fecha }}"
          body: ${{ steps.correo.outputs.cuerpo }}

      - name: Correo de error
        if: failure()
        uses: dawidd6/action-send-mail@4226df7daafa6fc901a43789c49bf7ab309066e7 # v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: andrescovidelpi@gmail.com
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          from: Natación C.N. Axarquía <andrescovidelpi@gmail.com>
          to: andrescovidelpi@gmail.com
          subject: "⚠️ Falló la actualización ${{ github.event_name == 'schedule' && 'automática' || 'MANUAL' }} del informe de natación 26-27"
          body: |
            Algo falló durante la actualización ${{ github.event_name == 'schedule' && 'automática' || 'MANUAL (lanzada a mano)' }} del informe de natación. Si era la automática, se reintentará sola en unas horas.
            Detalle: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
