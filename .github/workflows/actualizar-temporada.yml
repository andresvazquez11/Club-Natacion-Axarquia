name: Actualizar informe temporada 26-27

on:
  schedule:
    - cron: '0 5 1,16 * *'   # días 1 y 16 de cada mes, 07:00 hora de España (verano)
  workflow_dispatch:          # botón "Run workflow" para lanzarlo a mano

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - run: pip install requests

      - name: Descargar marcas 26-27 de la RFEN
        env:
          RFEN_USER: ${{ secrets.RFEN_USER }}
          RFEN_PASS: ${{ secrets.RFEN_PASS }}
          CNA_RAW_OUT: raw_2627
        run: python pipeline/descargar.py --temporada 2627

      - name: Generar informe
        env:
          CNA_BASE: pipeline/base_2526.json.gz
          CNA_NEW: raw_2627
          CNA_OUT: temporada.html
        run: python pipeline/generar.py

      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add temporada.html
          git diff --cached --quiet && exit 0
          git commit -m "Actualizar informe temporada 26-27 — $(date +%d/%m/%Y)"
          git push
