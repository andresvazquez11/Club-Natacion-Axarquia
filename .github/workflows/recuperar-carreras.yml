name: Recuperar carreras (foto finish de competiciones anteriores)

# Guarda en carreras/ las competiciones ya terminadas que no se guardaron a tiempo (la ventana de «Directo FAN» solo mira los últimos
# 10 días). Se lanza a mano (botón «Run workflow»); no toca directo.json ni parciales.json.
on:
  workflow_dispatch:
    inputs:
      dias:
        description: 'Cuántos días hacia atrás buscar competiciones'
        default: '70'

concurrency:
  group: directo-fan
  cancel-in-progress: false

jobs:
  recuperar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      TZ: Europe/Madrid
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install pypdf==6.14.2
      - name: Guardar las carreras que faltan
        run: python pipeline/fan_directo.py --recuperar --antes "${{ github.event.inputs.dias }}"
      - name: Publicar si cambió
        run: |
          if [ -z "$(git status --porcelain -- carreras)" ]; then echo "Sin cambios"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add carreras
          git commit -m "Recuperar carreras de competiciones anteriores — $(date +'%d/%m/%Y %H:%M')"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; git rebase --abort 2>/dev/null; sleep 5; done
          exit 1
