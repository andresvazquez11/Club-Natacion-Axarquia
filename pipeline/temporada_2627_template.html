<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>C.N. Axarquía · Arranque 26-27</title>
<style>
:root{
  --bg:#070b1a;--card:rgba(255,255,255,.045);--card2:rgba(255,255,255,.075);--border:rgba(255,255,255,.09);
  --txt:#e2e8f0;--soft:#8193ad;--blue:#38bdf8;--gold:#fbbf24;--silver:#cbd5e1;--bronze:#d97706;
  --green:#34d399;--red:#f87171;--pink:#f472b6;--violet:#a78bfa;
  --ma:#22d3ee;--an:#34d399;--es:#fbbf24;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--txt);font-size:15px;line-height:1.4;
  background-image:radial-gradient(ellipse at 20% -10%,rgba(56,189,248,.18),transparent 55%),radial-gradient(ellipse at 90% 10%,rgba(167,139,250,.14),transparent 50%);background-attachment:fixed}
.page{max-width:1240px;margin:0 auto;padding:0 16px 80px}
h2{font-size:1.25rem;font-weight:800;margin:34px 0 12px;display:flex;align-items:center;gap:8px}
h3{font-size:1rem;font-weight:800;margin:18px 0 8px}
.muted{color:var(--soft)}
.small{font-size:.78rem}
/* hero */
.hero{text-align:center;padding:34px 0 10px}
.badge{display:inline-block;padding:4px 14px;border-radius:20px;font-size:.72rem;font-weight:700;background:rgba(56,189,248,.14);border:1px solid rgba(56,189,248,.35);color:var(--blue)}
.hero h1{font-size:2.2rem;font-weight:900;letter-spacing:-.6px;margin:10px 0 6px;line-height:1.1}
.hero h1 span{background:linear-gradient(90deg,#38bdf8,#a78bfa,#fbbf24);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:20px 0 6px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 10px;text-align:center}
.kpi b{display:block;font-size:1.6rem;font-weight:900}
.kpi span{font-size:.7rem;color:var(--soft)}
.kpi[data-stat],.cmp-m>div[data-stat]{cursor:pointer;transition:border-color .15s,background .15s}
.kpi[data-stat]:hover,.cmp-m>div[data-stat]:hover{border-color:rgba(56,189,248,.55);background:var(--card2)}
.vd{display:block;margin-top:6px;font-size:.66rem;font-weight:700;color:var(--blue)}
.kpi .cmp{display:block;margin-top:7px;padding-top:6px;border-top:1px solid var(--border);font-size:.68rem;color:var(--soft);line-height:1.5}
.kpi .cmp i{font-style:normal;font-weight:800}
/* comparativa con otros clubes */
.cmp-head{display:flex;flex-wrap:wrap;align-items:center;gap:18px}
.cmp-pos{font-size:3rem;font-weight:900;line-height:1}
.cmp-pos small{font-size:1rem;color:var(--soft);font-weight:700}
.cmp-txt{flex:1;min-width:220px}
.cmp-txt b{font-size:1.1rem}
.cmp-m{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:14px}
.cmp-m>div{background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:10px;padding:10px}
.cmp-m b{font-size:1.2rem;font-weight:900;margin-right:4px}
.cmp-m .lbl{display:block;font-size:.7rem;color:var(--soft);margin-top:3px}
.cmp-m .meter{margin-top:6px}
.cmp-t td,.cmp-t th{padding:6px 6px}
.cmp-t td.cn{white-space:normal;min-width:90px}
@media(max-width:520px){.cmp-t td,.cmp-t th{padding:6px 2px;font-size:.72rem}.cmp-t th{font-size:.6rem;letter-spacing:0}.cmp-t .pos{min-width:24px;padding:2px 3px;font-size:.7rem}.cmp-t td.cn{min-width:0}}
.note{background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.25);border-radius:10px;padding:10px 14px;font-size:.8rem;color:#fde68a;margin:14px 0}
/* cards */
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media(max-width:760px){.grid3{grid-template-columns:minmax(0,1fr)}}
.spot,.card{min-width:0;max-width:100%}
.lvcol table{table-layout:fixed;width:100%}
.lvcol td{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvcol td:nth-child(1){width:44px}.lvcol td:nth-child(3){width:66px}.lvcol td:nth-child(4){width:60px}
.dt{font-size:.64rem;color:var(--soft)}.dt.new{color:var(--green);font-weight:700}.dt.old{color:#64748b}
.evbtn{background:rgba(56,189,248,.08);border:1px solid rgba(56,189,248,.3);border-radius:8px;padding:2px 6px;cursor:pointer;display:inline-flex;align-items:center;gap:4px;color:var(--blue);font-size:.68rem;font-weight:700}
.evbtn:hover{background:rgba(56,189,248,.18)}
#modal{position:fixed;inset:0;background:rgba(2,6,23,.78);backdrop-filter:blur(4px);z-index:50;display:none;align-items:flex-start;justify-content:center;padding:30px 12px;overflow-y:auto}
#modal.open{display:flex}
#modal .box{background:#0d1428;border:1px solid var(--border);border-radius:16px;padding:18px;width:100%;max-width:900px}
#modal .chart{width:100%;height:auto;margin:8px 0 4px}
.pb{color:var(--gold);font-weight:800}
#modal td:nth-child(2){white-space:normal;min-width:200px}
/* tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 14px}
.tab{border:1px solid var(--border);background:var(--card);color:var(--soft);padding:8px 13px;border-radius:9px;font-weight:700;font-size:.8rem;cursor:pointer}
.tab.act{background:rgba(56,189,248,.16);color:#fff;border-color:rgba(56,189,248,.5)}
.tab.f.act{background:rgba(244,114,182,.16);border-color:rgba(244,114,182,.5)}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:9px;overflow:hidden}
.seg button{background:transparent;border:0;color:var(--soft);padding:6px 11px;font-size:.75rem;font-weight:700;cursor:pointer}
.seg button.act{background:rgba(255,255,255,.1);color:#fff}
select{background:#0f172a;color:var(--txt);border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-size:.82rem}
/* tables */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:.82rem}
th{font-size:.66rem;text-transform:uppercase;letter-spacing:.4px;color:var(--soft);text-align:left;padding:7px 8px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid rgba(255,255,255,.04);white-space:nowrap}
tr.click{cursor:pointer}tr.click:hover td{background:rgba(255,255,255,.04)}
tr.me td{background:rgba(56,189,248,.14);font-weight:700}
tr.club td{background:rgba(167,139,250,.08)}
tr.sep td{padding:2px;color:var(--soft);text-align:center;font-size:.7rem}
.num{text-align:right;font-variant-numeric:tabular-nums}
.pos{display:inline-block;min-width:30px;text-align:center;border-radius:6px;padding:2px 5px;font-weight:800;font-size:.76rem;background:rgba(255,255,255,.06)}
.p1{background:rgba(251,191,36,.25);color:var(--gold)}.p2{background:rgba(203,213,225,.2);color:var(--silver)}.p3{background:rgba(217,119,6,.25);color:#fdba74}
.p10{background:rgba(52,211,153,.15);color:var(--green)}
.tot{color:var(--soft);font-size:.68rem}
.gap-a{color:var(--red)}.gap-b{color:var(--green)}
.lv-ma{color:var(--ma)}.lv-an{color:var(--an)}.lv-es{color:var(--es)}
.pill{display:inline-block;font-size:.66rem;padding:2px 7px;border-radius:10px;background:rgba(255,255,255,.07);color:var(--soft);margin-left:4px}
/* benicio */
.spot{background:linear-gradient(135deg,rgba(56,189,248,.12),rgba(167,139,250,.1));border:1px solid rgba(56,189,248,.3);border-radius:18px;padding:20px}
.spot-h{display:flex;flex-wrap:wrap;align-items:center;gap:14px;justify-content:space-between}
.spot-h .nm{font-size:1.5rem;font-weight:900}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:.72rem;padding:4px 10px;border-radius:12px;background:rgba(255,255,255,.07);border:1px solid var(--border)}
.chip.gold{background:rgba(251,191,36,.15);border-color:rgba(251,191,36,.4);color:var(--gold)}
.lvcol h4{font-size:.78rem;font-weight:800;margin-bottom:6px;display:flex;justify-content:space-between}
.lvcol table td{padding:5px 6px;font-size:.76rem}
.evhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;margin:22px 0 8px;padding-top:12px;border-top:1px solid var(--border)}
.evhead b{font-size:1.05rem}
.spark{vertical-align:middle}
.insight{font-size:.84rem;line-height:1.55}
.insight li{margin:4px 0 4px 18px}
.detail{margin-top:14px}
.close{float:right;cursor:pointer;color:var(--soft);font-size:.8rem;border:1px solid var(--border);border-radius:8px;padding:4px 10px;background:transparent}
.keyev{margin-top:12px}
.keyev .kh{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.keyev .kh b{font-size:1.05rem}
.ss{font-size:.62rem;padding:1px 6px;border-radius:8px;background:rgba(52,211,153,.18);color:var(--green);margin-left:4px;font-weight:700}
/* navegación */
.mainnav{position:sticky;top:0;z-index:20;display:flex;gap:8px;padding:10px 0;margin:10px 0 0;background:linear-gradient(var(--bg) 70%,transparent)}
.mainnav button{flex:1;border:1px solid var(--border);background:var(--card);color:var(--soft);padding:12px;border-radius:12px;font-weight:800;font-size:.9rem;cursor:pointer}
.mainnav button.act{background:linear-gradient(135deg,rgba(56,189,248,.25),rgba(167,139,250,.2));color:#fff;border-color:rgba(56,189,248,.55)}
.subnav{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 4px}
.subnav a{font-size:.74rem;font-weight:700;color:var(--soft);text-decoration:none;border:1px solid var(--border);border-radius:20px;padding:5px 11px;background:var(--card)}
.subnav a:hover{color:#fff}
.bsec{scroll-margin-top:70px}
.bars .br{display:grid;grid-template-columns:110px 1fr 54px;gap:8px;align-items:center;margin:5px 0;font-size:.8rem}
.bars .bt{height:12px;border-radius:6px;background:rgba(255,255,255,.06);overflow:hidden}
.bars .bf{height:100%;border-radius:6px;background:linear-gradient(90deg,#38bdf8,#a78bfa)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(max-width:760px){.two{grid-template-columns:minmax(0,1fr)}}
.ok{color:var(--green);font-weight:800}.ko{color:var(--red)}
.meter{height:6px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:3px;min-width:70px}
.meter i{display:block;height:100%;background:var(--green)}
.meter i.w{background:var(--gold)}.meter i.f{background:var(--red)}
.card ul.insight li{margin:5px 0 5px 18px}
footer{text-align:center;color:var(--soft);font-size:.72rem;margin-top:40px}
</style>
</head>
<body>
<div class="page">
  <header class="hero">
    <div class="badge">Club Natación Axarquía · Datos RFEN</div>
    <h1>Arranque de <span>temporada 26-27</span></h1>
    <div class="muted small" id="sub"></div>
    <div class="kpis" id="kpis"></div>
    <div class="note" id="note"></div>
  </header>

  <nav class="mainnav" id="mainnav">
    <button data-view="club">🏊 Club por categorías</button>
    <button data-view="benicio" id="nav-ben">⭐ Benicio</button>
  </nav>

  <div id="view-club" class="view">
    <section id="comparativa"></section>
    <section id="destacados"></section>
    <h2>🏊 El club por categorías 26-27</h2>
    <div class="tabs" id="cat-tabs"></div>
    <div id="cat-body"></div>
  </div>

  <div id="view-benicio" class="view" hidden>
    <section id="benicio"></section>
  </div>

  <footer id="foot"></footer>
  <div id="modal"><div class="box"></div></div>
</div>

<script>
const DATA = /*__DATA__*/null;
/* Mínimas XIII Campeonato de España Alevín 2026 (RFEN, normativa 26-406, oct. 2025).
   Tabla A = piscina 50 m · Tabla B = piscina 25 m · columnas 12 años (1er año) y 13 años (2º año). */
const MIN_FUENTE='https://cdn.rfen.es/sectionFiles/1760433205_3991.pdf';
const MINIMAS = (()=>{const t=s=>{const[m,r]=s.split(':');const[a,b]=r.split(',');return +m*6000+ +a*100+ +b;};
  const raw={
   '50m':{M:{'50 Libre':['00:28,10','00:30,15'],'100 Libre':['01:02,00','01:06,45'],'200 Libre':['02:16,00','02:25,70'],'400 Libre':['04:50,00','05:08,00'],'800 Libre':['09:57,00','10:40,00'],
            '50 Espalda':['00:33,15','00:35,90'],'100 Espalda':['01:11,15','01:16,90'],'200 Espalda':['02:34,75','02:45,00'],
            '50 Braza':['00:36,25','00:39,35'],'100 Braza':['01:20,00','01:26,00'],'200 Braza':['02:53,95','03:06,00'],
            '50 Mariposa':['00:30,90','00:33,70'],'100 Mariposa':['01:09,85','01:15,20'],'200 Mariposa':['02:37,90','02:50,00'],
            '200 Estilos':['02:35,00','02:45,00'],'400 Estilos':['05:32,70','05:52,50']},
          F:{'50 Libre':['00:29,30','00:30,85'],'100 Libre':['01:03,90','01:07,60'],'200 Libre':['02:20,00','02:27,00'],'400 Libre':['04:54,35','05:11,00'],'800 Libre':['10:07,45','10:47,00'],
            '50 Espalda':['00:33,95','00:36,55'],'100 Espalda':['01:13,30','01:17,50'],'200 Espalda':['02:37,15','02:47,80'],
            '50 Braza':['00:37,25','00:39,60'],'100 Braza':['01:21,95','01:26,70'],'200 Braza':['02:58,00','03:08,00'],
            '50 Mariposa':['00:31,75','00:33,85'],'100 Mariposa':['01:12,00','01:16,50'],'200 Mariposa':['02:41,40','02:53,00'],
            '200 Estilos':['02:39,00','02:48,00'],'400 Estilos':['05:38,10','05:58,00']}},
   '25m':{M:{'50 Libre':['00:26,75','00:28,70'],'100 Libre':['00:59,95','01:04,25'],'200 Libre':['02:11,55','02:20,85'],'400 Libre':['04:39,70','04:57,30'],'800 Libre':['09:41,75','10:23,85'],
            '50 Espalda':['00:31,15','00:33,75'],'100 Espalda':['01:06,70','01:12,05'],'200 Espalda':['02:25,95','02:35,75'],
            '50 Braza':['00:34,90','00:37,90'],'100 Braza':['01:17,80','01:23,60'],'200 Braza':['02:46,65','02:55,30'],
            '50 Mariposa':['00:29,60','00:32,30'],'100 Mariposa':['01:07,45','01:12,60'],'200 Mariposa':['02:32,95','02:44,70'],
            '200 Estilos':['02:28,15','02:37,75'],'400 Estilos':['05:22,25','05:41,55']},
          F:{'50 Libre':['00:28,35','00:29,85'],'100 Libre':['01:02,15','01:05,70'],'200 Libre':['02:17,65','02:24,50'],'400 Libre':['04:48,00','05:04,35'],'800 Libre':['09:58,35','10:37,50'],
            '50 Espalda':['00:31,90','00:34,35'],'100 Espalda':['01:09,35','01:13,30'],'200 Espalda':['02:30,65','02:40,90'],
            '50 Braza':['00:36,25','00:38,35'],'100 Braza':['01:19,70','01:24,35'],'200 Braza':['02:51,50','03:01,20'],
            '50 Mariposa':['00:31,15','00:33,20'],'100 Mariposa':['01:08,80','01:13,10'],'200 Mariposa':['02:38,20','02:49,45'],
            '200 Estilos':['02:33,35','02:42,05'],'400 Estilos':['05:26,75','05:46,15']}}};
  const o={}; for(const pl in raw){o[pl]={}; for(const g in raw[pl]){o[pl][g]={}; for(const ev in raw[pl][g]){const [a13,a12]=raw[pl][g][ev]; o[pl][g][ev]={13:t(a13),12:t(a12)};}}}
  return o;})();
const LV = [['ma','Málaga'],['an','Andalucía'],['es','España']];
const SW = Object.fromEntries(DATA.swimmers.map(s=>[s.id,s]));
const CATG = {M:'Masculino',F:'Femenino'};

const fmt = cs => { const m=Math.floor(cs/6000), s=Math.floor(cs%6000/100), c=cs%100;
  return (m?m+':'+String(s).padStart(2,'0'):s)+'.'+String(c).padStart(2,'0'); };
const gapS = d => d===0?'—':(d>0?'+':'−')+(Math.abs(d)/100).toFixed(2);
const posB = (p,t) => `<span class="pos ${p==1?'p1':p==2?'p2':p==3?'p3':p<=10?'p10':''}">${p}º</span>${t?`<span class="tot"> /${t}</span>`:''}`;
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const club = c => esc(c.replace(/^C\.?\s?D\.?\s?N\.?\s?|^C\.?\s?N\.?\s?|^CLUB NATACION /i,'').trim()).slice(0,26);
const scopeKey = (s,sk) => sk==='y' ? `${s.g}|${s.y}` : `${s.g}|${s.cat}`;
const scopeLbl = (s,sk) => sk==='y' ? `nacidos en ${s.y}` : `${s.catl} ${CATG[s.g].toLowerCase()} 26-27 (${s.y-s.cy+1}-${s.y-s.cy+2})`;

const SEASON_NEW='2026-09-01';
const dfmt = d => d ? d.slice(8,10)+'/'+d.slice(5,7)+'/'+d.slice(2,4) : '—';
const dcls = d => !d ? '' : d>=SEASON_NEW ? 'new' : d<'2026-01-01' ? 'old' : '';
const dtag = d => `<span class="dt ${dcls(d)}" title="${d>=SEASON_NEW?'Temporada 26-27':d<'2026-01-01'?'Marca de hace tiempo':'Temporada 25-26'}">${dfmt(d)}</span>`;
function spark(h){
  if(!h || h.length<2) return '';
  const W=90,H=24, v=h.map(x=>x[1]), mn=Math.min(...v), mx=Math.max(...v), r=mx-mn||1;
  const pts=v.map((y,i)=>`${(i/(v.length-1)*W).toFixed(1)},${(2+(mx-y)/r*(H-4)).toFixed(1)}`).join(' ');
  return `<svg class="spark" width="${W}" height="${H}"><polyline fill="none" stroke="#38bdf8" stroke-width="1.6" points="${pts}"/></svg>`;
}
function evoCell(s,e){
  const h=e.h.filter(x=>x[2]===e.pool);
  return `<button class="evbtn" data-evo="${s.id}|${e.e}" title="Ver todas las marcas y su evolución">${spark(h)||'📈'} Ver</button>`;
}
function improv(e){ const d=e.first-e.cs; return d>0?`<span class="gap-b">−${(d/100).toFixed(2)}s</span>`:'<span class="muted">=</span>'; }

/* ── KPIs ── */
function kpis(){
  let t10=0,podAn=0,oroMa=0,ptsT=0;
  DATA.swimmers.forEach(s=>s.ev.forEach(e=>{const r=e.rk.y||{};
    if(r.es&&r.es[0]<=10)t10++; if(r.an&&r.an[0]<=3)podAn++; if(r.ma&&r.ma[0]==1)oroMa++; ptsT+=e.pts;}));
  const K=(DATA.comparativa||{}).kpi||{};
  const k=[[DATA.swimmers.length,'Nadadores del club en ranking',K.sw,'sw||'],[t10,'Pruebas en top-10 España (por año)',K.t10,'pos|es10|'],
    [podAn,'Pruebas en podio Andalucía (por año)',K.pod,'pos|an3|'],[oroMa,'Pruebas nº1 en Málaga (por año)',K.oro,'pos|ma1|'],
    [DATA.cats.length,'Categorías con nadadores',null,'cat||']];
  document.getElementById('kpis').innerHTML=k.map(([v,l,c,st])=>`<div class="kpi" data-stat="${st}" title="Ver el detalle"><b>${v}</b><span>${l}</span>${c?cmpLines(c):''}<span class="vd">Ver detalle ›</span></div>`).join('');
  document.getElementById('sub').textContent=`Mejores marcas recolocadas en las categorías 26-27 · Actualizado ${DATA.fecha}`;
  document.getElementById('note').innerHTML = DATA.new_marks
    ? `La temporada 26-27 ya tiene ${DATA.new_marks.toLocaleString('es')} marcas en RFEN. Para cada nadador se usa su mejor marca entre la 25-26 y la 26-27 (las de la nueva temporada llevan la etiqueta <span class="ss">26-27</span>).`
    : `⏱️ La RFEN todavía no tiene ninguna marca de la temporada 26-27. Este es el <b>punto de partida</b>: lo mejor que cada nadador hizo en la 25-26, comparado con quienes serán sus rivales en la nueva categoría. Mejor marca en cualquier piscina (25 m o 50 m), como el ranking RFEN «todas las piscinas».`;
  document.getElementById('foot').innerHTML=`Fuente: ranking RFEN temporadas 25-26 y 26-27 (todas las piscinas y cronos) · Andalucía = clubes de las 8 provincias andaluzas · Málaga = clubes de la provincia · Puntos FINA/World Aquatics = 1000×(récord/marca)³`;
}

/* ── Comparación con el resto de clubes ── */
const medal = p => p==1?'🥇':p==2?'🥈':p==3?'🥉':'';
const LVN = {ma:'Málaga',an:'Andalucía',es:'España'};
function cmpLines(c){
  return '<span class="cmp">'+LV.filter(([lv])=>c[lv]).map(([lv,l])=>

/* Panel de puesto del club en Málaga / Andalucía / España.
   C = bloque de DATA.comparativa (club entero o una categoría), id = prefijo único,
   suf = '' o ' en Alevín masculino' para los textos. */
function cmpPanel(C,id,suf){
  const show=lv=>{
    const L=C.lv[lv], me=L.rows.find(x=>x[7]), up=L.rows.find(x=>x[0]===L.pos-1);
    const r=L.r, ent={ma:'de la provincia de Málaga',an:'de Andalucía',es:'de España'}[lv];
    let msg = L.pos===1
      ? (L.rows[1] ? `🏆 <b>Mejor club ${ent}${suf}</b> en esta cuenta. El segundo, ${esc(L.rows[1][1])}, suma ${L.rows[1][4]} presencias en el top-8 frente a las ${me[4]} del club.`
                   : `🏆 <b>Único club ${ent}</b> con nadadores${suf}.`)
      : `Para subir al ${L.pos-1}º puesto, por delante de <b>${esc(up[1])}</b>, faltan <b>${up[4]-me[4]+1}</b> presencias más en el top-8.`;
    const met=(v,lbl,rk,u='',st='')=>{const pct=rk[2]?Math.round(v/rk[2]*100):0;
      return `<div data-stat="${st}|${C.key||''}" title="Ver el detalle"><b>${v.toLocaleString('es')}${u}</b> <span class="pos ${rk[0]==1?'p1':rk[0]==2?'p2':rk[0]==3?'p3':rk[0]<=10?'p10':''}">${rk[0]}º</span><span class="lbl">${lbl} · el mejor club tiene ${rk[2].toLocaleString('es')}${u}</span><div class="meter"><i class="${pct>=75?'':pct>=40?'w':'f'}" style="width:${pct}%"></i></div><span class="vd">Ver detalle ›</span></div>`;};
    let h=`<div class="cmp-head"><div class="cmp-pos lv-${lv}">${medal(L.pos)}${L.pos}º <small>de ${L.t}</small></div>
      <div class="cmp-txt"><b>C.N. Axarquía es el ${L.pos}º club ${ent}${suf}</b><div class="insight" style="margin-top:4px">${msg}</div></div></div>
      <div class="cmp-m">${met(me[4],'Presencias en el top-8',r.t8,'','pos|'+lv+'8')}${met(me[5],'Pruebas nº1',r.n1,'','pos|'+lv+'1')}${met(me[3],'Nadadores en ranking',r.sw,'','sw|'+lv)}${met(me[6],'Nivel medio (pts World Aquatics)',r.avg,' pts','avg|'+lv)}</div>
      <div class="card" style="margin-top:14px"><div class="tw"><table class="cmp-t"><tr><th>#</th><th>Club</th><th class="num">Nadad.</th><th class="num">Top-8</th><th class="num">Nº1</th><th class="num">Nivel</th></tr>`;
    L.rows.forEach((x,k)=>{ if(k>0&&x[0]-L.rows[k-1][0]>1) h+=`<tr class="sep"><td colspan="6">· · ·</td></tr>`;
      h+=`<tr class="${x[7]?'me':''}"><td>${posB(x[0])}</td><td class="cn">${esc(x[1])}${lv==='ma'?'':`<div class="tot">${esc(x[2])}</div>`}</td><td class="num">${x[3]}</td><td class="num">${x[4]}</td><td class="num">${x[5]}</td><td class="num">${x[6]}</td></tr>`;});
    h+=`</table></div><p class="muted small" style="margin-top:8px">Nivel medio = media de los puntos World Aquatics de la mejor marca de cada nadador del club.</p></div>`;
    document.getElementById(id+'-body').innerHTML=h;
    document.querySelectorAll('#'+id+'-seg button').forEach(b=>b.classList.toggle('act',b.dataset.v===lv));};
  document.querySelectorAll('#'+id+'-seg button').forEach(b=>b.onclick=()=>show(b.dataset.v));
  show('ma');
}
const cmpHtml = id => `<div class="seg" id="${id}-seg">${LV.map(([lv,l])=>`<button data-v="${lv}">${l}</button>`).join('')}</div>

/* ── Paneles de rivales de una prueba ── */
function rivalCols(s,e,sk,n=10){
  const L = DATA.lists[scopeKey(s,sk)+'|'+e.e]; if(!L) return '';
  return `<div class="grid3">`+LV.map(([lv,lbl])=>{
    const r = e.rk[sk]&&e.rk[sk][lv]; if(!r) return `<div class="card lvcol"><h4 class="lv-${lv}">${lbl}</h4><div class="muted small">No aplica</div></div>`;
    let rows = L[lv].filter(x=>x[5]<=n), html='';
    const isMe = x => x[0]===s.n && x[6]===s.y;
    rows.forEach(x=>html+=rowR(x,e,isMe));
    if(r[0]>n){ html+=`<tr class="sep"><td colspan="4">· · ·</td></tr>`; e.nb[sk][lv].filter(x=>x[5]>n).forEach(x=>html+=rowR(x,e,isMe)); }
    return `<div class="card lvcol"><h4><span class="lv-${lv}">${lbl}</span><span>${posB(r[0],r[1])}</span></h4>
      <div class="tw"><table>${html}</table></div></div>`;
  }).join('')+`</div>`;
}
function rowR(x,e,isMe){
  const me=isMe(x), d=x[3]-e.cs;
  return `<tr class="${me?'me':x[7]?'club':''}"><td>${posB(x[5])}</td><td title="${esc(x[1])}">${esc(x[0])}<div class="tot">${club(x[1])}${x[6]?' · '+x[6]:''}</div></td>
    <td class="num">${fmt(x[3])}<div>${dtag(x[8])}</div></td><td class="num ${d<0?'gap-a':'gap-b'}">${me?'':gapS(d)}</td></tr>`;
}

/* ── Resumen de rivales directos (texto) ── */
function rivalText(s,e,sk){
  const out=[];
  LV.forEach(([lv,lbl])=>{
    const r=e.rk[sk]&&e.rk[sk][lv]; if(!r) return;
    const nb=e.nb[sk][lv], i=nb.findIndex(x=>x[0]===s.n&&x[6]===s.y);
    const ahead=nb[i-1], behind=nb[i+1];
    let t=`<b class="lv-${lv}">${lbl}</b>: ${r[0]}º de ${r[1]}`;
    if(r[0]==1) t+= behind?` · le sigue ${esc(behind[0])} (${club(behind[1])}) a ${gapS(behind[3]-e.cs)}s`:'';
    else t+=` · a ${gapS(r[2])}s del líder · delante: ${esc(ahead[0])} (${club(ahead[1])}) a ${(Math.abs(ahead[3]-e.cs)/100).toFixed(2)}s`;
    out.push(t);
  });
  return out.join('<br>');
}

  sk = hasCat?sk:'y';
  let h=`<div class="spot-h"><div><div class="nm">${esc(s.n)}</div>
     <div class="muted small">${s.y} · ${CATG[s.g]} · ${s.catl?`${s.catl} ${s.cy}º año en 26-27`:'Fuera de categorías'} · ${s.np} pruebas · última competición ${s.last||'—'}</div></div>
     <div class="seg" data-sk>${hasCat?`<button data-v="c" class="${sk==='c'?'act':''}">Categoría ${esc(s.catl||'')} completa</button>`:''}<button data-v="y" class="${sk==='y'?'act':''}">Solo nacidos en ${s.y}</button></div></div>`;
  const chips=[];
  s.ev.forEach(e=>{const r=e.rk[sk]||{};
    if(r.es&&r.es[0]<=10) chips.push(`<span class="chip gold">🇪🇸 ${r.es[0]}º España · ${e.e}</span>`);
    else if(r.an&&r.an[0]<=3) chips.push(`<span class="chip">🟢 ${r.an[0]}º Andalucía · ${e.e}</span>`);
    else if(r.ma&&r.ma[0]==1) chips.push(`<span class="chip">🔵 1º Málaga · ${e.e}</span>`);});
  (DATA.destacados||[]).filter(x=>x.id===s.id).forEach(x=>chips.unshift(`<span class="chip ${x.pos<=3?'gold':''}">🏆 ${x.pos}º ${x.lv==='es'?'Cto. España':'Cto. Andalucía'} · ${x.ev} (${dfmt(x.date)})</span>`));
  h+=`<div class="chips">${chips.join('')}</div>`;
  h+=`<p class="muted small" style="margin-top:8px">Comparando con: <b>${scopeLbl(s,sk)}</b></p>`;
  h+=`<div class="tw" style="margin-top:10px"><table><tr><th>Prueba</th><th class="num">Mejor marca</th><th class="num">Pts FINA</th><th>Piscina</th><th>Fecha</th><th title="Puesto en la competición donde hizo esa marca (entre los de su año)">Puesto comp.</th><th class="lv-ma">Málaga</th><th class="lv-an">Andalucía</th><th class="lv-es">España</th><th>Evolución</th><th class="num">Mejora vs 1ª marca</th></tr>`;
  s.ev.forEach(e=>{const r=e.rk[sk]||{};
    h+=`<tr><td><b>${e.e}</b>${e.ss==='26-27'?'<span class="ss">26-27</span>':''}</td><td class="num">${fmt(e.cs)}</td><td class="num">${e.pts}</td><td class="muted">${e.pool}</td><td>${dtag(e.date)}</td><td>${e.cpos?posB(e.cpos[0])+'<span class="tot"> de '+e.cpos[1]+'</span>':'<span class="muted">—</span>'}</td>
      ${LV.map(([lv])=>`<td>${r[lv]?posB(r[lv][0],r[lv][1]):'—'}</td>`).join('')}<td>${evoCell(s,e)}</td><td class="num">${improv(e)}</td></tr>`;});
  h+=`</table></div>`;
  const evs = full ? s.ev : s.ev.slice(0,6);
  evs.forEach(e=>{
    h+=`<div class="evhead"><b>${e.e}</b><span class="muted small">${fmt(e.cs)} · ${e.pts} pts${e.cpos?` · ${e.cpos[0]}º de ${e.cpos[1]} en la competición`:''} · ${esc(e.comp)} (${esc(e.loc)}, ${dfmt(e.date)}, ${e.pool}) · temporada ${e.ss}</span><button class="evbtn" data-evo="${s.id}|${e.e}">📈 Evolución</button></div>
       <div class="insight small" style="margin-bottom:8px">${rivalText(s,e,sk)}</div>${rivalCols(s,e,sk)}`;});
  if(!full && s.ev.length>6) h+=`<p style="margin-top:12px"><button class="tab" data-more>Ver las ${s.ev.length-6} pruebas restantes</button></p>`;
  host.innerHTML=h;
  host.querySelectorAll('[data-sk] button').forEach(b=>b.onclick=()=>swimmerDetail(s,b.dataset.v,host,full));

    LV.forEach(([lv,lbl])=>{const R=lvs[lv][kPool]; const ref=Object.fromEntries(R.refs.map(r=>[r[0],r]));

        ${[1,3,8,16,24].map(p=>ref[p]?`<td class="num" title="${esc(ref[p][2])} · ${esc(ref[p][3])}">${fmt(ref[p][1])}<div class="tot">${esc(ref[p][2].split(' ').slice(0,2).join(' '))}</div>${dtag(ref[p][4])}</td>`:'<td class="num muted">—</td>').join('')}
        <td class="num">${R.med?fmt(R.med):'—'}</td><td class="num">${need===null?'—':need<=0?'<span class="gap-b">✓ dentro</span>':`<span class="gap-a">−${(need/100).toFixed(2)}s</span>`}</td></tr>`;});

  host.querySelectorAll('#k-sc button').forEach(b=>{b.classList.toggle('act',b.dataset.v===kSc);b.onclick=()=>{kSc=b.dataset.v;claves(s);};});

/* ── Sección Benicio ── */
const STROKES=['Libre','Espalda','Braza','Mariposa','Estilos'];
const strokeOf=ev=>ev.split(' ').slice(1).join(' ');
const distOf=ev=>+ev.split(' ')[0];
function bestPoolMarks(e){   // mejor marca por piscina (sin parciales) con su fecha
  const o={}; e.h.forEach(x=>{ if(x[8]) return; if(!o[x[2]]||x[1]<o[x[2]][1]) o[x[2]]=x; }); return o;
}
function pctTxt(p){ return (p>0?'+':'')+p.toFixed(1)+'%'; }

function benicio(){
  const s=DATA.swimmers.find(x=>x.benicio); if(!s){ document.getElementById('nav-ben').hidden=true; return; }
  const sec=document.getElementById('benicio');
  const age = s.cy===1?12:13;             // 1er año alevín ↔ columna «12 años»
  const evMap=Object.fromEntries(s.ev.map(e=>[e.e,e]));
  const evY=s.ev.map(e=>({e,r:e.rk.y||{},c:e.rk.c||{}}));

  // ── Resumen / KPIs
  const top10=evY.filter(x=>x.r.es&&x.r.es[0]<=10).length;
  const maOne=evY.filter(x=>x.r.ma&&x.r.ma[0]==1).length;
  const anFin=evY.filter(x=>x.r.an&&x.r.an[0]<=8).length;
  const comps=new Set(), swims=[]; s.ev.forEach(e=>e.h.forEach(x=>{ if(!x[8]){comps.add(x[0]+'|'+x[3]); swims.push([x,e.e]);} }));

  // ── Mínimas
  const minRows=Object.keys(MINIMAS['50m'][s.g]).map(ev=>{
    const e=evMap[ev], bp=e?bestPoolMarks(e):{};
    const r={ev,e,pools:{}};
    ['50m','25m'].forEach(pl=>{ const m=MINIMAS[pl][s.g][ev][age], m2=MINIMAS[pl][s.g][ev][13], x=bp[pl];
      r.pools[pl]={min:m,min13:m2,x,d:x?x[1]-m:null,p:x?(x[1]-m)/m*100:null}; });
    const ps=['50m','25m'].map(pl=>r.pools[pl].p).filter(v=>v!==null);
    r.bestp=ps.length?Math.min(...ps):null; return r;});
  const minOk=minRows.filter(r=>r.bestp!==null&&r.bestp<=0).length;
  const minClose=minRows.filter(r=>r.bestp!==null).sort((a,b)=>a.bestp-b.bestp);

  // ── Puntos fuertes / a mejorar
  const F=[], M=[];
  const byPts=[...s.ev].sort((a,b)=>b.pts-a.pts);
  F.push(`Sus pruebas de más nivel (puntos World Aquatics): ${byPts.slice(0,3).map(e=>`<b>${e.e}</b> ${e.pts} pts`).join(', ')}.`);
  const t10=evY.filter(x=>x.r.es&&x.r.es[0]<=10);
  if(t10.length) F.push(`Top-10 de España entre los nacidos en ${s.y}: ${t10.map(x=>`<b>${x.e.e}</b> (${x.r.es[0]}º de ${x.r.es[1]})`).join(', ')}.`);
  const mo=evY.filter(x=>x.r.ma&&x.r.ma[0]==1);
  if(mo.length) F.push(`Número 1 de Málaga en: ${mo.map(x=>`<b>${x.e.e}</b>`).join(', ')}.`);
  if(minClose.length) F.push(`Más cerca de la mínima de España (${age} años): ${minClose.slice(0,3).map(r=>`<b>${r.ev}</b> (${r.bestp<=0?'✓ conseguida':'a '+pctTxt(r.bestp)})`).join(', ')}.`);
  const prog=s.ev.map(e=>{const h=e.h.filter(x=>x[2]===e.pool&&!x[8]).sort((a,b)=>a[0]<b[0]?-1:1); return {e,n:h.length,imp:h.length>1?(h[0][1]-e.cs)/h[0][1]*100:0,last:h.length?h[h.length-1][0]:''};});
  const bestProg=[...prog].filter(p=>p.n>2).sort((a,b)=>b.imp-a.imp).slice(0,3);
  if(bestProg.length) F.push(`Mayor progresión en la temporada: ${bestProg.map(p=>`<b>${p.e.e}</b> (−${p.imp.toFixed(1)}%)`).join(', ')}.`);
  const pend=Object.keys(MINIMAS['50m'][s.g]).filter(ev=>!evMap[ev]);
  const claveSin=(DATA.claves?DATA.claves.events.map(x=>x.e):[]).filter(ev=>!evMap[ev]);
  if(claveSin.length) M.push(`<b>${claveSin.join(', ')}</b>: sin marca y es prueba clave para el Campeonato de Andalucía. Hay que nadarla pronto para tener tiempo de referencia.`);
  if(pend.length) M.push(`Pruebas del programa del Campeonato de España que aún no ha nadado: ${pend.join(', ')}.`);
  const low=byPts.slice(-3).reverse();
  M.push(`Pruebas con menos puntos: ${low.map(e=>`<b>${e.e}</b> ${e.pts} pts`).join(', ')}.`);
  const far=minRows.filter(r=>r.bestp!==null&&r.bestp>10).sort((a,b)=>b.bestp-a.bestp).slice(0,3);
  if(far.length) M.push(`Más lejos de la mínima de España: ${far.map(r=>`<b>${r.ev}</b> (a ${pctTxt(r.bestp)})`).join(', ')}.`);
  const threat=[]; s.ev.forEach(e=>{ const nb=(e.nb.y||{}).ma; if(!nb) return; const i=nb.findIndex(x=>x[0]===s.n&&x[6]===s.y), b=nb[i+1];
    if(b&&b[3]-e.cs<100) threat.push(`<b>${e.e}</b>: ${esc(b[0])} (${club(b[1])}) a solo ${((b[3]-e.cs)/100).toFixed(2)}s`); });
  if(threat.length) M.push(`Rivales de Málaga que le pisan los talones (menos de 1 s): ${threat.join('; ')}.`);
  const lastComp=s.last;
  const stale=prog.filter(p=>p.n>1&&p.e.date&&lastComp&&(Date.parse(lastComp)-Date.parse(p.e.date))/864e5>120);
  if(stale.length) M.push(`Sin mejorar su marca en más de 4 meses: ${stale.map(p=>`<b>${p.e.e}</b> (mejor del ${dfmt(p.e.date)})`).join(', ')}.`);

  // ── Perfil por estilo y distancia
  const perfil=(keyFn,keys)=>keys.map(k=>{const es=s.ev.filter(e=>keyFn(e.e)===k); return [k,es.length?Math.round(es.reduce((a,e)=>a+e.pts,0)/es.length):0,es.length];});
  const pSt=perfil(strokeOf,STROKES), pDi=perfil(e=>{const d=distOf(e);return d<=50?'50 m':d<=100?'100 m':d<=200?'200 m':'400 m o más';},['50 m','100 m','200 m','400 m o más']);
  const maxP=Math.max(...pSt.map(x=>x[1]),...pDi.map(x=>x[1]),1);
  const bars=arr=>`<div class="bars">${arr.map(([k,v,n])=>`<div class="br"><span>${k} <span class="tot">${n} pr.</span></span><div class="bt"><div class="bf" style="width:${v/maxP*100}%"></div></div><b class="num">${n?v:'—'}</b></div>`).join('')}</div>`;

  // ── Actividad
  const months={}; swims.forEach(([x])=>{const m=x[0].slice(0,7); months[m]=(months[m]||0)+1;});
  const mk=Object.keys(months).sort(), mmax=Math.max(...Object.values(months),1);
  const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  const compList={}; swims.forEach(([x,ev])=>{const k=x[0]+'|'+x[3]; (compList[k]=compList[k]||{d:x[0],c:x[3],l:x[4],n:0,pb:0,pod:0}); compList[k].n++; if(x[6]&&x[6]<=3) compList[k].pod++;});
  // marcas personales: cuántas veces mejoró
  s.ev.forEach(e=>{ const byPool={}; [...e.h].filter(x=>!x[8]).sort((a,b)=>a[0]<b[0]?-1:1).forEach(x=>{ if(byPool[x[2]]===undefined||x[1]<byPool[x[2]]){ if(byPool[x[2]]!==undefined) compList[x[0]+'|'+x[3]].pb++; byPool[x[2]]=x[1]; } }); });

/* ── Evolución detallada (ventana) ── */
function evoChart(rows){
  const W=860,H=270,P={l:58,r:30,t:20,b:40};
  const ts=rows.map(x=>Date.parse(x[0])), v=rows.map(x=>x[1]);
  const t0=Math.min(...ts), t1=Math.max(...ts), tr=(t1-t0)||1;
  const mn=Math.min(...v), mx=Math.max(...v), pad=Math.max((mx-mn)*0.12,20), lo=mn-Math.max((mx-mn)*0.3,45), hi=mx+pad;
  const X=t=>P.l+(t-t0)/tr*(W-P.l-P.r), Y=c=>P.t+(hi-c)/(hi-lo)*(H-P.t-P.b);   // tiempo más alto arriba, mejor marca abajo
  let g='';
  for(let k=0;k<=4;k++){const c=lo+(hi-lo)*k/4, y=Y(c);
    g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${y}" y2="${y}" stroke="rgba(255,255,255,.07)"/><text x="${P.l-8}" y="${y+4}" fill="#8193ad" font-size="11" text-anchor="end">${fmt(Math.round(c))}</text>`;}
  const months=[]; const d=new Date(t0); d.setDate(1);
  while(d.getTime()<=t1){ if(d.getTime()>=t0) months.push(d.getTime()); d.setMonth(d.getMonth()+1); }
  const step=Math.ceil(months.length/8)||1;
  months.forEach((m,k)=>{ if(k%step) return; const x=X(m), dd=new Date(m);
    g+=`<line x1="${x}" x2="${x}" y1="${P.t}" y2="${H-P.b}" stroke="rgba(255,255,255,.04)"/><text x="${x}" y="${H-P.b+16}" fill="#8193ad" font-size="11" text-anchor="middle">${['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'][dd.getMonth()]} ${String(dd.getFullYear()).slice(2)}</text>`;});
  // línea de mejor marca acumulada
  let best=Infinity; const pbPts=[];
  rows.forEach(x=>{ if(x[1]<best){best=x[1];} pbPts.push([X(Date.parse(x[0])),Y(best)]); });
  g+=`<polyline fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="4 3" points="${pbPts.map(p=>p.join(',')).join(' ')}"/>`;
  g+=`<polyline fill="none" stroke="#38bdf8" stroke-width="2" points="${rows.map(x=>X(Date.parse(x[0]))+','+Y(x[1])).join(' ')}"/>`;
  best=Infinity;
  rows.forEach(x=>{ const pb=x[1]<best; if(pb) best=x[1];
    const cx=X(Date.parse(x[0])), cy=Y(x[1]);
    g+=`<circle cx="${cx}" cy="${cy}" r="${pb?5:3.5}" fill="${pb?'#fbbf24':'#38bdf8'}"><title>${dfmt(x[0])} · ${fmt(x[1])} · ${esc(x[3]||'')}</title></circle>`;
    if(pb){ const anc=cx>W-90?'end':cx<P.l+40?'start':'middle';
      g+=`<text x="${cx}" y="${cy+18}" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="${anc}">${fmt(x[1])}</text><text x="${cx}" y="${cy+30}" fill="#8193ad" font-size="10" text-anchor="${anc}">${dfmt(x[0])}</text>`; }});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${g}</svg>`;
}

  if(x[8]) return '<span class="pill" title="Tiempo de paso dentro de una prueba más larga">parcial</span>';
  if(!x[6]) return '<span class="muted">—</span>';
  return `${posB(x[6])}<span class="tot"> de ${x[7]}</span>`;

      h+=`<tr class="${x[1]===e.cs&&pl===e.pool?'me':''}"><td>${dtag(x[0])}</td><td>${esc(x[3]||'—')}${x[9]&&x[9].length?`<div class="tot">También nadó ${x[9].map(o=>fmt(o[0])+(o[1]!==x[3]?' ('+esc(o[1])+')':'')).join(', ')} ese día · eliminatoria/final</div>`:''}</td><td class="muted">${esc(x[4]||'')}</td>
        <td class="num">${pb?'<span class="pb">★ </span>':''}${fmt(x[1])}</td><td>${puestoCell(x,s)}</td><td class="num">${x[5]||'—'}</td><td class="num">${dd(prev)}</td><td class="num">${k?dd(first):'—'}</td><td class="num">${k?dd(prevBest):'—'}</td></tr>`;});
    h+=`</table></div>`;});
  document.querySelector('#modal .box').innerHTML=h;
  document.getElementById('modal').classList.add('open');
  document.body.style.overflow='hidden';

/* ── Detalle de una tarjeta de estadísticas ──
   data-stat="tipo|nivel|ámbito": tipo = sw (nadadores) · pos (pruebas en un puesto) · avg (nivel medio) · cat (categorías);
   nivel = ma/an/es (+ puesto máximo en «pos», p. ej. es10, an3, ma1); ámbito = '' (club entero) o 'M|ALE' (una categoría). */
let statBack=null;
function openStat(st){
  const [kind,lvx,...sc]=st.split('|'), scope=sc.join('|'), lv=lvx.slice(0,2), mx=+lvx.slice(2)||0;
  const cat=scope?DATA.cats.find(c=>c.key===scope):null;
  const S=DATA.swimmers.filter(s=>!cat||(s.g===cat.g&&s.cat===cat.cat));
  const donde=cat?` · ${cat.label} ${CATG[cat.g].toLowerCase()}`:'';
  const C=scope?((DATA.comparativa||{}).cat||{})[scope]:DATA.comparativa;
  const rk=m=>{const r=C&&C.lv[lv]&&C.lv[lv].r[m]; return r?`<p class="small" style="margin:4px 0 10px">${medal(r[0])}<b class="lv-${lv}">${r[0]}º de ${r[1]} clubes</b> de ${LVN[lv]} en esta estadística · el mejor club tiene ${r[2].toLocaleString('es')}</p>`:'';};
  const top=k=>{const K=((DATA.comparativa||{}).kpi||{})[k]; return K?`<p class="small" style="margin:4px 0 10px">${cmpLines(K).replace('class="cmp"','')}</p>`:'';};
  const posLv=(e,l)=>{const r=(e.rk.y||{})[l]; return r?posB(r[0],r[1]):'—';};
  let h=`<button class="close" onclick="closeEvo()">Cerrar ✕</button>`, title='', intro='', body='';
  if(kind==='pos'){
    const R=[]; S.forEach(s=>s.ev.forEach(e=>{const r=(e.rk.y||{})[lv]; if(r&&r[0]<=mx) R.push([s,e,r]);}));
    R.sort((a,b)=>a[2][0]-b[2][0]||a[2][1]-b[2][1]||a[0].n.localeCompare(b[0].n));
    const nom={1:'nº1',3:'en el podio (top-3)',8:'en el top-8',10:'en el top-10'}[mx];
    title=`${R.length} pruebas ${nom} de ${LVN[lv]}${donde}`;
    intro=`Cada fila es una prueba en la que un nadador del club está ${nom} del ranking de ${LVN[lv]} entre los nacidos en su mismo año, con su mejor marca. Pulsa una fila para ver la evolución de esa prueba.`;
    const per={}; R.forEach(([s])=>per[s.id]=(per[s.id]||0)+1);
    const chips=Object.entries(per).sort((a,b)=>b[1]-a[1]).map(([id,n])=>`<span class="chip">${esc(SW[id].n)} <b>×${n}</b></span>`).join('');
    body=(R.length?`<div class="chips" style="margin-bottom:10px">${chips}</div>`:'')+`<div class="tw"><table><tr><th>Puesto</th><th>Nadador</th><th>Prueba</th><th class="num">Marca</th><th class="num">Pts</th><th>Fecha</th></tr>`+
      R.map(([s,e,r])=>`<tr class="click ${s.benicio?'me':''}" data-evo="${s.id}|${e.e}"><td>${posB(r[0],r[1])}</td><td>${esc(s.n)}<div class="tot">${s.y} · ${s.catl||''} ${s.g==='M'?'♂':'♀'}</div></td><td>${e.e}<div class="tot">${e.pool}</div></td><td class="num">${fmt(e.cs)}</td><td class="num">${e.pts}</td><td>${dtag(e.date)}</td></tr>`).join('')+'</table></div>';
    if(!R.length) body='<p class="muted small">Ninguna todavía.</p>';
    h+=`<div style="font-size:1.25rem;font-weight:900">${title}</div>`+(scope||lvx!=='es10'&&lvx!=='an3'&&lvx!=='ma1'?rk(mx===1?'n1':'t8'):top({es10:'t10',an3:'pod',ma1:'oro'}[lvx]));
  } else if(kind==='sw'||kind==='avg'){
    const R=S.map(s=>{const b=s.ev.reduce((a,e)=>!a||e.pts>a.pts?e:a,null); return [s,b];}).filter(x=>x[1]);
    R.sort(kind==='avg'?(a,b)=>b[1].pts-a[1].pts:(a,b)=>a[0].g.localeCompare(b[0].g)||a[0].y-b[0].y||a[0].n.localeCompare(b[0].n));
    const media=R.length?Math.round(R.reduce((a,x)=>a+x[1].pts,0)/R.length):0;
    title=kind==='avg'?`Nivel medio: ${media} pts World Aquatics${donde}`:`${S.length} nadadores del club en el ranking${donde}`;
    intro=kind==='avg'?`Media de los puntos World Aquatics de la mejor marca de cada nadador. Ordenados de más a menos puntos. Pulsa una fila para ver la evolución de su mejor prueba.`
      :`Todos los nadadores del club con marca en el ranking RFEN, con su mejor prueba (la de más puntos) y sus puestos entre los nacidos en su mismo año. Pulsa una fila para ver su evolución.`;
    body=`<div class="tw"><table><tr><th>Nadador</th><th>Año</th><th class="num">Pruebas</th><th>Mejor prueba</th><th class="num">Pts</th><th class="lv-ma">Málaga</th><th class="lv-an">Andalucía</th><th class="lv-es">España</th></tr>`+
      R.map(([s,e])=>`<tr class="click ${s.benicio?'me':''}" data-evo="${s.id}|${e.e}"><td>${esc(s.n)}</td><td>${s.y} <span class="tot">${s.catl||''} ${s.g==='M'?'♂':'♀'}</span></td><td class="num">${s.np}</td><td>${e.e} <span class="muted">${fmt(e.cs)}</span></td><td class="num">${e.pts}</td><td>${posLv(e,'ma')}</td><td>${posLv(e,'an')}</td><td>${posLv(e,'es')}</td></tr>`).join('')+'</table></div>';
    h+=`<div style="font-size:1.25rem;font-weight:900">${title}</div>`+(scope||lv?rk(kind):top('sw'));
  } else if(kind==='cat'){
    title=`${DATA.cats.length} categorías con nadadores`;
    intro='Categorías de la temporada 26-27 en las que el club tiene nadadores con marca. Pulsa una para ir a ella.';
    body=`<div class="tw"><table><tr><th>Categoría</th><th>Años</th><th class="num">Nadadores</th><th class="lv-ma">Málaga</th><th class="lv-an">Andalucía</th><th class="lv-es">España</th></tr>`+
      DATA.cats.map((c,i)=>{const CC=((DATA.comparativa||{}).cat||{})[c.key], p=l=>CC?posB(CC.lv[l].pos,CC.lv[l].t):'—';
        return `<tr class="click" data-cat="${i}"><td><b>${c.label} ${c.g==='M'?'♂':'♀'}</b></td><td>${c.yrs.join(' y ')}</td><td class="num">${c.ids.length}</td><td>${p('ma')}</td><td>${p('an')}</td><td>${p('es')}</td></tr>`;}).join('')+'</table></div>'+
      '<p class="muted small" style="margin-top:8px">Málaga / Andalucía / España = puesto del club en esa categoría frente al resto de clubes.</p>';
    h+=`<div style="font-size:1.25rem;font-weight:900">${title}</div>`;
  }
  h+=`<p class="muted small" style="margin-bottom:10px">${intro}</p>${body}`;
  statBack=st;
  document.querySelector('#modal .box').innerHTML=h;
  document.getElementById('modal').classList.add('open');
  document.getElementById('modal').scrollTop=0;
  document.body.style.overflow='hidden';
}
function closeEvo(){ document.getElementById('modal').classList.remove('open'); document.body.style.overflow=''; }
document.addEventListener('click',ev=>{
  const st=ev.target.closest('[data-stat]'), ct=ev.target.closest('#modal [data-cat]');
  if(st){ openStat(st.dataset.stat); return; }
  if(ct){ closeEvo(); showView('club'); showCat(+ct.dataset.cat); document.getElementById('cat-tabs').scrollIntoView({behavior:'smooth'}); return; }
  const b=ev.target.closest('[data-evo]');
  if(b){ const back=b.closest('#modal')&&statBack; const [id,...n]=b.dataset.evo.split('|'); openEvo(+id||id,n.join('|'));
    if(back) document.querySelector('#modal .box').insertAdjacentHTML('afterbegin',`<button class="close" style="float:left;margin-right:8px" onclick="openStat('${back}')">‹ Volver</button>`);
    document.getElementById('modal').scrollTop=0; }
  else if(ev.target.id==='modal') closeEvo(); });
document.addEventListener('keydown',ev=>{ if(ev.key==='Escape') closeEvo(); });

kpis(); comparativa(); destacados(); benicio(); catTabs(); showView(location.hash.startsWith('#b')?'benicio':'club');
</script>
</body>
</html>
