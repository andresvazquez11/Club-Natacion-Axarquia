# Intermediario del directo de la FAN (ver worker.js). Publicar: cd directo-proxy && npx wrangler deploy
name = "cna-directo"
main = "worker.js"
compatibility_date = "2024-09-23"

# Horario (UTC; Madrid = UTC+2 en verano, +1 en invierno): lanza el proceso «Directo FAN» de GitHub (ver worker.js → scheduled).
# Viernes a domingo cada 10 minutos de 5:00 a 21:59 UTC (días de competición); de lunes a jueves, una vez por hora.
[triggers]
crons = ["*/10 5-21 * * FRI,SAT,SUN", "41 6-21 * * MON-THU"]
