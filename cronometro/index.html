<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cronómetro Natación</title>
<meta name="description" content="Cronómetro de entrenamiento del Club Natación Axarquía">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Crono CNA">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>html,body{margin:0;padding:0}body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}/* iPhone con la app instalada: la barra de estado es transparente; esta franja fija (alto = zona de la hora) evita que el contenido pase por debajo al desplazarse */body::before{content:'';position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:#0f172a;z-index:1000;pointer-events:none}[hidden]{display:none!important}</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js" integrity="sha384-AQ3POAMqIhwS81FrUH95ekxqBZHeP5tG2JfEL3+7GuTtfRLWnrRh32UxwzM+//A9" crossorigin="anonymous"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js" integrity="sha384-TnlRYaR4JYz/lpaGuaiU61PjNberSA4vjLjtF+oRC/IkohkJqnWxw5EmDSOt1vA1" crossorigin="anonymous"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js" integrity="sha384-qn4Jh88HhJA8dplNQyGjOh9OGI4izVhrfj/qIFgaKcdgOE06pXqIKGlsCILZcLAC" crossorigin="anonymous"></script>
<script src="firebase-config.js"></script>
<script src="logica.js"></script>
</head>
<body>
<style>
:root{
  --bg:#0f172a;--surf:#1e293b;--brd:#334155;
  --txt:#e2e8f0;--mut:#94a3b8;
  --grn:#22c55e;--grn-l:#4ade80;--grn-s:#0c2a0c;
  --blu:#3b82f6;--blu-l:#93c5fd;--blu-s:#0c1a2a;
  --red:#ef4444;--amb:#f59e0b;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:15px;line-height:1.5;min-height:100vh;}
#app{max-width:480px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-left,0px)) max(32px,env(safe-area-inset-bottom,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
.btn{display:block;width:100%;padding:13px 16px;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;text-align:center;transition:opacity .12s;-webkit-tap-highlight-color:transparent;}
.btn:active{opacity:.75;}
.btn-green{background:var(--grn);color:#fff;}
.btn-blue{background:var(--blu);color:#fff;}
.btn-surf{background:var(--surf);color:var(--txt);border:1px solid var(--brd);}
.btn-red-line{background:transparent;color:var(--red);border:1px solid var(--red);}
.btn-sm{padding:8px 14px;font-size:13px;border-radius:9px;width:auto;display:inline-block;}
.btn-icon{background:none;border:none;cursor:pointer;padding:4px 8px;font-size:17px;-webkit-tap-highlight-color:transparent;}
.btn-inline{width:auto;display:inline-block;}
.card{background:var(--surf);border:1px solid var(--brd);border-radius:14px;padding:14px;margin-bottom:10px;}
.h1{font-size:22px;font-weight:700;margin-bottom:16px;}
.label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:var(--mut);margin-bottom:8px;display:block;}
.muted{color:var(--mut);}
.row{display:flex;align-items:center;gap:10px;}
.wrap{display:flex;flex-wrap:wrap;gap:8px;}
.mt8{margin-top:8px;}.mt16{margin-top:16px;}.mt24{margin-top:24px;}
.mb8{margin-bottom:8px;}.mb16{margin-bottom:16px;}
.input{background:var(--surf);color:var(--txt);border:1px solid var(--brd);border-radius:10px;padding:11px 14px;font-size:15px;width:100%;outline:none;}
.input:focus{border-color:var(--blu);}
.input::placeholder{color:var(--mut);}
.pill{display:inline-flex;align-items:center;padding:7px 14px;border-radius:20px;font-size:14px;cursor:pointer;background:var(--surf);border:1px solid var(--brd);color:var(--mut);user-select:none;transition:all .12s;-webkit-tap-highlight-color:transparent;}
.sim-tag{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:8px;font-size:11px;font-weight:700;color:#f59e0b;border:1px solid #f59e0b;vertical-align:middle}
.pill.sel{background:var(--blu);border-color:var(--blu);color:#fff;font-weight:600;}
.pill-chip{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:12px;font-size:13px;cursor:pointer;background:var(--bg);color:var(--mut);border:1px solid var(--brd);}
.picker-row{display:grid;gap:8px;margin-bottom:16px;}
.p4{grid-template-columns:repeat(4,1fr);}
.pick-btn{padding:10px 4px;border:1px solid var(--brd);border-radius:10px;background:var(--surf);color:var(--mut);font-size:13px;cursor:pointer;text-align:center;transition:all .12s;-webkit-tap-highlight-color:transparent;}
.pick-btn.on{border-color:var(--blu);background:var(--blu-s);color:var(--blu-l);font-weight:600;}
.tabs{display:flex;background:var(--surf);border-radius:10px;padding:3px;margin-bottom:16px;gap:2px;}
.tab-btn{flex:1;padding:8px;border:none;border-radius:8px;background:none;color:var(--mut);font-size:14px;font-weight:500;cursor:pointer;transition:all .12s;}
.tab-btn.on{background:var(--bg);color:var(--txt);font-weight:700;}
.grupo-card{background:var(--surf);border:1px solid var(--brd);border-radius:14px;padding:14px;margin-bottom:10px;}
.grupo-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.grupo-name{font-weight:700;color:var(--blu-l);}
.gclock{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--grn-l);margin:4px 0 10px;}
.arr-row{display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-top:1px solid var(--brd);}
.firma{text-align:center;font-size:10.5px;color:var(--mut);margin:24px 0 2px;opacity:.85}
.manual-card{display:flex;align-items:center;gap:12px;margin:18px 0 0;padding:12px 14px;background:var(--surf);border:1px solid var(--brd);border-radius:12px;color:var(--txt);text-decoration:none}
.manual-card .mi{font-size:24px}.manual-card b{display:block;font-size:15px}.manual-card small{display:block;color:var(--mut);font-size:12px;line-height:1.35}
.manual-link{display:inline-block;margin-top:14px;color:var(--blu-l);font-size:14px;font-weight:600;text-decoration:none}
.firma a{color:var(--mut);text-decoration:none;font-weight:600}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(15,23,42,.97);border-top:1px solid var(--brd);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 0 max(8px,env(safe-area-inset-bottom,0px));backdrop-filter:blur(8px)}
.tabbar a,.tabbar button{background:none;border:0;color:var(--mut);font:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;cursor:pointer;padding:4px 0;-webkit-tap-highlight-color:transparent}
.tabbar .ti{font-size:20px;line-height:1}
.tabbar .on{color:var(--blu-l);font-weight:700}
#app.con-tabs{padding-bottom:96px}
.menu-btn{background:none;border:1px solid var(--brd);border-radius:10px;color:var(--mut);font-size:18px;width:40px;height:40px;cursor:pointer}
.menu-pop{position:absolute;right:0;top:46px;z-index:30;background:var(--surf);border:1px solid var(--brd);border-radius:12px;min-width:200px;box-shadow:0 10px 30px rgba(0,0,0,.4);overflow:hidden}
.menu-pop button,.menu-pop a{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--brd);color:var(--txt);font:inherit;font-size:15px;padding:12px 14px;cursor:pointer;text-decoration:none}
.menu-pop :first-child{border-top:0}
.ult-pr{font-size:13px;line-height:1.5;margin:2px 0 8px}
.ult-pr b{color:var(--blu-l);font-weight:600}
.ult-k{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px}
.ult-k div{background:var(--bg);border-radius:8px;text-align:center;padding:6px 2px}
.ult-k b{display:block;font-size:16px;font-variant-numeric:tabular-nums}
.ult-k span{font-size:10px;color:var(--mut)}
.back-btn{display:flex;align-items:center;gap:6px;background:none;border:none;color:var(--mut);font-size:14px;cursor:pointer;padding:0;margin-bottom:16px;-webkit-tap-highlight-color:transparent;}
.badge{display:inline-block;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;}
.b-grn{background:var(--grn-s);color:var(--grn-l);}
.b-blu{background:var(--blu-s);color:var(--blu-l);}
.b-amb{background:#2a1c0c;color:var(--amb);}
.center-msg{text-align:center;padding:40px 16px;color:var(--mut);}
.center-msg h2{color:var(--txt);margin-bottom:8px;}
.result-row{display:flex;align-items:center;gap:12px;padding:12px;background:var(--surf);border-radius:12px;margin-bottom:8px;}
.rpos{width:28px;height:28px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;}
.rpos.gold{background:#2a1c0c;color:var(--amb);}
.rname{flex:1;font-weight:600;}
.rtime{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--grn-l);}
.hist-row{display:flex;align-items:center;gap:12px;padding:14px;background:var(--surf);border:1px solid var(--brd);border-radius:12px;margin-bottom:8px;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.nad-grid{display:flex;flex-direction:column;gap:6px;max-height:280px;overflow-y:auto;}
.nad-row{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surf);border:1px solid var(--brd);border-radius:10px;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.nad-row.active{border-color:var(--blu);background:var(--blu-s);}
.iclock{font-size:48px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--grn-l);text-align:center;padding:16px 0;}
.t-chip{display:inline-block;padding:4px 10px;background:var(--bg);border-radius:8px;font-size:13px;font-variant-numeric:tabular-nums;margin:3px;}
.sep{border:none;border-top:1px solid var(--brd);margin:16px 0;}
/* ── En curso ── */
.sw-marca{display:block;font-size:11px;font-weight:700;color:var(--amb);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.lleg-marca{font-size:11px;font-weight:700;color:var(--amb)}
.ciclo-row{display:flex;gap:10px;align-items:flex-end;margin-bottom:16px}
.ciclo-cd{display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--brd);border-radius:12px;padding:8px 12px;margin-bottom:10px}
.ciclo-cd b{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--amb)}
.quien summary{cursor:pointer;font-weight:600;font-size:14px}
.nota-r{font-size:12px;font-weight:500;color:var(--blu-l);font-style:italic}
.nado-clk{display:flex;align-items:baseline;justify-content:space-between;gap:10px;background:var(--surf);border:1px solid var(--brd);border-radius:12px;padding:6px 14px;margin:-4px 0 12px}
.nado-clk span{font-size:12px;text-transform:uppercase;letter-spacing:.6px}
.nado-clk b{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--grn-l)}
.nado-clk.parado b{color:var(--mut)}
.ec-top{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.salida-card{background:var(--surf);border:1px solid var(--brd);border-radius:16px;padding:12px;margin-bottom:18px;}
.salida-next{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
.salida-btn{display:block;width:100%;min-height:68px;border:none;border-radius:14px;background:var(--grn);color:#fff;font-size:22px;font-weight:800;letter-spacing:.5px;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;}
.salida-btn:active{filter:brightness(.85);transform:scale(.99);}
.salida-btn[disabled]{opacity:.5;}
.lane-tag{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:24px;padding:0 7px;border-radius:7px;font-size:12px;font-weight:800;color:#0f172a;flex-shrink:0;}
.next-chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 4px;background:var(--bg);border-radius:9px;font-size:13px;font-weight:600;}
.sec-hdr{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 8px;}
.sec-hdr .label{margin:0;}
.agua-list{display:flex;flex-direction:column;gap:10px;margin-bottom:18px;}
.agua-row{display:flex;align-items:stretch;gap:0;background:var(--surf);border:1px solid var(--brd);border-left:6px solid var(--lc,var(--blu));border-radius:14px;overflow:hidden;min-height:76px;}
.agua-info{flex:1;min-width:0;padding:10px 12px;display:flex;flex-direction:column;justify-content:center;gap:2px;}
.agua-meta{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);}
.agua-name{font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.agua-clk{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--grn-l);line-height:1.1;}
.llego-btn{flex:0 0 112px;border:none;background:var(--blu);color:#fff;font-size:19px;font-weight:800;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;}
.llego-btn:active{filter:brightness(.8);}
.agua-row.done{background:var(--grn-s);border-color:#166534;}
.agua-row.done .agua-clk{color:var(--grn-l);}
.undo-btn{flex:0 0 112px;border:none;background:transparent;color:var(--mut);font-size:14px;font-weight:600;cursor:pointer;border-left:1px solid #166534;touch-action:manipulation;}
.lleg-list{display:flex;flex-direction:column;gap:6px;}
.lleg-row{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--surf);border-radius:10px;font-size:14px;}
.lleg-row .t{font-weight:700;font-variant-numeric:tabular-nums;color:var(--grn-l);}
.lleg-undo{background:none;border:1px solid var(--brd);color:var(--mut);border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer;touch-action:manipulation;}
.seg{display:flex;background:var(--surf);border-radius:12px;padding:4px;gap:4px;margin-bottom:12px;}
.seg button{flex:1;min-height:44px;border:none;border-radius:9px;background:none;color:var(--mut);font-size:15px;font-weight:600;cursor:pointer;touch-action:manipulation;}
.seg button.on{background:var(--blu);color:#fff;}
.sum-row{display:flex;align-items:center;gap:10px;padding:12px;background:var(--surf);border-radius:12px;margin-bottom:8px;border-left:5px solid var(--lc,var(--brd));}
.sum-name{flex:1;min-width:0;font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sum-time{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--grn-l);}
.sum-gap{font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums;min-width:46px;text-align:right;}
.pb{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:5px;background:#2a1c0c;color:var(--amb);font-size:10px;font-weight:800;vertical-align:middle;}
.lane-block{margin-bottom:14px;}
.fin-btn{background:transparent;color:var(--red);border:1px solid var(--red);border-radius:10px;padding:10px 14px;font-size:14px;font-weight:600;cursor:pointer;touch-action:manipulation;}
.fin-btn.armed{background:var(--red);color:#fff;}
.llego-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;}
.llego-btn small{font-size:12px;font-weight:600;opacity:.85;margin-top:3px;}
.llego-btn.parcial{background:#7c3aed;}
.parc-line{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums;margin-top:2px;}
.parc-line b{color:var(--txt);font-weight:700;}
.parc-undo{background:none;border:1px solid var(--brd);color:var(--mut);border-radius:7px;width:30px;height:26px;font-size:13px;cursor:pointer;touch-action:manipulation;}
.sum-cmp{font-size:11.5px;font-weight:500;color:var(--mut);line-height:1.45;margin-top:3px;white-space:normal;font-variant-numeric:tabular-nums;}
.sum-cmp .cmp-f{opacity:.75;}
.cmp-mej{color:var(--grn-l);} .cmp-peor{color:var(--amb);}
.pb.pb-comp{background:#0c2a0c;color:var(--grn-l);}
.sum-parc{font-size:12px;font-weight:500;color:var(--mut);font-variant-numeric:tabular-nums;margin-top:2px;white-space:normal;}
/* ── Tablero de calles ── */
.b-hint{font-size:13px;color:var(--mut);background:var(--surf);border-radius:10px;padding:9px 12px;margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.b-hint b{color:var(--txt);}
.b-cancel{margin-left:auto;background:none;border:1px solid var(--brd);color:var(--txt);border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer;}
.b-lanes{display:flex;flex-direction:column;gap:10px;}
.b-lane{border-radius:14px;background:color-mix(in srgb,var(--lc) 16%,var(--bg));border:2px solid color-mix(in srgb,var(--lc) 55%,transparent);overflow:hidden;cursor:default;transition:box-shadow .12s;}
.b-lane.armed{cursor:pointer;}
.b-lane-hdr{display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--lc);color:var(--lt);}
.b-lane-name{font-weight:800;font-size:15px;}
.b-lane-info{font-size:12px;font-weight:600;opacity:.85;}
.b-lane-del{margin-left:auto;background:rgba(0,0,0,.18);border:none;color:inherit;border-radius:8px;width:32px;height:28px;font-size:14px;cursor:pointer;}
.b-cards{display:flex;flex-wrap:wrap;gap:8px;padding:10px;min-height:58px;align-items:flex-start;}
.b-card{display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:8px 12px;border-radius:12px;background:var(--surf);border:1px solid var(--brd);font-size:15px;font-weight:600;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation;transition:transform .1s,box-shadow .1s;}
.b-card.in-lane{background:var(--bg);border:2px solid var(--lc);}
.b-num{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;border-radius:11px;background:var(--lc);color:var(--lt);font-size:12px;font-weight:800;}
.b-card.sel{outline:3px solid #fff;outline-offset:1px;transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.45);}
.b-card.dragging{opacity:.3;}
.b-ghost{position:fixed;left:0;top:0;z-index:1000;pointer-events:none;box-shadow:0 12px 28px rgba(0,0,0,.6);transform-origin:center;opacity:.95;}
.drop-over{box-shadow:0 0 0 3px #fff inset;}
.b-card.drop-over{box-shadow:-5px 0 0 0 #fff;}
.b-empty{font-size:13px;color:var(--mut);padding:10px 4px;}
.b-add-lane{width:100%;min-height:48px;margin:10px 0 16px;border:2px dashed var(--brd);border-radius:12px;background:none;color:var(--blu-l);font-size:15px;font-weight:600;cursor:pointer;}
.b-pool{background:var(--surf);border:2px solid var(--brd);border-radius:14px;padding:10px;}
.b-pool.armed{border-color:var(--red);border-style:dashed;cursor:pointer;}
.b-pool-hdr{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.b-pool-hint{font-size:12px;color:var(--red);font-weight:600;margin-left:auto;}
.b-pills{display:flex;gap:6px;overflow-x:auto;margin-bottom:8px;padding-bottom:2px;}
.b-pills .pill{flex-shrink:0;font-size:13px;padding:6px 12px;font-family:inherit;}
.b-pool-cards{padding:10px 0 0;max-height:46vh;overflow-y:auto;}
.b-pool .b-card{background:var(--bg);}
/* ── Tiempos: columnas por calle ── */
.lanes-grid{display:grid;gap:8px;align-items:start;}
.lane-col{display:flex;flex-direction:column;gap:6px;background:color-mix(in srgb,var(--lc) 12%,var(--bg));border-radius:12px;padding:0 0 6px;min-width:0;}
.lane-head{background:var(--lc);color:var(--lt);font-weight:900;font-size:18px;text-align:center;padding:6px 0;border-radius:12px 12px 0 0;letter-spacing:.5px;}
.lane-empty{text-align:center;color:var(--mut);padding:10px 0;}

<div id="app"><div class="center-msg"><h2>Cargando...</h2></div></div>
<script>
'use strict';
// ── Constants ────────────────────────────────────────────────
const DISTS   = [50,100,200,400];
const EMO     = {libre:'🏊',braza:'🐸',mariposa:'🦋',espalda:'🔄'};
const COLS    = ['equipos','nadadores','sesiones','grupos','gnads','resultados','plantillas','planes','entrenadores'];
const COLS_OPCIONALES = ['planes'];   // si las reglas aún no la permiten, la app sigue sin ella

// ── State ────────────────────────────────────────────────────
let _db = null, _dbReady = false, _initN = 0, _initTimer = null;
const S = {equipos:[],nadadores:[],sesiones:[],grupos:[],gnads:[],resultados:[],plantillas:[],planes:[],entrenadores:[]};
let route = {screen:'home'};
let SA = null;   // active session timing state
let PS = null;   // preparar screen state
let _clk = null; // clock interval

// ── Coach identity (localStorage) ───────────────────────────
let coachName = null;
function loadCoach() {
  try { coachName = localStorage.getItem('coach_name') || null; } catch { coachName = null; }
}
function saveCoach(name) {
  coachName = name;
  try { localStorage.setItem('coach_name', name); } catch {}
}
// Per-coach filtered views
function myEqs()    { return S.equipos.filter(e=>e.coach===coachName||e.shared===true); }
function myEqIds()  { return new Set(myEqs().map(e=>e.id)); }
function myNads()   { const ids=myEqIds(); return S.nadadores.filter(n=>ids.has(n.eqId)); }
function myPersonalEqIds() { return new Set(S.equipos.filter(e=>e.coach===coachName).map(e=>e.id)); }
function mySes()    {
  const personalIds = myPersonalEqIds();
  return S.sesiones.filter(s=>s.coach===coachName||(!s.coach&&personalIds.has(s.eqId)));
}

// ── Conexión: Firebase (login con Google + Firestore) ───────
// Solo pueden entrar las cuentas de Google dadas de alta en la colección
// "entrenadores" (lo controlan las reglas de Firestore, ver firestore.rules).
let _auth = null, _user = null, _unsubs = [];
function pantallaMensaje(titulo, texto, extra) {
  document.getElementById('app').innerHTML = `
    <div class="center-msg" style="padding-top:56px">
      <img src="icons/icon-192.png" alt="" width="88" height="88" style="margin-bottom:16px">
      <h2>${titulo}</h2>
      <p style="margin-bottom:18px">${texto}</p>
      ${extra||''}
    </div>`;
}
function renderLogin() {
  pantallaMensaje('Cronómetro Natación', 'Entra con la cuenta de Google que el club tiene dada de alta.',
    `<button class="btn btn-green" style="max-width:320px;margin:0 auto" data-action="login-google">Entrar con Google</button>${MANUAL_LINK}${FIRMA_HTML}`);
}
async function loginGoogle() {
  const prov = new firebase.auth.GoogleAuthProvider();
  prov.setCustomParameters({prompt:'select_account'});
  try {
    await _auth.signInWithPopup(prov);
  } catch (e) {
    // En algunas apps instaladas en el móvil no se permiten ventanas emergentes
    if (['auth/popup-blocked','auth/operation-not-supported-in-this-environment','auth/cancelled-popup-request'].includes(e.code)) {
      await _auth.signInWithRedirect(prov);
    } else if (e.code !== 'auth/popup-closed-by-user') {
      pantallaMensaje('No se pudo entrar', esc(e.message), `<button class="btn btn-surf" style="max-width:320px;margin:0 auto" data-action="login-google">Reintentar</button>`);
    }
  }
}
async function logout() {
  _unsubs.forEach(u => { try { u(); } catch {} });
  _unsubs = [];
  Object.keys(S).forEach(k => { S[k] = []; });
  _dbReady = false; _initN = 0; _db = null; SA = null; PS = null;
  route = {screen:'home'};
  await _auth.signOut();
}
function sinAcceso() {
  _unsubs.forEach(u => { try { u(); } catch {} });
  _unsubs = [];
  pantallaMensaje('Cuenta sin acceso',
    `El administrador del club no ha dado acceso a <b>${esc(_user && _user.email)}</b> o lo ha retirado. Si crees que es un error, habla con él.`,
    `<button class="btn btn-surf" style="max-width:320px;margin:0 auto" data-action="logout">Usar otra cuenta</button>`);
}
// Campos que se pintan sin plantilla de texto libre: se normalizan al leer
// Entrenamiento de simulación (datos de prueba): se marca para borrarlo sin tocar los reales
const esSim = s => !!s && (s.sim === true || String(s.id||'').startsWith('sim_'));
const SIM_TAG = '<span class="sim-tag">Simulación</span>';
function miEmail() { return _user && _user.email ? _user.email.toLowerCase() : null; }
function soyAdmin() { const e = S.entrenadores.find(x=>x.id===miEmail()); return !!(e && e.admin); }

async function dbInit() {
  if (!window.FIREBASE_CONFIG || !FIREBASE_CONFIG.apiKey) {
    pantallaMensaje('Falta configurar Firebase', 'Copia la configuración de tu proyecto de Firebase en <code>firebase-config.js</code>.');
    return;
  }
  firebase.initializeApp(FIREBASE_CONFIG);
  _auth = firebase.auth();
  const fs = firebase.firestore();
  // Datos guardados en el móvil: la app sigue funcionando con mala cobertura en la piscina
  try { await fs.enablePersistence({synchronizeTabs:true}); } catch (e) { console.warn('persistencia', e.code); }
  try { await _auth.getRedirectResult(); } catch (e) { console.warn('login', e.code); }
  _auth.onAuthStateChanged(async u => {
    _user = u;
    if (!u) { renderLogin(); return; }
    _db = fs;
    pantallaMensaje('Entrando…', '');
    const estado = await registrarEntrenador(u);
    if (estado === 'bloqueado') { sinAcceso(); return; }
    if (estado === 'pendiente') { esperarAprobacion(); return; }
    conectarColecciones();
  });
}
// Acceso por solicitud: cualquier cuenta de Google puede pedir acceso (queda en "entrenadores"
// sin aprobar) y el administrador la aprueba o la rechaza. Las reglas de Firestore lo exigen.
function esperarAprobacion() {
  pantallaMensaje('Solicitud enviada',
    `Has pedido acceso con <b>${esc(_user.email)}</b>. El administrador del club tiene que aprobarlo; en cuanto lo haga, el cronómetro se abrirá solo.`,
    `<button class="btn btn-surf" style="max-width:320px;margin:0 auto" data-action="logout">Usar otra cuenta</button>${MANUAL_LINK}`);
  const off = _db.collection('entrenadores').doc(miEmail()).onSnapshot(snap => {
    const d = snap.exists ? snap.data() : {};
    if (d.bloqueado === true) { off(); sinAcceso(); }
    else if (d.aprobado === true || d.admin === true) { off(); conectarColecciones(); }
  }, () => {});
  _unsubs.push(off);
}
async function registrarEntrenador(u) {
  const ref = _db.collection('entrenadores').doc(String(u.email||'').toLowerCase());
  try {
    const snap = await ref.get();
    const ahora = Date.now();
    if (!snap.exists) {
      await ref.set({nombre: u.displayName || null, alta: ahora, ultimo: ahora});
      return 'pendiente';
    }
    const d = snap.data() || {};
    if (d.bloqueado === true) return 'bloqueado';
    if (d.aprobado !== true && d.admin !== true) return 'pendiente';
    if (!d.ultimo || ahora - d.ultimo > 3600e3) ref.update({ultimo: ahora}).catch(()=>{});
    return 'ok';
  } catch (e) {
    console.warn('registro', e.code);   // sin conexión: se sigue con lo guardado en el móvil
    return 'error';
  }
}
// Mejores marcas de competición del club (las publica cada día la web de estadísticas en nadadores.json)
let MARCAS = {};   // licencia RFEN → {'50 Libre': {'25m': [centésimas, fecha, competición]}}
function cargarMarcas() {
  fetch('nadadores.json', {cache:'no-cache'}).then(r => r.ok ? r.json() : null).then(d => {
    if (!d || !Array.isArray(d.nadadores)) return;
    MARCAS = {};
    d.nadadores.forEach(n => { if (/^\d{3,12}$/.test(String(n.id)) && n.mm && typeof n.mm === 'object') MARCAS[String(n.id)] = n.mm; });
    if (canRerender() || (SA && rondaTerminada())) render();
  }).catch(() => {});
}
function conectarColecciones() {
  cargarMarcas();
  document.getElementById('app').innerHTML = '<div class="center-msg"><h2>Cargando...</h2></div>';
  _dbReady = false; _initN = 0;
  _initTimer = setTimeout(() => { if (!_dbReady) { _dbReady = true; render(); } }, 6000);
  for (const col of COLS) {
    _unsubs.push(_db.collection(col).onSnapshot(snap => {
      S[col] = snap.docs.filter(d => d.exists).map(d => limpiarDoc(col, {id:d.id,...d.data()}));
      if (!_dbReady) { if (++_initN >= COLS.length) { clearTimeout(_initTimer); _dbReady = true; render(); } }
      else if (canRerender()) render();
    }, err => {
      console.warn(col, err.code);
      if (err.code === 'permission-denied' && !COLS_OPCIONALES.includes(col)) { clearTimeout(_initTimer); sinAcceso(); return; }
      if (!_dbReady) { if (++_initN >= COLS.length) { clearTimeout(_initTimer); _dbReady = true; render(); } }
    }));
  }
}

// ── DB Mutations ─────────────────────────────────────────────
const DB = {
  async crearEquipo(nombre) {
    const ts = Date.now(), ref = _db.collection('equipos').doc();
    S.equipos.unshift({id:ref.id,nombre,ts,coach:coachName}); render();
    await ref.set({nombre,ts,coach:coachName}).catch(console.error);
    return ref.id;
  },
  async borrarEquipo(id) {
    const nIds = S.nadadores.filter(n=>n.eqId===id).map(n=>n.id);
    S.equipos = S.equipos.filter(e=>e.id!==id);
    S.nadadores = S.nadadores.filter(n=>n.eqId!==id);
    render();
    await _db.collection('equipos').doc(id).delete().catch(console.error);
    for (const nid of nIds) await _db.collection('nadadores').doc(nid).delete().catch(console.error);
  },
  async crearNadador(eqId, n) {
    const ref = _db.collection('nadadores').doc();
    S.nadadores.push({id:ref.id,eqId,n}); render();
    await ref.set({eqId,n}).catch(console.error);
    return ref.id;
  },
  async borrarNadador(id) {
    S.nadadores = S.nadadores.filter(n=>n.id!==id); render();
    await _db.collection('nadadores').doc(id).delete().catch(console.error);
  },
  async crearSesion(eqId, estilo, dist, notas, parciales) {
    const fecha = Date.now(), ref = _db.collection('sesiones').doc();
    const coach = coachName;
    const data = {eqId,fecha,estilo,dist,notas:notas||null,fin:null,coach,parciales:!!parciales};
    S.sesiones.push({id:ref.id,...data});
    await ref.set(data).catch(console.error);
    return ref.id;
  },
  guardarPresentes(sesId, presentes) {
    const s = S.sesiones.find(s=>s.id===sesId); if (s) s.presentes = presentes;
    _db.collection('sesiones').doc(sesId).update({presentes}).catch(console.error);
  },
  guardarNota(resId, nota) {
    const r = S.resultados.find(x=>x.id===resId); if (r) r.nota = nota;
    _db.collection('resultados').doc(resId).update({nota}).catch(console.error);
  },
  async guardarPlan(id, data) {
    if (id) { const p = S.planes.find(x=>x.id===id); if (p) Object.assign(p, data); await _db.collection('planes').doc(id).update(data).catch(console.error); return id; }
    const ref = _db.collection('planes').doc(); S.planes.push({id:ref.id, ...data});
    await ref.set(data).catch(console.error); return ref.id;
  },
  async borrarPlan(id) {
    S.planes = S.planes.filter(p=>p.id!==id); render();
    await _db.collection('planes').doc(id).delete().catch(console.error);
  },
  guardarPlanId(sesId, planId) {
    const s = S.sesiones.find(s=>s.id===sesId); if (s) s.planId = planId;
    _db.collection('sesiones').doc(sesId).update({planId}).catch(console.error);
  },
  // Tiempo nadando: tramos por serie (solo el campo nado, para no pisar sim ni otros)
  guardarNado(id, nado) {
    const s = S.sesiones.find(s=>s.id===id); if (s) s.nado = nado;
    _db.collection('sesiones').doc(id).update({nado}).catch(console.error);
  },
  async finalizarSesion(id) {
    const fin = Date.now();
    const s = S.sesiones.find(s=>s.id===id);
    if (s) s.fin = fin;
    await _db.collection('sesiones').doc(id).update({fin}).catch(console.error);
  },
  async crearGrupo(sesId, nombre, ord) {
    const ref = _db.collection('grupos').doc();
    S.grupos.push({id:ref.id,sesId,nombre,ord});
    await ref.set({sesId,nombre,ord}).catch(console.error);
    return ref.id;
  },
  async asignarNad(gId, nId, pos) {
    const ref = _db.collection('gnads').doc();
    S.gnads.push({id:ref.id,gId,nId,pos:pos||0});
    await ref.set({gId,nId,pos:pos||0}).catch(console.error);
    return ref.id;
  },
  // Devuelve el id al instante; la escritura sigue en segundo plano
  guardarRes(sesId, nId, gId, ms, modo, extra) {
    const ref = _db.collection('resultados').doc();
    const data = {sesId,nId,gId:gId||null,ms,modo,...(extra||{})};
    S.resultados.push({id:ref.id,...data});
    ref.set(data).catch(console.error);
    return ref.id;
  },
  borrarRes(id) {
    S.resultados = S.resultados.filter(r=>r.id!==id);
    _db.collection('resultados').doc(id).delete().catch(console.error);
  },
  // Última distribución de calles del entrenador (una por entrenador)
  guardarPlantilla(calles, estilo, dist, parciales) {
    const data = {coach:coachName, ts:Date.now(), estilo:estilo||null, dist:dist||null, parciales:!!parciales, calles};
    const prev = miPlantilla();
    if (prev) {
      Object.assign(prev, data);
      _db.collection('plantillas').doc(prev.id).update(data).catch(console.error);
    } else {
      const ref = _db.collection('plantillas').doc();
      S.plantillas.push({id:ref.id,...data});
      ref.set(data).catch(console.error);
    }
  }
};
function miPlantilla() {
  return S.plantillas.filter(p=>p.coach===coachName).sort((a,b)=>b.ts-a.ts)[0] || null;
}
function plantillaDesdeSA() {
  return SA.grupos.map(g=>({nombre:g.nombre, nIds:g.nads.map(n=>n.nId)}));
}

// ── Helpers ──────────────────────────────────────────────────
function fmtTime(ms) {
  if (ms == null || ms < 0) return '--:--.0';
  const d = Math.floor(ms/100)%10;
  const s = Math.floor(ms/1000)%60;
  const m = Math.floor(ms/60000);
  return m > 0 ? `${m}:${String(s).padStart(2,'0')}.${d}` : `${s}.${d}`;
}
function fmtDate(ts) {
  return new Date(ts).toLocaleDateString('es-ES',{day:'numeric',month:'short',year:'numeric'});
}
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function canRerender() { return !['en-curso','preparar'].includes(route.screen); }
function eqNombre(eqId) { const e=S.equipos.find(e=>e.id===eqId); return e?e.nombre:'?'; }
function sesLabel(ses) {
  if (!ses) return '';
  return ses.estilo && ses.dist
    ? `${EMO[ses.estilo]||'🏊'} ${esc(ses.estilo)} ${esc(ses.dist)}m`
    : '🏊 Sesión libre';
}
function saveNotas() {
  const el = document.getElementById('notas-input');
  if (el && PS) PS.notas = el.value;
}
function fmtDateShort(ts) {
  return new Date(ts).toLocaleDateString('es-ES',{day:'numeric',month:'short'});
}
// Returns [{ms, fecha, estilo, dist}] sorted by fecha — best time per session
function getSwimmerSessions(nId, filter) {
  const myIds = new Set(mySes().map(s=>s.id));
  const res = S.resultados.filter(r => {
    if (r.nId !== nId) return false;
    if (!myIds.has(r.sesId)) return false;
    if (!filter) return true;
    const c = resCombo(r);
    return c.estilo===filter.estilo && c.dist===Number(filter.dist);
  });
  const by = {};
  res.forEach(r => {
    if (!by[r.sesId] || r.ms < by[r.sesId].ms) {
      const s = S.sesiones.find(s=>s.id===r.sesId), c = resCombo(r);
      if (s) by[r.sesId] = {ms:r.ms, fecha:s.fecha, estilo:c.estilo, dist:c.dist};
    }
  });
  return Object.values(by).sort((a,b)=>a.fecha-b.fecha);
}
function calcTrend(sessions) {
  if (sessions.length < 4) return null;
  const recent = sessions.slice(-3).map(s=>s.ms);
  const older  = sessions.slice(-6,-3).map(s=>s.ms);
  if (!older.length) return null;
  const avgR = recent.reduce((a,b)=>a+b,0)/recent.length;
  const avgO = older.reduce((a,b)=>a+b,0)/older.length;
  const diff = avgO - avgR; // positive = improving (lower ms = better)
  const pct  = Math.abs(diff/avgO*100);
  if (pct < 1) return {dir:'→',color:'#94a3b8',label:'Estable'};
  return diff > 0
    ? {dir:'↑',color:'#22c55e',label:`+${pct.toFixed(1)}%`}
    : {dir:'↓',color:'#ef4444',label:`${pct.toFixed(1)}%`};
}
function svgChart(points) {
  if (points.length < 2) return '<div style="text-align:center;padding:20px;color:var(--mut);font-size:13px">Necesitás 2 sesiones para ver el gráfico</div>';
  const W=300,H=140,pl=46,pr=10,pt=10,pb=28,cw=W-pl-pr,ch=H-pt-pb;

  const py=ms=>pt+ch-((ms-yMin)/yRng)*ch;
  const bestIdx=ms_v.indexOf(mn);
  const line=points.map((p,i)=>`${px(i).toFixed(1)},${py(p.ms).toFixed(1)}`).join(' ');
  const ticks=[0.15,0.5,0.85].map(f=>{
    const ms=yMin+f*yRng, y=py(ms).toFixed(1);

<text x="${pl-4}" y="${(py(ms)+4).toFixed(1)}" text-anchor="end" font-size="9" fill="#94a3b8">${fmtTime(ms)}</text>`;
  }).join('');
  const dots=points.map((p,i)=>`<circle cx="${px(i).toFixed(1)}" cy="${py(p.ms).toFixed(1)}" r="${i===bestIdx?5:3}" fill="${i===bestIdx?'#f59e0b':'#3b82f6'}" stroke="var(--surf)" stroke-width="1.5"/>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;display:block">
<line x1="${pl}" y1="${pt}" x2="${pl}" y2="${pt+ch}" stroke="#334155" stroke-width="1"/>
<line x1="${pl}" y1="${pt+ch}" x2="${pl+cw}" y2="${pt+ch}" stroke="#334155" stroke-width="1"/>
${ticks}
<text x="${px(0).toFixed(1)}" y="${H-6}" text-anchor="start" font-size="9" fill="#94a3b8">${fmtDateShort(points[0].fecha)}</text>
<text x="${px(points.length-1).toFixed(1)}" y="${H-6}" text-anchor="end" font-size="9" fill="#94a3b8">${fmtDateShort(points[points.length-1].fecha)}</text>
<polyline points="${line}" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
${dots}

// ── Clock ────────────────────────────────────────────────────
function startClock() {
  if (_clk) clearInterval(_clk);
  _clk = setInterval(() => {
    if (!SA) return;
    const now = Date.now();
    document.querySelectorAll('.live-clk[data-t0]').forEach(el => {
      el.textContent = fmtTime(now - Number(el.dataset.t0));
    });
    if (SA.ciclo && SA.nSalida > 0 && quedanPorSalir()) {
      const e = cicloEstado(SA.tUltSalida, SA.ciclo, now, true);
      const cd = document.getElementById('live-ciclo');
      if (cd) cd.textContent = fmtNado(Math.max(0, Math.ceil(e.restaMs/1000)*1000));
      if (e.aviso && SA.avisado !== SA.nSalida) { SA.avisado = SA.nSalida; pitido(120, 880); }
      if (e.toca && SA.cicloSonado !== SA.nSalida) {
        SA.cicloSonado = SA.nSalida; pitido(500, 660);
        try { navigator.vibrate && navigator.vibrate(200); } catch {}
        if (SA.auto) salidaTanda(SA.tUltSalida + SA.ciclo*1000, true);
      }
    }
    const nd = document.getElementById('live-nado');
    if (nd) { nd.textContent = fmtNado(msNadando(SA.nado, now)); nd.parentElement.classList.toggle('parado', !SA.nado.some(x=>x.fin==null)); }
    // Pasa a "Llegados" las filas que ya llevan un rato marcadas
    if (SA.recientes.some(r => now - r.tLleg > RECIENTE_MS)) {
      SA.recientes = SA.recientes.filter(r => now - r.tLleg <= RECIENTE_MS);
      SA.tLayout = now;
      render();
    }
  }, 100);
}

// Modelo de cronometraje:
// - SALIDA (común) lanza al primero que espera en cada calle; cada nadador
//   arranca con su propio t0, aunque otros sigan en el agua.
// - LLEGÓ es individual: cada nadador en el agua tiene su botón.
// Colores de calle bien distintos entre sí (fondo, texto sobre el color)
const LANE_COLORS = ['#ef4444','#3b82f6','#eab308','#22c55e','#a855f7','#f97316','#06b6d4','#ec4899'];
const LANE_TXT    = ['#fff',   '#fff',   '#111',   '#06210f','#fff',   '#111',   '#04232a','#fff'];
function laneTxt(color) { const i = LANE_COLORS.indexOf(color); return i<0 ? '#111' : LANE_TXT[i]; }
function laneTag(label, color) { return `<span class="lane-tag" style="background:${color};color:${laneTxt(color)}">${esc(label)}</span>`; }
const RECIENTE_MS = 1600; // la fila llegada se queda en su sitio este tiempo antes de bajar
function buildSA(sesId) {
  const gs = S.grupos.filter(g=>g.sesId===sesId).sort((a,b)=>a.ord-b.ord);
  const ses = S.sesiones.find(s=>s.id===sesId);
  const dist = ses ? Number(ses.dist) : 0;
  SA = {
    sesId,
    dist,
    estilo: ses ? ses.estilo : null,
    parciales: !!(ses && ses.parciales),
    tramos: ses && ses.parciales && dist > 50 ? Math.round(dist/50) : 1, // toques por nadador
    nuevaSerie: null,  // formulario de la siguiente serie con otro estilo
    nado: ses && Array.isArray(ses.nado) ? ses.nado : [],   // tiempo nadando: {r, ini, fin} por serie
    ronda: 1,
    nSalida: 0,
    tUltSalida: 0,
    tLayout: 0,
    vista: 'rapidos',
    finArmed: false,
    seq: 0,
    noSale: new Set(), // calles cuyo nadador no sale en la próxima SALIDA
    editando: false,
    buscar: null,      // {gId, q} buscador de la calle en edición
    agua: [],       // nadando ahora
    llegados: [],   // ya llegados en esta ronda
    recientes: [],  // llegados que aún se muestran en su sitio (evita saltos bajo el dedo)
    grupos: gs.map((g, idx) => {
      const gnds = S.gnads.filter(gn=>gn.gId===g.id).sort((a,b)=>(a.pos||0)-(b.pos||0));
      const nads = gnds.map(gn => {
        const n = S.nadadores.find(n=>n.id===gn.nId);
        return {nId:gn.nId, n:n?n.n:'?'};
      });
      return {gId:g.id, nombre:g.nombre, idx, color:LANE_COLORS[idx%LANE_COLORS.length], nads, next:0};
    })
  };
}
function laneShort(g) {
  const m = /(\d+)/.exec(g.nombre||'');
  return m ? 'C'+m[1] : String(g.nombre||'?').slice(0,3);
}
function quedanPorSalir() { return SA.grupos.some(g => g.next < g.nads.length); }
function rondaTerminada() { return SA.agua.length===0 && !quedanPorSalir() && SA.llegados.length>0; }
function ordenFila(a, b) { return a.salida-b.salida || a.laneIdx-b.laneIdx; }

// ── En-curso actions ─────────────────────────────────────────
function salidaTanda(t, auto) {
  if (!SA || !quedanPorSalir()) return;
  if (!auto && t - SA.tUltSalida < 800) return; // evita doble toque accidental
  const salen = SA.grupos.filter(g => g.next < g.nads.length && !SA.noSale.has(g.gId));
  if (!salen.length) return;
  if (SA.nSalida === 0) { SA.nado = abrirTramo(SA.nado, SA.ronda, t); DB.guardarNado(SA.sesId, SA.nado); }
  SA.tUltSalida = t;
  SA.nSalida++;
  SA.finArmed = false;
  SA.noSale.clear(); // el que no salió sigue primero en su calle para la siguiente
  salen.forEach(g => {
    const nad = g.nads[g.next++];
    SA.agua.push({
      key: `k${++SA.seq}`,
      gId: g.gId, laneIdx: g.idx, lane: laneShort(g), color: g.color,
      nId: nad.nId, n: nad.n, salida: SA.nSalida, t0: t, parc: [], tUlt: 0
    });
  });
  SA.agua.sort(ordenFila);
  render();
}
function llegoNad(key, t) {
  if (!SA) return;
  const i = SA.agua.findIndex(a=>a.key===key);
  if (i<0) return;
  const a = SA.agua.splice(i,1)[0];
  const ms = t - a.t0;
  const extra = {ronda:SA.ronda, salida:a.salida, estilo:SA.estilo||null, dist:SA.dist||null};
  if (a.nota) extra.nota = a.nota;
  if (SA.tramos > 1) extra.parciales = [...a.parc, ...Array(Math.max(0, SA.tramos-1-a.parc.length)).fill(null), ms]; // acumulados cada 50 m (null = no tomado)
  const resId = DB.guardarRes(SA.sesId, a.nId, a.gId, ms, 'grupo', extra);
  const rec = {...a, ms, resId, tLleg: Date.now()};
  // Marca en el momento: mejora su mejor entreno o su marca de competición (25 m)
  rec.marca = SA.estilo && SA.dist ? marcaDe(comparaciones(a.nId, SA.estilo, SA.dist, ms, resId, Date.now())) : null;
  SA.llegados.push(rec);
  SA.recientes.push(rec);
  if (rondaTerminada()) { SA.nado = cerrarTramo(SA.nado, SA.ronda, t); DB.guardarNado(SA.sesId, SA.nado); }
  try { navigator.vibrate && navigator.vibrate(rec.marca ? [60,40,60] : 35); } catch {}
  render();
}
const MARCA_TXT = {comp:'🏅 ¡marca de comp.!', entreno:'🏅 mejor entreno'};
// Toque en el botón del nadador: parcial cada 50 m o llegada en el último tramo
function marcaNad(key, t) {
  if (!SA) return;
  const a = SA.agua.find(x=>x.key===key);
  if (!a) return;
  // Un tramo de 50 m dura bastante más de 4 s: un segundo toque tan rápido es accidental
  if (a.tUlt && t - a.tUlt < 4000) return;
  a.tUlt = t;
  if (a.parc.length < SA.tramos-1) {
    a.parc.push(t - a.t0);
    try { navigator.vibrate && navigator.vibrate(20); } catch {}
    render();
  } else {
    llegoNad(key, t);
  }
}
// "🏁 Llegó" en modo parciales: termina aunque falten parciales por marcar
function llegoDirecto(key, t) {
  const a = SA && SA.agua.find(x=>x.key===key);
  if (!a) return;
  if (a.tUlt && t - a.tUlt < 1500) return;

}
function deshacerParcial(key) {

  if (!a || !a.parc.length) return;

// Tiempos de cada tramo de 50 m a partir de los acumulados
function tramosDe(parc) {
  return (parc||[]).map((v,i,arr)=> v==null ? null : i===0 ? v : (arr[i-1]==null ? null : v-arr[i-1]));
}
function fmtTramos(parc) { return tramosDe(parc).map(v=>v==null?'—':fmtTime(v)).join(' · '); }
// Estilo y distancia de cada tiempo (los antiguos, sin estilo propio, usan los de su sesión)
function resCombo(r) {
  if (r.estilo && r.dist) return {estilo:r.estilo, dist:Number(r.dist)};
  const s = S.sesiones.find(x=>x.id===r.sesId);
  return s && s.estilo && s.dist ? {estilo:s.estilo, dist:Number(s.dist)} : {estilo:null, dist:null};
}
function comboLabel(estilo, dist) { return estilo && dist ? `${EMO[estilo]||'🏊'} ${esc(estilo)} ${esc(dist)}m` : '🏊 Serie libre'; }
function comboTexto(estilo, dist) { return estilo && dist ? `${estilo.charAt(0).toUpperCase()+estilo.slice(1)} ${dist} m` : 'Serie libre'; }
// Series de un entrenamiento: [{ronda, estilo, dist, res:[tiempos]}]
function seriesDe(sesId) {
  const by = {};
  S.resultados.filter(r=>r.sesId===sesId).forEach(r => {
    const c = resCombo(r), k = r.ronda || 1;
    (by[k] = by[k] || {ronda:k, estilo:c.estilo, dist:c.dist, res:[]}).res.push(r);
  });
  return Object.values(by).sort((a,b)=>a.ronda-b.ronda).map(x => (x.res.sort((a,b)=>a.ms-b.ms), x));
}
function calleDe(r) { const g = S.grupos.find(g=>g.id===r.gId); return g ? g.nombre : ''; }
function nombreDe(nId) { const n = S.nadadores.find(n=>n.id===nId); return n ? n.n : '?'; }
// ── Comparaciones de un tiempo con sus mejores marcas (resúmenes y PDF, nunca mientras se cronometra) ──
const fmtCs = cs => { cs = Math.round(cs); const m = Math.floor(cs/6000), sg = Math.floor(cs%6000/100), c = String(cs%100).padStart(2,'0');
  return m ? `${m}:${String(sg).padStart(2,'0')}.${c}` : `${sg}.${c}`; };
const fmtFechaIso = f => f ? `${f.slice(8,10)}/${f.slice(5,7)}/${f.slice(2,4)}` : '';
const evNombre = (estilo, dist) => `${dist} ${estilo.charAt(0).toUpperCase()+estilo.slice(1)}`;
// Mejor marca de competición de esa prueba en equivalente de piscina de 25 m (los entrenamientos son en 25 m).
// nadadores.json: [cs en 25 m, fecha, competición, piscina real, cs real]; si viene de 50 m está convertida (puntos World Aquatics)
function mejorCompeticion(nId, estilo, dist) {
  const n = S.nadadores.find(x=>x.id===nId);
  if (!n || !n.rfen || !estilo || !dist) return null;
  const m = (MARCAS[n.rfen] || {})[evNombre(estilo, dist)];
  if (!Array.isArray(m)) return null;
  const cs = Number(m[0]), real = Number(m[4]);
  if (!Number.isFinite(cs) || cs <= 0) return null;
  return {cs, fecha: String(m[1]||'').slice(0,10), comp: String(m[2]||''), pool: m[3]==='50m' ? '50m' : '25m',
          real: Number.isFinite(real) && real > 0 ? real : cs};
}
const origenComp = c => c.pool === '50m' ? `de ${fmtCs(c.real)} en 50 m` : '25 m';
// Mejor tiempo de entrenamiento anterior en la misma prueba (otros tiempos, hasta la fecha de ese entrenamiento)
function mejorEntrenoPrevio(nId, estilo, dist, excluirId, hasta) {
  let best = null;
  S.resultados.forEach(r => {
    if (r.nId!==nId || r.id===excluirId) return;
    const c = resCombo(r); if (c.estilo!==estilo || c.dist!==Number(dist)) return;
    const ses = S.sesiones.find(x=>x.id===r.sesId); const f = ses ? ses.fecha : 0;
    if (hasta && f > hasta) return;
    if (!best || r.ms < best.ms) best = {ms:r.ms, fecha:f};

  return best;
}
// {comp, entreno, difComp (s), difEnt (s)}: diferencias negativas = mejora
function comparaciones(nId, estilo, dist, ms, resId, hasta) {
  const comp = mejorCompeticion(nId, estilo, dist), ent = mejorEntrenoPrevio(nId, estilo, dist, resId, hasta);
  return {comp, ent, difComp: comp ? (ms - comp.cs*10)/1000 : null, difEnt: ent ? (ms - ent.ms)/1000 : null};
}
const difTxt = d => d==null ? '' : (d <= 0 ? '-' : '+') + Math.abs(d).toFixed(1);   // guion normal: el PDF no tiene el signo −
function comparaHTML(c) {
  const dif = d => `<b class="${d<=0?'cmp-mej':'cmp-peor'}">${difTxt(d)}</b>`;
  const out = [];
  if (c.comp) out.push(`Competición ${fmtCs(c.comp.cs)} <span class="cmp-f">${origenComp(c.comp)} · ${fmtFechaIso(c.comp.fecha)}</span> ${dif(c.difComp)}`);
  if (c.ent) out.push(`Entreno ${fmtTime(c.ent.ms)} <span class="cmp-f">${fmtDateShort(c.ent.fecha)}</span> ${dif(c.difEnt)}`);

}
function comparaTexto(c) {
  const out = [];
  if (c.comp) out.push(`mejor competición en 25 m ${fmtCs(c.comp.cs)} (${origenComp(c.comp)}, ${fmtFechaIso(c.comp.fecha)}) ${difTxt(c.difComp)}`);
  if (c.ent) out.push(`mejor entreno ${fmtTime(c.ent.ms)} (${fmtDateShort(c.ent.fecha)}) ${difTxt(c.difEnt)}`);

function deshacerLlegada(key) {
  if (!SA) return;

  if (i<0) return;
  if (Date.now() - SA.llegados[i].tLleg < 1000) return; // doble toque sobre LLEGÓ
  const l = SA.llegados.splice(i,1)[0];
  SA.recientes = SA.recientes.filter(r=>r.key!==key);
  DB.borrarRes(l.resId);
  const {ms, resId, tLleg, ...a} = l;
  a.tUlt = 0;
  while (a.parc.length && a.parc[a.parc.length-1]==null) a.parc.pop();
  SA.agua.push(a);
  SA.agua.sort(ordenFila);
  SA.tLayout = Date.now();
  if (SA.nado.some(x=>x.r===SA.ronda && x.fin!=null)) { SA.nado = reabrirTramo(SA.nado, SA.ronda); DB.guardarNado(SA.sesId, SA.nado); }
  render();
}
function repetirSerie(cfg) {
  if (!SA) return;
  if (cfg) {   // nueva serie con otro estilo/distancia
    SA.estilo = cfg.estilo; SA.dist = Number(cfg.dist) || 0; SA.parciales = !!cfg.parciales;
    SA.tramos = SA.parciales && SA.dist > 50 ? Math.round(SA.dist/50) : 1;
    SA.ciclo = cfg.ciclo || null; SA.cicloTxt = cfg.cicloTxt || (cfg.ciclo ? fmtNado(cfg.ciclo*1000) : ''); SA.auto = !!cfg.auto;
  }
  SA.nuevaSerie = null;
  SA.ronda++;
  SA.nSalida = 0;
  SA.avisado = SA.cicloSonado = null;   // el aviso y la salida del ciclo van por serie
  SA.agua = []; SA.llegados = []; SA.recientes = [];
  SA.vista = 'rapidos';
  SA.noSale.clear();
  SA.grupos.forEach(g => { g.next = 0; });
  render();
  window.scrollTo(0,0);
}
async function finalizarSesion() {
  if (!SA) return;
  // Si aún hay nadadores en el agua o por salir, pedir un segundo toque
  if ((SA.agua.length>0 || quedanPorSalir()) && !SA.finArmed) {
    SA.finArmed = true; render();
    setTimeout(() => { if (SA && SA.finArmed) { SA.finArmed = false; render(); } }, 3000);
    return;
  }
  const ses = S.sesiones.find(s=>s.id===SA.sesId);
  DB.guardarPlantilla(plantillaDesdeSA().filter(c=>c.nIds.length), ses&&ses.estilo, ses&&ses.dist, ses&&ses.parciales);
  await DB.finalizarSesion(SA.sesId);
  const sesId = SA.sesId;
  SA = null;
  soltarWakeLock();
  if (_clk) { clearInterval(_clk); _clk = null; }
  nav({screen:'resultados', sesId});
}

function grupoSA(gId) { return SA && SA.grupos.find(g=>g.gId===gId); }
function toggleNoSale(gId) {
  if (!SA) return;
  SA.noSale.has(gId) ? SA.noSale.delete(gId) : SA.noSale.add(gId);
  render();
}
function editMover(gId, i, dir) {
  const g = grupoSA(gId); if (!g) return;
  const a = g.next+i, b = a+dir;
  if (b < g.next || b >= g.nads.length) return;
  [g.nads[a], g.nads[b]] = [g.nads[b], g.nads[a]];
  render();
}
function editQuitar(gId, i) {
  const g = grupoSA(gId); if (!g) return;
  g.nads.splice(g.next+i, 1);
  if (g.next >= g.nads.length) SA.noSale.delete(gId);
  render();
}
function editCambiarCalle(gId, i, toGId) {
  const g = grupoSA(gId), dest = grupoSA(toGId);
  if (!g || !dest || g===dest) return;
  const [nad] = g.nads.splice(g.next+i, 1);
  dest.nads.push(nad);
  DB.asignarNad(dest.gId, nad.nId, dest.nads.length-1);
  if (g.next >= g.nads.length) SA.noSale.delete(gId);
  render();
}
function editAgregar(gId, nId) {
  const g = grupoSA(gId); const nad = S.nadadores.find(n=>n.id===nId);
  if (!g || !nad) return;
  g.nads.push({nId, n:nad.n});
  DB.asignarNad(g.gId, nId, g.nads.length-1);
  SA.buscar = {gId, q:''};
  render();
  const inp = document.getElementById('sa-search'); if (inp) inp.focus();
}
async function editNuevaCalle() {
  if (!SA) return;
  const idx = SA.grupos.length;
  const nums = SA.grupos.map(g=>parseInt((/(\d+)/.exec(g.nombre)||[])[1])||0);
  const nombre = `Calle ${Math.max(0,...nums)+1}`;
  const gId = await DB.crearGrupo(SA.sesId, nombre, idx);
  SA.grupos.push({gId, nombre, idx, color:LANE_COLORS[idx%LANE_COLORS.length], nads:[], next:0});
  SA.buscar = {gId, q:''};
  render();
}
// Mejor marca previa del nadador en el mismo estilo/distancia (otras sesiones o rondas)
function mejorPrevia(nId, excluirId) {
  if (!SA.estilo || !SA.dist) return null;
  const prev = S.resultados.filter(r => {
    if (r.nId!==nId || r.id===excluirId || (r.sesId===SA.sesId && r.ronda===SA.ronda)) return false;
    const c = resCombo(r);
    return c.estilo===SA.estilo && c.dist===Number(SA.dist);
  });
  return prev.length ? Math.min(...prev.map(r=>r.ms)) : null;
}

// ── Compartir o descargar un archivo ─────────────────────────
// ¿Este aparato sabe compartir archivos (menú de WhatsApp, correo…)? Los navegadores de ordenador también suelen saber.
function puedeCompartirArchivos() {
  try { return !!(navigator.canShare && navigator.canShare({files:[new File([''], 'x.pdf', {type:'application/pdf'})]})); } catch { return false; }
}
// descargar: true → siempre se guarda el archivo (carpeta Descargas en el ordenador); false → menú de compartir si lo hay
async function compartirArchivo(blob, fname, tipo, descargar) {
  const file = new File([blob], fname, {type:tipo});
  if (!descargar && navigator.canShare && navigator.canShare({files:[file]})) {
    try { await navigator.share({files:[file], title:fname}); return; }
    catch (e) { if (e.name==='AbortError') return; }
  }
  const url = URL.createObjectURL(file);
  const link = Object.assign(document.createElement('a'), {href:url, download:fname});
  document.body.appendChild(link); link.click(); link.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}
function nombreArchivo(ses, ext) {
  const f = new Date(ses.fecha);
  const iso = `${f.getFullYear()}-${String(f.getMonth()+1).padStart(2,'0')}-${String(f.getDate()).padStart(2,'0')}`;
  return `entrenamiento-${iso}.${ext}`;
}

// jsPDF se descarga solo al pedir el primer PDF (y queda guardado para usarlo sin conexión)
const LIB_PDF = [
  ['https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js', 'sha384-JcnsjUPPylna1s1fvi1u12X5qjY5OL56iySh75FdtrwhO/SWXgMjoVqcKyIIWOLk'],
  ['https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js', 'sha384-fCAW/rDWORTbQXSiB7mOg0QtQ5c+r0f544y6XoKjuVva0nMBlCpNUjiFeG5iMdS3'],
];
function cargarScript(src, integrity) {
  return new Promise((ok, ko) => {
    if (document.querySelector(`script[src="${src}"]`)) return ok();
    const el = Object.assign(document.createElement('script'), {src, integrity, crossOrigin:'anonymous'});
    el.onload = ok; el.onerror = () => ko(new Error('No se pudo descargar el generador de PDF. ¿Hay conexión?'));
    document.head.appendChild(el);
  });
}
async function logoDataURL() {
  try {
    const b = await (await fetch('icons/icon-192.png')).blob();
    return await new Promise(ok => { const fr = new FileReader(); fr.onload = () => ok(fr.result); fr.readAsDataURL(b); });
  } catch { return null; }
}
async function generarPDF(sesId, btn, compartir) {
  const d = datosEntrenamiento(sesId);
  if (!d) return;
  const txtBtn = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = 'Generando PDF…'; }   // compartir: menú de compartir; si no, se descarga
  try {
    for (const [src, sri] of LIB_PDF) await cargarScript(src, sri);
    const {ses, series} = d;
    const doc = new window.jspdf.jsPDF({unit:'mm', format:'a4'});
    const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight(), M = 14;
    const AZUL = [15,23,42], GRIS = [100,116,139];
    const logo = await logoDataURL();
    if (logo) doc.addImage(logo, 'PNG', M, 10, 18, 18);
    doc.setFont('helvetica','bold'); doc.setFontSize(16); doc.setTextColor(...AZUL);
    doc.text('Resumen de entrenamiento', M+22, 17);
    doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(...GRIS);
    doc.text('C.N. Axarquía', M+22, 23);
    let y = 36;
    const linea = (et, v) => { doc.setFont('helvetica','bold'); doc.setTextColor(...AZUL); doc.text(et, M, y);
      doc.setFont('helvetica','normal'); doc.setTextColor(40,40,40);
      const t = doc.splitTextToSize(String(v), W-M*2-30); doc.text(t, M+30, y); y += 5.5*t.length; };
    linea('Fecha', `${fmtDate(ses.fecha)} · ${fmtHora(ses.fecha)}${ses.fin?`–${fmtHora(ses.fin)}`:''}${d.min?` (${d.min} min)`:''}`);
    linea('Grupo', eqNombre(ses.eqId));
    if (ses.nado && ses.nado.length) linea('Tiempo nadando', fmtNado(msNadando(ses.nado, Date.now())));
    if (ses.coach) linea('Entrenador', ses.coach);
    linea('Resumen', `${series.length} ${series.length===1?'serie':'series'} · ${d.nads.length} nadadores · ${d.nTiempos} tiempos`);
    if (d.combos.length) linea('Estilos', d.combos.join(' · '));
    if (d.nads.length) linea('Nadadores', d.nads.join(', '));
    if (ses.notas) linea('Notas', ses.notas);
    y += 3;
    series.forEach(x => {
      if (y > H - 40) { doc.addPage(); y = 18; }
      doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor(...AZUL);
      doc.text(`Serie ${x.ronda} · ${comboTexto(x.estilo, x.dist)}`, M, y);
      const conParc = x.res.some(r => r.parciales && r.parciales.length > 1);
      const best = x.res[0] ? x.res[0].ms : 0;
      doc.autoTable({
        startY: y + 2, margin: {left:M, right:M},
        head: [['#', 'Nadador', 'Calle', 'Tiempo', 'Dif.', ...(conParc?['Parciales 50 m']:[]), 'Mejor competición (25 m)', 'Mejor entreno']],
        body: x.res.map((r,i) => { const c = comparaciones(r.nId, x.estilo, x.dist, r.ms, r.id, ses.fecha);
          return [i+1, nombreDe(r.nId) + (r.nota ? `\nNota: ${r.nota}` : ''), calleDe(r), fmtTime(r.ms), i?`+${((r.ms-best)/1000).toFixed(1)}`:'',
            ...(conParc?[r.parciales&&r.parciales.length>1?fmtTramos(r.parciales):'']:[]),
            c.comp ? `${fmtCs(c.comp.cs)} (${difTxt(c.difComp)})\n${origenComp(c.comp)} · ${fmtFechaIso(c.comp.fecha)}` : '—',
            c.ent ? `${fmtTime(c.ent.ms)} (${difTxt(c.difEnt)})\n${fmtDateShort(c.ent.fecha)}` : '—']; }),
        theme: 'striped', styles: {fontSize: 8.5, cellPadding: 1.6},
        headStyles: {fillColor: AZUL, textColor: 255},
        columnStyles: {0:{cellWidth:7}, 3:{fontStyle:'bold'}},
        didParseCell: h => { if (h.section!=='body') return; const t = String(h.cell.raw||'');
          if (h.column.index >= h.table.columns.length-2 && /\(-/.test(t)) h.cell.styles.textColor = [10,122,67]; },
      });
      doc.setFontSize(10);
      y = doc.lastAutoTable.finalY + 10;
    });
    if (!series.length) { doc.setTextColor(...GRIS); doc.text('Sin tiempos registrados en este entrenamiento.', M, y); }
    const n = doc.getNumberOfPages();
    for (let i = 1; i <= n; i++) {
      doc.setPage(i); doc.setFontSize(8); doc.setTextColor(...GRIS);
      doc.text(`Cronómetro CNA · ${fmtDate(Date.now())}`, M, H-8);
      doc.text(`${i} / ${n}`, W-M, H-8, {align:'right'});
    }
    await compartirArchivo(doc.output('blob'), nombreArchivo(ses, 'pdf'), 'application/pdf', !compartir);
  } catch (e) {
    alert(e.message || 'No se pudo generar el PDF');
  } finally {
    if (btn && btn.isConnected) { btn.disabled = false; btn.textContent = txtBtn; }
  }
}

// Repetir: las mismas calles y la prueba de la primera serie de ese entrenamiento
function repetirEntreno(sesId) {
  const ses = S.sesiones.find(s=>s.id===sesId); if (!ses) return;
  const grupos = S.grupos.filter(g=>g.sesId===sesId).sort((a,b)=>a.ord-b.ord);
  navPreparar(ses.eqId);
  const calles = grupos.map((g,i) => ({key:'calle'+i+'-'+Date.now(), nombre:g.nombre,
    nads: S.gnads.filter(x=>x.gId===g.id).sort((a,b)=>(a.pos||0)-(b.pos||0))
      .map(x=>S.nadadores.find(n=>n.id===x.nId)).filter(Boolean).map(n=>({id:n.id, n:n.n}))})).filter(c=>c.nads.length);
  if (calles.length) PS.grupos = calles;
  const s1 = seriesDe(sesId)[0];
  if (s1 && s1.estilo) { PS.estilo = s1.estilo; PS.dist = Number(s1.dist); }
  PS.parciales = !!ses.parciales;
  PS.oferta = null;
  render();
}

// ── Tablero de calles (tarjetas) ─────────────────────────────
// Se usa al preparar la sesión y al editar calles en curso.
// Cada pantalla aporta un "adaptador" con sus calles, la lista libre y cómo mover.
// Interacción: tocar tarjeta → tocar calle (o tarjeta destino), o mantener pulsado y arrastrar.
let BOARD = {sel:null, q:'', cat:null};
function boardReset() { BOARD = {sel:null, q:'', cat:null}; }

const boardPS = {
  lanes() {
    return PS.grupos.map((g,i)=>({id:g.key, nombre:g.nombre, color:LANE_COLORS[i%LANE_COLORS.length],
      items:g.nads.map(n=>({id:n.id, n:n.n})), ya:0, del: PS.grupos.length>1}));
  },
  usados() { return new Set(PS.grupos.flatMap(g=>g.nads.map(n=>n.id))); },
  move(id, from, to, before) {
    let item;
    if (from==='pool') { const n = S.nadadores.find(x=>x.id===id); if (!n) return; item = {id:n.id, n:n.n}; }
    else {
      const g = PS.grupos.find(g=>g.key===from); if (!g) return;
      const i = g.nads.findIndex(n=>n.id===id); if (i<0) return;
      item = g.nads.splice(i,1)[0];
    }
    if (to==='pool') return;
    const dest = PS.grupos.find(g=>g.key===to); if (!dest) return;
    const bi = before ? dest.nads.findIndex(n=>n.id===before) : -1;
    bi<0 ? dest.nads.push(item) : dest.nads.splice(bi,0,item);
  }
};

const boardSA = {
  lanes() {
    return SA.grupos.map(g=>({id:g.gId, nombre:g.nombre, color:g.color,
      items:g.nads.slice(g.next).map(n=>({id:n.nId, n:n.n})), ya:g.next, del:false}));
  },
  usados() { return new Set(SA.grupos.flatMap(g=>g.nads.slice(g.next).map(n=>n.nId))); },
  move(id, from, to, before) {
    let item;
    if (from==='pool') { const n = S.nadadores.find(x=>x.id===id); if (!n) return; item = {nId:n.id, n:n.n}; }
    else {
      const g = grupoSA(from); if (!g) return;
      const i = g.nads.findIndex((n,k)=>k>=g.next && n.nId===id); if (i<0) return;
      item = g.nads.splice(i,1)[0];
      if (g.next >= g.nads.length) SA.noSale.delete(g.gId);
    }
    if (to==='pool') return;
    const dest = grupoSA(to); if (!dest) return;
    const bi = before ? dest.nads.findIndex((n,k)=>k>=dest.next && n.nId===before) : -1;
    bi<0 ? dest.nads.push(item) : dest.nads.splice(bi,0,item);
    if (from!==to) DB.asignarNad(dest.gId, item.nId, dest.nads.length-1);
  }
};
function boardActual() { return route.screen==='en-curso' ? boardSA : boardPS; }

function boardMove(id, from, to, before) {
  if (before===id) return;
  boardActual().move(id, from, to, before||null);
  BOARD.sel = null;
  render();
}

function renderBoard(ad, opts) {
  const sel = BOARD.sel;

      </div>

        ${l.items.map((it,i)=>`<div class="b-card in-lane${isSel(it.id,l.id)?' sel':''}" data-action="b-card" data-card="${esc(it.id)}" data-from="${esc(l.id)}" data-n="${esc(it.n)}">

    && (!BOARD.cat || n.eqId===BOARD.cat)

    </div>` : '';
  const poolSelFromLane = sel && sel.from!=='pool';
  const pool = `
    <div class="b-pool${poolSelFromLane?' armed':''}" data-action="b-pool" data-drop="pool">
      <div class="b-pool-hdr">
        <span class="label" style="margin:0">${opts.poolTitulo||'Nadadores'}</span>
        ${poolSelFromLane?`<span class="b-pool-hint">Toca aquí para quitar a ${esc(sel.n)}</span>`:''}
      </div>
      ${pills}
      <input class="input" id="board-search" placeholder="🔍 Buscar nadador…" value="${esc(BOARD.q)}" autocomplete="off">
      <div class="b-cards b-pool-cards">
        ${libres.slice(0,max).map(n=>`<div class="b-card${isSel(n.id,'pool')?' sel':''}" data-action="b-card" data-card="${esc(n.id)}" data-from="pool" data-n="${esc(n.n)}"><span class="b-nm">${esc(n.n)}</span></div>`).join('')
          || `<div class="b-empty">${q?'Sin coincidencias':'Todos están en una calle'}</div>`}
        ${libres.length>max?`<div class="b-empty">+${libres.length-max} más · busca por nombre</div>`:''}
      </div>
    </div>`;
  return `
    <div class="b-hint">${sel?`<b>${esc(sel.n)}</b> seleccionado · toca una calle o un nadador para ponerlo delante <button class="b-cancel" data-action="b-cancel">Cancelar</button>`:'Mantén pulsado y arrastra, o toca un nadador y luego su calle'}</div>
    <div class="b-lanes">${lanes}</div>
    ${opts.extraLanes||''}
    ${pool}`;
}

// Tocar: selecciona; con algo seleccionado, toca destino
function boardTap(el) {
  const act = el.dataset.action;
  const sel = BOARD.sel;
  if (act==='b-card') {
    const id = el.dataset.card, from = el.dataset.from;
    if (!sel) { BOARD.sel = {id, from, n:el.dataset.n}; render(); return; }
    if (sel.id===id && sel.from===from) { BOARD.sel = null; render(); return; }
    if (from==='pool') {
      if (sel.from!=='pool') boardMove(sel.id, sel.from, 'pool');
      else { BOARD.sel = {id, from, n:el.dataset.n}; render(); }
      return;
    }
    boardMove(sel.id, sel.from, from, id); // delante de la tarjeta tocada
  } else if (act==='b-lane') {
    if (sel) boardMove(sel.id, sel.from, el.dataset.drop);
  } else if (act==='b-pool') {
    if (sel && sel.from!=='pool') boardMove(sel.id, sel.from, 'pool');
  }
}

// Arrastre con el dedo o el ratón (pulsación larga en táctil para no bloquear el scroll)
let DRAG = null, _ignoreClickUntil = 0;
function dragStart() {
  if (!DRAG) return;
  DRAG.started = true;
  const r = DRAG.card.getBoundingClientRect();
  const g = DRAG.card.cloneNode(true);
  g.classList.add('b-ghost');
  g.style.width = r.width+'px';
  document.body.appendChild(g);
  DRAG.ghost = g; DRAG.dx = DRAG.x - r.left; DRAG.dy = DRAG.y - r.top;
  DRAG.card.classList.add('dragging');
  try { navigator.vibrate && navigator.vibrate(15); } catch {}
  dragMoveTo(DRAG.x, DRAG.y);
  DRAG.scroll = setInterval(() => {
    if (!DRAG) return;
    const m = 80;
    if (DRAG.y < m) window.scrollBy(0, -Math.ceil((m-DRAG.y)/5));
    else if (DRAG.y > innerHeight-m) window.scrollBy(0, Math.ceil((DRAG.y-(innerHeight-m))/5));
  }, 16);
}
function dragTarget(x, y) {
  const el = document.elementFromPoint(x, y);
  if (!el) return null;
  const card = el.closest('.b-card.in-lane');
  if (card && card!==DRAG.card) return {to:card.dataset.from, before:card.dataset.card, el:card};
  const zone = el.closest('[data-drop]');
  return zone ? {to:zone.dataset.drop, before:null, el:zone} : null;
}
function dragMoveTo(x, y) {
  DRAG.x = x; DRAG.y = y;
  DRAG.ghost.style.transform = `translate(${x-DRAG.dx}px,${y-DRAG.dy}px)`;
  const t = dragTarget(x, y);
  document.querySelectorAll('.drop-over').forEach(e=>e.classList.remove('drop-over'));
  if (t) t.el.classList.add('drop-over');
  DRAG.target = t;
}
function dragEnd(drop) {
  if (!DRAG) return;
  clearTimeout(DRAG.timer); clearInterval(DRAG.scroll);
  if (DRAG.started) {
    _ignoreClickUntil = Date.now()+400;
    // Pulsación larga sin mover: no cambia nada
    if (Math.hypot(DRAG.x-DRAG.x0, DRAG.y-DRAG.y0) < 12) drop = false;
    if (DRAG.ghost) DRAG.ghost.remove();
    document.querySelectorAll('.drop-over').forEach(e=>e.classList.remove('drop-over'));
    const t = drop && DRAG.target, d = DRAG;
    DRAG = null;
    if (t && !(t.to===d.from && !t.before && d.from==='pool')) boardMove(d.id, d.from, t.to, t.before);
    else render();
    return;
  }
  DRAG = null;
}
document.addEventListener('pointerdown', e => {
  const card = e.target.closest && e.target.closest('.b-card');
  if (!card || e.button>0) return;
  DRAG = {card, id:card.dataset.card, from:card.dataset.from, x:e.clientX, y:e.clientY, x0:e.clientX, y0:e.clientY,
          mouse:e.pointerType==='mouse', started:false};
  if (!DRAG.mouse) DRAG.timer = setTimeout(dragStart, 220);
});
document.addEventListener('pointermove', e => {
  if (!DRAG) return;
  if (!DRAG.started) {
    const moved = Math.hypot(e.clientX-DRAG.x0, e.clientY-DRAG.y0);
    if (DRAG.mouse) { if (moved > 5) { DRAG.x=e.clientX; DRAG.y=e.clientY; dragStart(); } }
    else if (moved > 10) { clearTimeout(DRAG.timer); DRAG = null; } // es un scroll
    return;
  }
  dragMoveTo(e.clientX, e.clientY);
});
document.addEventListener('pointerup', () => dragEnd(true));
document.addEventListener('pointercancel', () => dragEnd(false));
// Mientras se arrastra, el dedo no desplaza la página
document.addEventListener('touchmove', e => { if (DRAG && DRAG.started) e.preventDefault(); }, {passive:false});
document.addEventListener('contextmenu', e => { if (e.target.closest && e.target.closest('.b-card')) e.preventDefault(); });

const autoGuardado = () => { try { return localStorage.getItem('crono_auto') === '1'; } catch { return false; } };
function planNombre() { const el = document.getElementById('plan-nombre'); if (el && PS && PS.plan) PS.plan.nombre = el.value; }
function guardarAuto(v) { try { localStorage.setItem('crono_auto', v ? '1' : '0'); } catch {} }
let _ac = null;   // audio: se crea con un toque del entrenador (los móviles no suenan sin él)
function desbloquearAudio() {
  try { if (!_ac) { const C = window.AudioContext || window.webkitAudioContext; if (C) _ac = new C(); } if (_ac && _ac.state === 'suspended') _ac.resume(); } catch {}
}
function pitido(ms, hz) {
  try {
    if (!_ac) return;
    const o = _ac.createOscillator(), g = _ac.createGain(), t = _ac.currentTime;
    o.frequency.value = hz; o.connect(g); g.connect(_ac.destination);
    g.gain.setValueAtTime(.3, t); g.gain.exponentialRampToValueAtTime(.001, t + ms/1000);
    o.start(t); o.stop(t + ms/1000);
  } catch {}
}
// Campo de ciclo + interruptor de salida automática (t: 'ps' preparar, 'ns' nueva serie)

    <div class="toggle-row${o.ciclo?'':' dis'}" style="margin:0;flex:1" ${o.ciclo?`data-action="ciclo-auto" data-t="${t}"`:''}>
      <div style="flex:1;font-weight:600;font-size:14px">Salida automática</div><div class="sw${o.ciclo&&o.auto?' on':''}"></div></div>
  </div>`;
}
const cicloObj = t => t === 'ps' ? PS : t.startsWith('plan-') ? (PS && PS.plan && PS.plan.series[Number(t.slice(5))]) : (SA && SA.nuevaSerie);

function misPlanes() { return S.planes.filter(p=>p.coach===coachName).sort((a,b)=>(b.ts||0)-(a.ts||0)); }
const serieVacia = () => ({estilo:'libre', dist:50, parciales:false, ciclo:null, cicloTxt:'', auto:autoGuardado()});
// Abre preparar en modo plan: el mismo tablero de calles y, en lugar de estilo/distancia, la lista de series
function abrirPlan(id) {
  const p = id ? S.planes.find(x=>x.id===id) : null;
  navPreparar(p ? p.eqId : null);
  PS.oferta = null;
  PS.plan = {id: p ? p.id : null, nombre: p ? p.nombre : '',
    series: p && p.series.length ? p.series.map(x=>({...x, cicloTxt: x.ciclo ? fmtNado(x.ciclo*1000) : ''})) : [serieVacia()]};
  if (p) {

      nads: c.nIds.map(id=>S.nadadores.find(n=>n.id===id)).filter(Boolean).map(n=>({id:n.id, n:n.n}))}));
    if (calles.length) PS.grupos = calles;

function renderSeriesPlan() {

  return ss.map((x,i)=>`
    <div class="card plan-serie">

      ${(() => { const ok = Number(x.dist) > 50; return `<div class="toggle-row${ok?'':' dis'}" ${ok?`data-action="plan-parc" data-i="${i}"`:''}><div style="flex:1;font-weight:600;font-size:14px">⏱ Parciales cada 50 m</div><div class="sw${ok&&x.parciales?' on':''}"></div></div>`; })()}
      ${cicloHTML(x, 'plan-'+i)}

async function guardarPlanPS() {
  const p = PS.plan, calles = PS.grupos.filter(g=>g.nads.length);
  const nombre = (document.getElementById('plan-nombre')||{}).value || p.nombre;
  if (!calles.length) { alert('Pon al menos un nadador en una calle.'); return; }
  const data = {coach: coachName, ts: Date.now(), nombre: String(nombre||'').trim().slice(0,200) || 'Entreno',
    eqId: PS.eqId || eqMasFrecuente(calles), calles: calles.map(g=>({nombre:g.nombre, nIds:g.nads.map(n=>n.id)})),
    series: p.series.map(x=>({estilo:x.estilo, dist:Number(x.dist)||null, parciales:!!x.parciales && Number(x.dist)>50, ciclo:x.ciclo||null, auto:!!(x.ciclo && x.auto)}))};
  await DB.guardarPlan(p.id, data);
  PS = null; nav({screen:'home'});
}
// Empieza un entreno preparado: sus calles y su serie 1; al acabar cada serie se ofrece la siguiente
async function empezarPlan(id) {
  const p = S.planes.find(x=>x.id===id); if (!p || !p.series.length) return;
  navPreparar(p.eqId);
  PS.oferta = null;
  const calles = p.calles.map((c,i)=>({key:'calle'+i+'-'+Date.now(), nombre:c.nombre,
    nads: c.nIds.map(n=>S.nadadores.find(x=>x.id===n)).filter(Boolean).map(n=>({id:n.id, n:n.n}))})).filter(c=>c.nads.length);
  if (!calles.length) { alert('Los nadadores de este entreno ya no están en la lista.'); return; }
  PS.grupos = calles;
  const s1 = p.series[0];
  Object.assign(PS, {estilo:s1.estilo, dist:s1.dist, parciales:s1.parciales, ciclo:s1.ciclo, cicloTxt:s1.ciclo?fmtNado(s1.ciclo*1000):'', auto:s1.auto, planId:p.id});
  await iniciarSesion();
}

// Asistencia: quien está en una calle cuenta como presente; aquí se marca a quien vino sin nadar
function renderQuienMas() {
  const enCalle = new Set(PS.grupos.flatMap(g=>g.nads.map(n=>n.id)));
  const eqId = PS.eqId || eqMasFrecuente(PS.grupos.filter(g=>g.nads.length));
  const otros = S.nadadores.filter(n=>n.eqId===eqId && !enCalle.has(n.id)).sort((a,b)=>a.n.localeCompare(b.n));
  if (!otros.length) return '';
  const n = otros.filter(x=>PS.extras.has(x.id)).length;
  return `<details class="card quien"${PS.quienAbierto?' open':''}><summary data-action="quien-toggle">¿Quién más vino? <span class="muted">(no nada${n?` · ${n} marcados`:''})</span></summary>
    <div class="wrap" style="margin-top:8px">${otros.map(x=>`<span class="pill${PS.extras.has(x.id)?' sel':''}" data-action="presente" data-nid="${esc(x.id)}">${esc(x.n)}</span>`).join('')}</div></details>`;
}
let ASIST_ABIERTA = null;   // la lista de asistencia del resumen sigue abierta mientras se marca
function renderAsistencia(ses) {
  const conTiempo = new Set(S.resultados.filter(r=>r.sesId===ses.id).map(r=>r.nId));
  const pres = new Set(Array.isArray(ses.presentes) ? ses.presentes : conTiempo);
  const grupo = S.nadadores.filter(n=>n.eqId===ses.eqId || pres.has(n.id)).sort((a,b)=>a.n.localeCompare(b.n));
  if (!grupo.length) return '';
  return `<details class="card mt8 quien"${ASIST_ABIERTA===ses.id?' open':''}><summary data-action="asist-toggle" data-ses="${esc(ses.id)}">Asistencia: <b>${pres.size}</b> ${pres.size===1?'presente':'presentes'} <span class="muted">· toca para cambiar</span></summary>
    <div class="wrap" style="margin-top:8px">${grupo.map(x=>`<span class="pill${pres.has(x.id)?' sel':''}" data-action="res-presente" data-ses="${esc(ses.id)}" data-nid="${esc(x.id)}">${esc(x.n)}</span>`).join('')}</div></details>`;
}
