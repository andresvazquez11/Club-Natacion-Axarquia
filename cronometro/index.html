function renderEnCurso() {
  if (!SA) return '';
  const ses = S.sesiones.find(s=>s.id===SA.sesId);
  const titulo = comboLabel(SA.estilo, SA.dist);
  const eq = ses?eqNombre(ses.eqId):'';
  const now = Date.now();
  const totalNads = SA.grupos.reduce((s,g)=>s+g.nads.length,0);
  const pendientes = SA.grupos.filter(g=>g.next<g.nads.length);

  let html = `
    <div class="ec-top">
      <div style="flex:1;min-width:0">
        <div style="font-size:17px;font-weight:700">${titulo} · <span style="color:var(--blu-l)">Serie ${SA.ronda}</span></div>
        <div class="muted" style="font-size:13px">${esc(eq)} · ${SA.llegados.length}/${totalNads} llegados</div>
      </div>
      <button class="fin-btn${SA.finArmed?' armed':''}" data-action="finalizar-sesion">${SA.finArmed?'¿Terminar? Toca otra vez':'Terminar'}</button>
    </div>
    ${'wakeLock' in navigator ? '' : '<div class="muted" style="font-size:11px;margin:-6px 0 8px">Este móvil no permite mantener la pantalla encendida: súbele el tiempo de bloqueo en Ajustes.</div>'}
    <div class="nado-clk${SA.nado.some(x=>x.fin==null)?'':' parado'}"><span class="muted">Tiempo nadando</span><b id="live-nado">${fmtNado(msNadando(SA.nado, now))}</b></div>`;

  // Ronda terminada → resumen
  if (rondaTerminada()) return html + renderResumenRonda();

  // SALIDA común: muestra quién sale en cada calle. Tocar un nombre = "no sale"
  if (SA.editando) {
    html += renderEditarCalles();
  } else if (pendientes.length) {
    const salen = pendientes.filter(g=>!SA.noSale.has(g.gId)).length;
    html += `
      <div class="salida-card">
        <div class="sec-hdr" style="margin:0 0 8px">
          <span class="label">Próxima salida${SA.nSalida?` · ${SA.nSalida+1}`:''}</span>
          <button class="edit-link" data-action="edit-abrir">✎ Calles</button>
        </div>
        <div class="salida-next">
          ${pendientes.map(g=>{ const off = SA.noSale.has(g.gId); return `<button class="next-chip${off?' off':''}" data-action="no-sale" data-gid="${esc(g.gId)}">${laneTag(laneShort(g), g.color)}<span class="nm">${esc(g.nads[g.next].n)}</span>${off?'<span class="ns">no sale</span>':''}</button>`; }).join('')}
        </div>
        <div class="muted" style="font-size:12px;margin:-4px 0 8px">Toca un nombre si ese nadador no sale · mantén pulsado un nadador para anotar</div>
        ${SA.ciclo ? `<div class="ciclo-cd">
          <div style="flex:1"><div class="muted" style="font-size:12px">Ciclo ${esc(fmtNado(SA.ciclo*1000))} · ${SA.auto?'salida automática':'manual'}</div>
            ${SA.nSalida>0?`<b id="live-ciclo">${fmtNado(Math.max(0, Math.ceil(cicloEstado(SA.tUltSalida, SA.ciclo, now, true).restaMs/1000)*1000))}</b>`:'<span style="font-size:13px">La cuenta empieza con la primera SALIDA</span>'}</div>
          <button class="btn btn-surf btn-sm btn-inline" data-action="ciclo-sa">${SA.auto?'⏸ Pausar ciclo':'▶ Automática'}</button>
        </div>` : ''}
        <button class="salida-btn" data-action="salida-tanda" ${salen?'':'disabled'}>🚀 SALIDA${salen<pendientes.length&&salen?` (${salen})`:''}</button>
      </div>`;
  } else {
    html += `<div class="salida-card muted" style="display:flex;align-items:center;gap:10px;font-size:14px"><span style="flex:1">Todos han salido · esperando llegadas</span><button class="edit-link" data-action="edit-abrir">✎ Calles</button></div>`;
  }

  // En el agua: una columna fija por calle, con su color. Cuando alguien llega
  // solo se mueve su columna; las demás calles no saltan bajo el dedo.
  const recientesKeys = new Set(SA.recientes.map(r=>r.key));
  const enAgua = SA.agua.length + SA.recientes.length;
  if (enAgua) {
    const cols = Math.min(SA.grupos.length, 4);
    html += `<div class="sec-hdr"><span class="label">En el agua (${SA.agua.length})</span>${SA.tramos>1?'<span class="muted" style="font-size:11px">Toca la tarjeta en cada 50 m</span>':''}</div>
      <div class="lanes-grid" style="grid-template-columns:repeat(${cols},minmax(0,1fr))">
      ${SA.grupos.map(g => {
        const fs = [...SA.agua, ...SA.recientes].filter(f=>f.gId===g.gId).sort((a,b)=>a.salida-b.salida);
        return `<div class="lane-col" style="--lc:${g.color};--lt:${laneTxt(g.color)}">
          <div class="lane-head">${esc(laneShort(g))}</div>
          ${fs.map(f => renderSwCard(f, recientesKeys.has(f.key), now)).join('') || '<div class="lane-empty">—</div>'}
        </div>`;
      }).join('')}
      </div>`;
  }

  // Llegados: compactos, el último arriba
  const lleg = SA.llegados.filter(l=>!recientesKeys.has(l.key)).sort((a,b)=>b.tLleg-a.tLleg);
  if (lleg.length) {
    html += `<div class="sec-hdr" style="margin-top:16px"><span class="label">Llegados ✓ (${lleg.length})</span></div>
      <div class="lleg-list">
      ${lleg.map(l=>`<div class="lleg-row" data-key="${esc(l.key)}" style="--lc:${l.color}">
          ${laneTag(l.lane, l.color)}
          <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(l.n)}${l.nota?' 📝':''}${l.marca?` <span class="lleg-marca">${MARCA_TXT[l.marca]}</span>`:''}</span>
          <span class="t">${fmtTime(l.ms)}</span>
          <button class="lleg-undo" data-action="deshacer" data-key="${esc(l.key)}" aria-label="Deshacer">↶</button>
        </div>`).join('')}
      </div>`;
  }
  return html;
}

// Tarjeta de un nadador en el agua: toda la tarjeta es el botón
function renderSwCard(f, done, now) {
  const conParc = SA.tramos > 1;
  const dots = conParc ? `<span class="sw-dots">${Array.from({length:SA.tramos},(_,i)=>`<i class="${i<f.parc.length?'on':''}${i<f.parc.length&&f.parc[i]==null?' skip':''}"></i>`).join('')}</span>` : '';
  if (done) {
    return `<div class="sw-card done" data-key="${esc(f.key)}">
      <span class="sw-nm">${esc(f.n)}${f.nota?' 📝':''}</span>
      <span class="sw-clk">${fmtTime(f.ms)}</span>
      ${f.marca?`<span class="sw-marca">${MARCA_TXT[f.marca]}</span>`:''}
      <span class="sw-act">✓ Llegó</span>
      <button class="sw-undo" data-action="deshacer" data-key="${esc(f.key)}">↶ Deshacer</button>
    </div>`;
  }
  const esParcial = conParc && f.parc.length < SA.tramos-1;
  const ultimo = conParc && f.parc.length ? f.parc[f.parc.length-1] : null;
  return `<button class="sw-card${esParcial?' parcial':''}" data-action="llego" data-key="${esc(f.key)}">
      <span class="sw-meta">S${f.salida}${dots}</span>
      <span class="sw-nm">${esc(f.n)}${f.nota?' 📝':''}</span>
      <span class="sw-clk live-clk" data-t0="${f.t0}">${fmtTime(now-f.t0)}</span>
      ${ultimo!=null?`<span class="sw-last">${f.parc.length*50}m ${fmtTime(ultimo)}</span>`:''}
      <span class="sw-act">${esParcial?`<small>parcial</small>${(f.parc.length+1)*50} m`:'LLEGÓ'}</span>
    </button>
    ${conParc ? `<div class="sw-extra">
      ${f.parc.length?`<button class="sw-mini" data-action="deshacer-parcial" data-key="${esc(f.key)}" aria-label="Deshacer parcial">↶</button>`:''}
      ${esParcial?`<button class="sw-mini fin" data-action="llego-directo" data-key="${esc(f.key)}">🏁 Llegó</button>`:''}
    </div>` : ''}`;
}

function renderResumenRonda() {
  const lleg = SA.llegados;
  const best = Math.min(...lleg.map(l=>l.ms));
  const pbBadge = l => {
    const prev = mejorPrevia(l.nId, l.resId);
    return prev!=null && l.ms < prev ? '<span class="pb">MEJOR ENTRENO</span>' : '';
  };
  const cmpDe = l => comparaciones(l.nId, SA.estilo, SA.dist, l.ms, l.resId, Date.now());
  const cmpBadge = l => { const c = cmpDe(l); return c.difComp!=null && c.difComp < 0 ? '<span class="pb pb-comp">MEJORA SU MARCA</span>' : ''; };
  const fila = (l, pos, gap) => `
    <div class="sum-row" style="--lc:${l.color}">
      ${pos!=null?`<div class="rpos${pos===1?' gold':''}">${pos}</div>`:''}
      ${laneTag(l.lane, l.color)}
      <div class="sum-name">${esc(l.n)}${pbBadge(l)}${cmpBadge(l)}${SA.tramos>1 && l.parc ? `<div class="sum-parc">${fmtTramos([...l.parc, ...Array(Math.max(0,SA.tramos-1-l.parc.length)).fill(null), l.ms])}</div>` : ''}${comparaHTML(cmpDe(l))}</div>
      <div style="text-align:right">
        <div class="sum-time">${fmtTime(l.ms)}</div>
        ${gap?`<div class="sum-gap">${gap}</div>`:''}
      </div>
    </div>`;

  let cuerpo;
  if (SA.vista==='calle') {
    cuerpo = SA.grupos.map(g => {
      const ls = lleg.filter(l=>l.gId===g.gId).sort((a,b)=>a.salida-b.salida);
      if (!ls.length) return '';
      return `<div class="lane-block">
        <span class="label" style="color:${g.color}">${esc(g.nombre)}</span>
        ${ls.map(l=>fila(l, null, `salida ${l.salida}`)).join('')}
      </div>`;
    }).join('');
  } else {
    cuerpo = [...lleg].sort((a,b)=>a.ms-b.ms)
      .map((l,i)=>fila(l, i+1, i===0?'':`+${((l.ms-best)/1000).toFixed(1)}`)).join('');
  }

  return `
    <div class="card" style="text-align:center;padding:14px">
      <div style="font-size:28px">🏁</div>
      <div style="font-weight:700;font-size:17px">Serie ${SA.ronda} completa · ${comboLabel(SA.estilo, SA.dist)}</div>
      <div class="muted" style="font-size:13px">${lleg.length} nadadores · mejor ${fmtTime(best)}</div>
    </div>
    <div class="seg">
      <button class="${SA.vista!=='calle'?'on':''}" data-action="vista" data-v="rapidos">⚡ Más rápidos</button>
      <button class="${SA.vista==='calle'?'on':''}" data-action="vista" data-v="calle">🏊 Por calle</button>
    </div>
    ${cuerpo}
    ${!SA.nuevaSerie && SA.plan ? (SA.plan.series[SA.planIdx+1]
      ? `<button class="btn btn-green mt16" style="min-height:60px;font-size:18px" data-action="plan-siguiente">▶ Siguiente serie: ${esc(comboTexto(SA.plan.series[SA.planIdx+1].estilo, SA.plan.series[SA.planIdx+1].dist))}${SA.plan.series[SA.planIdx+1].ciclo?` · c/${esc(fmtNado(SA.plan.series[SA.planIdx+1].ciclo*1000))}`:''}</button>`
      : `<div class="card mt16" style="text-align:center;color:var(--grn-l);font-weight:700">✓ Plan terminado (${SA.plan.series.length} series)</div>`) : ''}
    ${SA.nuevaSerie ? renderNuevaSerie() : `
    <button class="btn btn-blue mt16" style="min-height:56px;font-size:17px" data-action="repetir-serie">🔁 Repetir igual · serie ${SA.ronda+1}</button>
    <button class="btn btn-surf mt8" style="min-height:52px;font-size:16px" data-action="ns-abrir">➕ Nueva serie con otro estilo</button>`}
    <button class="btn btn-green mt8" style="min-height:56px;font-size:17px" data-action="finalizar-sesion">🏁 Terminar entrenamiento</button>`;
}
function renderNuevaSerie() {
  const f = SA.nuevaSerie, ok = Number(f.dist) > 50;
  return `<div class="card mt16" style="border-color:var(--blu)">

function datosEntrenamiento(sesId) {
  const ses = S.sesiones.find(s=>s.id===sesId);
  if (!ses) return null;
  const series = seriesDe(sesId);
  const res = S.resultados.filter(r=>r.sesId===sesId);
  const nads = [...new Set(res.map(r=>r.nId))].map(nombreDe).sort((a,b)=>a.localeCompare(b));
  const combos = [...new Set(series.map(x=>comboTexto(x.estilo, x.dist)))];
  const fin = ses.fin || null;
  return {ses, series, nads, combos, nTiempos: res.length,
          min: fin ? Math.max(1, Math.round((fin - ses.fecha)/60000)) : null};
}

// ── Sincronizar nadadores con la web de estadísticas ─────────
// nadadores.json lo genera cada día el proceso de la web (licencia RFEN, nombre, categoría).
const CAT_EQUIPO = {BEN:['club_ben','Benjamín'], ALE:['club_ale','Alevín'], INF:['club_inf','Infantil'], JUN:['club_jun','Junior'], ABS:['club_abs','Absoluto']};
function normNombre(s) {
  return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z ]/g,'').split(/\s+/).filter(Boolean).join(' ');
}
let _sync = null;
const EQUIPOS_CAT = new Set(Object.values(CAT_EQUIPO).map(x=>x[0]));
function esEquipoClub(eqId) { return EQUIPOS_CAT.has(eqId) || !!S.equipos.find(e=>e.id===eqId && e.shared); }
async function sincronizarNadadores() {
  _sync = {estado:'Leyendo la lista del club…'}; render();
  try {
    const r = await fetch('nadadores.json', {cache:'no-cache'});
    if (!r.ok) throw new Error('No se pudo leer nadadores.json ('+r.status+')');
    const web = (await r.json()).nadadores || [];
    const res = {nuevos:0, emparejados:0, categoria:0, nombre:0, sinCambios:0, equipos:0};
    for (const [cat, [eqId, nombre]] of Object.entries(CAT_EQUIPO)) {
      if (!S.equipos.find(e=>e.id===eqId) && web.some(w=>w.cat===cat)) {
        await _db.collection('equipos').doc(eqId).set({nombre, shared:true, ts:Date.now()}); res.equipos++;
      }
    }
    const club = S.nadadores.filter(n => esEquipoClub(n.eqId));
    for (const w of web) {
      if (!/^\d{3,12}$/.test(String(w.id)) || !CAT_EQUIPO[w.cat]) continue;
      const eqId = CAT_EQUIPO[w.cat][0];
      let nad = S.nadadores.find(n=>n.rfen===String(w.id));   // la licencia manda, esté en el equipo que esté
      if (!nad) {
        const cands = club.filter(n=>!n.rfen && normNombre(n.n)===normNombre(w.n));
        if (cands.length===1) { nad = cands[0]; await _db.collection('nadadores').doc(nad.id).update({rfen:String(w.id)}); res.emparejados++; }
      }
      if (!nad) {
        await _db.collection('nadadores').doc('rfen_'+w.id).set({eqId, n:String(w.n).slice(0,200), rfen:String(w.id)}); res.nuevos++; continue;
      }
      const cambios = {};
      if (nad.eqId !== eqId) { cambios.eqId = eqId; res.categoria++; }
      if (nad.n !== w.n) { cambios.n = String(w.n).slice(0,200); res.nombre++; }
      if (Object.keys(cambios).length) await _db.collection('nadadores').doc(nad.id).update(cambios); else res.sinCambios++;
    }
    const enWeb = new Set(web.map(w=>String(w.id)));
    const fuera = club.filter(n=>n.rfen && !enWeb.has(n.rfen)).length;
    _sync = {estado:`Listo · ${res.nuevos} nuevos · ${res.emparejados} emparejados · ${res.categoria} cambian de categoría · ${res.nombre} nombres actualizados · ${res.sinCambios} sin cambios${fuera?` · ${fuera} ya no están en la web (se conservan)`:''}`};
  } catch (e) {
    _sync = {estado:'Error: '+e.message};
  }
  render();
}
async function cambiarAcceso(email, accion) {
  const cambio = accion === 'aprobar' ? {aprobado: true, bloqueado: false} : {bloqueado: true};
  await _db.collection('entrenadores').doc(email).update(cambio).catch(e=>alert(e.message));
}

});
document.getElementById('app').addEventListener('pointermove', function(e) {
  if (_lp && Math.hypot(e.clientX-_lp.x, e.clientY-_lp.y) > 10) { clearTimeout(_lp.timer); _lp = null; }
});
function finPulsacion() {
  if (_lp) { clearTimeout(_lp.timer); _lp = null; }
  if (_notaPend) { const k = _notaPend; _notaPend = null; _ignoreClickUntil = Date.now() + 400; setTimeout(() => pedirNota(k), 0); }
}
document.getElementById('app').addEventListener('pointerup', finPulsacion);
document.getElementById('app').addEventListener('pointercancel', finPulsacion);
function pedirNota(key) {
  if (!SA) return;
  const x = SA.agua.find(a=>a.key===key) || SA.llegados.find(l=>l.key===key);
  if (!x) return;
  const txt = prompt(`Nota para ${x.n}`, x.nota || '');
  if (txt === null) return;
  x.nota = txt.trim().slice(0, 200) || null;
  if (x.resId) DB.guardarNota(x.resId, x.nota);   // ya llegó; si no, se guarda al llegar
  render();
}
function tiempoToque(btn) {
  const id = btn.dataset.action+'|'+(btn.dataset.key||'');
  return (_press && _press.id===id && Date.now()-_press.t < 1500) ? _press.t : Date.now();
}
document.getElementById('app').addEventListener('click', async function(e) {
  if (Date.now() < _ignoreClickUntil) return; // clic que sigue a un arrastre
  const btn = e.target.closest('[data-action]');
  if (!btn) { if (MENU_ABIERTO) { MENU_ABIERTO = false; render(); } return; }
  e.stopPropagation();
  const act = btn.dataset.action;
  if (act !== 'menu') MENU_ABIERTO = false;
  switch(act) {
    case 'menu':         MENU_ABIERTO = !MENU_ABIERTO; render(); break;
    case 'tab':          nav({screen: btn.dataset.to}); window.scrollTo(0,0); break;
    case 'nad-cat':      NAD_CAT = btn.dataset.eq; try { localStorage.setItem('crono_cat', NAD_CAT); } catch {} render(); break;
    case 'repetir-entreno': repetirEntreno(btn.dataset.ses); break;
    case 'quien-toggle': if (PS) PS.quienAbierto = !e.target.closest('details').open; break;
    case 'presente':     { saveNotas(); if (PS) { const id = btn.dataset.nid; PS.extras.has(id) ? PS.extras.delete(id) : PS.extras.add(id); PS.quienAbierto = true; render(); } break; }
    case 'res-presente': { const ses = S.sesiones.find(x=>x.id===btn.dataset.ses); if (!ses) break;
      const pres = new Set(Array.isArray(ses.presentes) ? ses.presentes : S.resultados.filter(r=>r.sesId===ses.id).map(r=>r.nId));
      pres.has(btn.dataset.nid) ? pres.delete(btn.dataset.nid) : pres.add(btn.dataset.nid);
      ASIST_ABIERTA = ses.id; DB.guardarPresentes(ses.id, [...pres]); render(); break; }
    case 'asist-toggle': ASIST_ABIERTA = e.target.closest('details').open ? null : btn.dataset.ses; break;
    case 'plan-nuevo':   abrirPlan(null); break;
    case 'plan-editar':  abrirPlan(btn.dataset.id); break;
    case 'plan-borrar':  { const p = S.planes.find(x=>x.id===btn.dataset.id); if (p && confirm(`¿Borrar el entreno preparado «${p.nombre}»?`)) await DB.borrarPlan(p.id); break; }
    case 'plan-empezar': desbloquearAudio(); await empezarPlan(btn.dataset.id); break;
    case 'plan-cancelar': PS = null; nav({screen:'home'}); break;
    case 'plan-guardar': await guardarPlanPS(); break;
    case 'plan-add':     planNombre(); PS.plan.series.push({...serieVacia(), ...(([u]) => u ? {estilo:u.estilo, dist:u.dist} : {})(PS.plan.series.slice(-1))}); render(); break;
    case 'plan-quitar':  planNombre(); PS.plan.series.splice(Number(btn.dataset.i), 1); render(); break;
    case 'plan-mover':   { planNombre(); const i = Number(btn.dataset.i), j = i + Number(btn.dataset.dir), ss = PS.plan.series; [ss[i], ss[j]] = [ss[j], ss[i]]; render(); break; }
    case 'plan-estilo':  planNombre(); PS.plan.series[Number(btn.dataset.i)].estilo = btn.dataset.val; render(); break;
    case 'plan-dist':    { planNombre(); const x = PS.plan.series[Number(btn.dataset.i)]; x.dist = Number(btn.dataset.val); if (x.dist <= 50) x.parciales = false; render(); break; }
    case 'plan-parc':    { planNombre(); const x = PS.plan.series[Number(btn.dataset.i)]; x.parciales = !x.parciales; render(); break; }
    case 'plan-siguiente': if (SA && SA.plan && SA.plan.series[SA.planIdx+1]) { SA.planIdx++; repetirSerie(SA.plan.series[SA.planIdx]); } break;
    case 'hist-estilo':  HIST_F.estilo = HIST_F.estilo===btn.dataset.val ? null : btn.dataset.val; guardarHistF(); render(); break;
    case 'hist-dist':    { const d = Number(btn.dataset.val); HIST_F.dist = HIST_F.dist===d ? null : d; guardarHistF(); render(); break; }
    case 'set-coach': {
      const inp = document.getElementById('coach-input');
      const v = inp?inp.value.trim():'';
      if (!v) return;
      saveCoach(v); render(); break;
    }
    case 'cambiar-nombre': {
      coachName = null;
      try { localStorage.removeItem('coach_name'); } catch {}
      render(); break;
    }
    case 'home':         nav({screen:'home'}); break;
    case 'login-google': await loginGoogle(); break;
    case 'logout':       await logout(); break;
    case 'entrenadores': nav({screen:'entrenadores'}); break;
    case 'sync-nadadores': await sincronizarNadadores(); break;
    case 'acceso-entrenador': await cambiarAcceso(btn.dataset.email, btn.dataset.accion); break;
    case 'historial':    nav({screen:'historial'}); break;
    case 'hist-det':      nav({screen:'hist-det', sesId:btn.dataset.ses}); break;
    case 'evolucion':     nav({screen:'nadadores'}); break;
    case 'evolucion-nad': nav({screen:'evolucion-nad', nId:btn.dataset.nid, filter:null}); break;
    case 'evo-filter': {
      const fStr=btn.dataset.f;
      if (!fStr) { route.filter=null; }
      else { const [es,di]=fStr.split('|'); route.filter={estilo:es,dist:parseInt(di)}; }
      render(); break;
    }
    case 'go-equipo':    nav({screen:'equipo', eqId:btn.dataset.eq}); break;
    case 'equipo-back':  { const eid=PS&&PS.eqId; PS=null; nav(eid?{screen:'equipo',eqId:eid}:{screen:'home'}); break; }
    case 'nueva-sesion': navPreparar(null); break;
    case 'usar-plantilla': saveNotas(); usarPlantilla(); break;
    case 'descartar-plantilla': saveNotas(); if (PS) { PS.oferta = null; render(); } break;
    case 'crear-equipo': {
      const inp = document.getElementById('eq-input');
      const v = inp?inp.value.trim():'';
      if (!v) return;
      inp.value='';
      await DB.crearEquipo(v);
      break;
    }
    case 'del-equipo':   await DB.borrarEquipo(btn.dataset.eq); break;
    case 'preparar':     navPreparar(btn.dataset.eq||route.eqId); break;
    case 'crear-nad': {
      const inp = document.getElementById('nad-input');
      const v = inp?inp.value.trim():'';
      if (!v) return;
      inp.value='';
      await DB.crearNadador(route.eqId, v);
      break;
    }
    case 'del-nad':      await DB.borrarNadador(btn.dataset.nad); break;
    case 'set-estilo':   saveNotas(); if(PS){PS.estilo=btn.dataset.val;render();} break;
    case 'set-dist':     saveNotas(); if(PS){PS.dist=parseInt(btn.dataset.val);render();} break;
    case 'quitar-de-grupo': saveNotas(); quitarDeGrupo(btn.dataset.gkey, btn.dataset.nad); break;
    case 'mover-grupo':  saveNotas(); moverGrupo(parseInt(btn.dataset.idx), parseInt(btn.dataset.dir)); break;
    case 'eliminar-grupo': saveNotas(); if(PS){PS.grupos.splice(parseInt(btn.dataset.idx),1);render();} break;
    case 'nueva-calle':  saveNotas(); if(PS){const n=PS.grupos.length+1;PS.grupos.push({key:'calle'+Date.now()+'-'+Math.random().toString(36).slice(2,6),nombre:`Calle ${n}`,nads:[]});render();} break;
    case 'iniciar-sesion': saveNotas(); desbloquearAudio(); await iniciarSesion(); break;
    case 'set-club-cat': saveNotas(); if(PS){PS.clubCat=btn.dataset.cat||null;render();} break;
    case 'add-nad-to-grupo': saveNotas(); {
      if (!PS) break;
      const {gkey,nid,n} = btn.dataset;
      const g = PS.grupos.find(g=>g.key===gkey);
      if (g && !g.nads.find(x=>x.id===nid)) {
        g.nads.push({id:nid,n});
      }
      render();
      // mantener el foco en el input de esa calle
      const inp = document.getElementById('gs-'+gkey);
      if (inp) { inp.focus(); }
      break;
    }
    case 'mover-nad-grupo': moverNadGrupo(btn.dataset.gkey, +btn.dataset.pi, +btn.dataset.dir); break;
    case 'salida-tanda':    desbloquearAudio(); salidaTanda(tiempoToque(btn)); break;
    case 'llego': {
      const t = tiempoToque(btn);
      // Si la lista cambió entre el toque y el soltar, el dedo apuntaba a otra fila: ignorar
      if (_press && SA && _press.t < SA.tLayout && Date.now()-_press.t < 1500) break;
      marcaNad(btn.dataset.key, t); break;
    }
    case 'deshacer':        deshacerLlegada(btn.dataset.key); break;
    case 'deshacer-parcial': deshacerParcial(btn.dataset.key); break;
    case 'llego-directo':   llegoDirecto(btn.dataset.key, Date.now()); break;
    case 'b-card': case 'b-lane': case 'b-pool': saveNotas(); boardTap(btn); break;
    case 'b-cancel':        BOARD.sel = null; render(); break;
    case 'board-cat':       saveNotas(); BOARD.cat = btn.dataset.cat || null; render(); break;
    case 'b-lane-del': {
      saveNotas();
      if (PS) { PS.grupos = PS.grupos.filter(g=>g.key!==btn.dataset.lane); BOARD.sel = null; render(); }
      break;
    }
    case 'toggle-parciales': saveNotas(); if (PS) { PS.parciales = !PS.parciales; render(); } break;
    case 'no-sale':         toggleNoSale(btn.dataset.gid); break;
    case 'edit-abrir':      if (SA) { SA.editando = true; boardReset(); render(); } break;
    case 'edit-cerrar':     if (SA) { SA.editando = false; SA.buscar = null; render(); } break;
    case 'ed-mover':        editMover(btn.dataset.gid, +btn.dataset.i, +btn.dataset.dir); break;
    case 'ed-quitar':       editQuitar(btn.dataset.gid, +btn.dataset.i); break;
    case 'ed-buscar':       if (SA) { SA.buscar = {gId:btn.dataset.gid, q:''}; render(); const i=document.getElementById('sa-search'); if (i) i.focus(); } break;
    case 'ed-buscar-cerrar': if (SA) { SA.buscar = null; render(); } break;
    case 'ed-agregar':      editAgregar(btn.dataset.gid, btn.dataset.nid); break;
    case 'ed-nueva-calle':  await editNuevaCalle(); break;
    case 'vista':           if (SA) { SA.vista = btn.dataset.v; render(); } break;
    case 'repetir-serie':   repetirSerie(); break;
    case 'ns-abrir':        if (SA) { SA.nuevaSerie = {estilo:SA.estilo, dist:SA.dist, parciales:SA.parciales, ciclo:SA.ciclo, cicloTxt:SA.cicloTxt, auto:SA.auto}; render(); } break;
    case 'ciclo-auto':      { saveNotas(); planNombre(); const o = cicloObj(btn.dataset.t); if (o && o.ciclo) { o.auto = !o.auto; guardarAuto(o.auto); render(); } break; }
    case 'ciclo-sa':        if (SA) { SA.auto = !SA.auto; guardarAuto(SA.auto); render(); } break;
    case 'ns-cancelar':     if (SA) { SA.nuevaSerie = null; render(); } break;
    case 'ns-estilo':       if (SA && SA.nuevaSerie) { SA.nuevaSerie.estilo = btn.dataset.val; render(); } break;
    case 'ns-dist':         if (SA && SA.nuevaSerie) { SA.nuevaSerie.dist = Number(btn.dataset.val); render(); } break;
    case 'ns-parc':         if (SA && SA.nuevaSerie) { SA.nuevaSerie.parciales = !SA.nuevaSerie.parciales; render(); } break;
    case 'ns-empezar':      if (SA && SA.nuevaSerie && SA.nuevaSerie.estilo && SA.nuevaSerie.dist) repetirSerie(SA.nuevaSerie); break;
    case 'pdf':             await generarPDF(btn.dataset.ses||route.sesId, btn); break;
    case 'pdf-compartir':   await generarPDF(btn.dataset.ses||route.sesId, btn, true); break;
    case 'finalizar-sesion': await finalizarSesion(); break;
    case 'exportar':     await exportar(btn.dataset.ses||route.sesId); break;
  }
  if (route.screen==='en-curso') { if (!_clk) startClock(); }
});

document.getElementById('app').addEventListener('keydown', async function(e) {
  if (e.key!=='Enter') return;
  if (e.target.id==='coach-input') {
    const v=e.target.value.trim(); if(!v) return;
    saveCoach(v); render();
  } else if (e.target.id==='eq-input') {
    const v=e.target.value.trim(); if(!v) return;
    e.target.value=''; await DB.crearEquipo(v);
  } else if (e.target.id==='nad-input') {
    const v=e.target.value.trim(); if(!v) return;
    e.target.value=''; await DB.crearNadador(route.eqId, v);
  }
});

document.getElementById('app').addEventListener('change', function(e) {
  if (e.target.dataset.action==='ed-calle' && e.target.value) {
    editCambiarCalle(e.target.dataset.gid, +e.target.dataset.i, e.target.value);
  }
});

document.getElementById('app').addEventListener('input', function(e) {
  // Buscador del tablero de calles
  if (e.target.id==='board-search') {
    BOARD.q = e.target.value;
    render();
    return;
  }
  // Buscador inline por calle: input tiene data-gkey
  const gkey = e.target.dataset.gkey;
  if (gkey && PS && e.target.id.startsWith('gs-')) {
    PS.grupoSearch[gkey] = e.target.value;
    const pos = e.target.selectionStart;
    render();
    const el = document.getElementById('gs-'+gkey);
    if (el) { el.focus(); try { el.setSelectionRange(pos,pos); } catch {} }
  }
  // Ciclo de salida: se guarda al escribir, sin redibujar (no se pierde el foco)
  if (e.target.dataset.ciclo) {
    const o = cicloObj(e.target.dataset.ciclo);
    if (o) { const antes = !!o.ciclo; o.cicloTxt = e.target.value; o.ciclo = parseCiclo(e.target.value);
      const sw = e.target.closest('.ciclo-row').querySelector('.toggle-row');
      if (sw && antes !== !!o.ciclo) { sw.classList.toggle('dis', !o.ciclo); if (o.ciclo) { sw.dataset.action = 'ciclo-auto'; sw.dataset.t = e.target.dataset.ciclo; } else delete sw.dataset.action;
        sw.querySelector('.sw').classList.toggle('on', !!(o.ciclo && o.auto)); } }
  }
  // Campo de notas
  if (e.target.id==='notas-input' && PS) {
    PS.notas = e.target.value;
  }
});

// ── Init ─────────────────────────────────────────────────────
loadCoach();
dbInit();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(e=>console.warn('sw', e));
</script>
