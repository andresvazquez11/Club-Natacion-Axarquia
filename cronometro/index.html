}

// ── Screen: Evolución ────────────────────────────────────────
function renderEvolucionNad() {
  const {nId} = route;
  const nad = S.nadadores.find(n=>n.id===nId);
  if (!nad) { nav({screen:'nadadores'}); return ''; }
  const eq = S.equipos.find(e=>e.id===nad.eqId);
  // Combos con datos
  const combosMap = {};
  S.resultados.filter(r=>r.nId===nId).forEach(r => {
    const c = resCombo(r);
    if (c.estilo && c.dist) combosMap[`${c.estilo}|${c.dist}`]=c;
  });
  const combos = Object.values(combosMap);
  const filter = route.filter||null;
  const sessions = getSwimmerSessions(nId, filter);
  const trend = calcTrend(sessions);
  const allMs = sessions.map(s=>s.ms);
  const bestMs = allMs.length?Math.min(...allMs):null;
  const lastMs = sessions.length?sessions[sessions.length-1].ms:null;
  const filterPills = combos.length > 1 ? `
    <div class="wrap mb16">
      <span class="pill${!filter?' sel':''}" data-action="evo-filter" data-f="">Todos</span>
      ${combos.map(c=>`<span class="pill${filter&&filter.estilo===c.estilo&&Number(filter.dist)===Number(c.dist)?' sel':''}" data-action="evo-filter" data-f="${esc(c.estilo+'|'+c.dist)}">${comboLabel(c.estilo, c.dist)}</span>`).join('')}
    </div>` : '';
  const statsHtml = allMs.length ? `
    <div class="picker-row" style="grid-template-columns:repeat(3,1fr);margin-bottom:16px">
      <div style="background:var(--surf);border:1px solid var(--brd);border-radius:10px;padding:10px;text-align:center">
        <div style="font-size:10px;color:var(--mut);margin-bottom:3px;letter-spacing:.5px">MEJOR</div>
        <div style="font-weight:700;color:var(--amb);font-variant-numeric:tabular-nums;font-size:15px">${fmtTime(bestMs)}</div>
      </div>
      <div style="background:var(--surf);border:1px solid var(--brd);border-radius:10px;padding:10px;text-align:center">
        <div style="font-size:10px;color:var(--mut);margin-bottom:3px;letter-spacing:.5px">ÚLTIMO</div>
        <div style="font-weight:700;font-variant-numeric:tabular-nums;font-size:15px">${fmtTime(lastMs)}</div>
      </div>
      <div style="background:var(--surf);border:1px solid var(--brd);border-radius:10px;padding:10px;text-align:center">
        <div style="font-size:10px;color:var(--mut);margin-bottom:3px;letter-spacing:.5px">TENDENCIA</div>
        <div style="font-weight:700;font-size:20px;color:${trend?trend.color:'#bcd8ea'}">${trend?trend.dir:'–'}</div>
      </div>
    </div>` : '';
  // Cada tiempo por separado: fecha, hora y serie (en un mismo entreno puede haber varias series de la misma prueba)
  const tiempos = tiemposNadador(nId, filter);
  const ultimoId = tiempos.length ? tiempos[0].r.id : null;
  const sesRows = tiempos.slice(0,30).map(x => {
    const isLast = x.r.id===ultimoId, isBest = x.r.ms===bestMs && !isLast;
    return `<div class="click-row" style="display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--brd)" data-action="hist-det" data-ses="${esc(x.ses.id)}">
      <div style="flex:1;min-width:0">
        <div style="font-size:13px"><b>${fmtDateShort(x.ses.fecha)}</b> · ${fmtHora(x.r.ts || x.ses.fecha)} · <b>Serie ${x.r.ronda||1}</b> ${iniTag(x.r)}</div>
        ${x.estilo?`<div class="muted" style="font-size:12px">${comboLabel(x.estilo, x.dist)}${x.r.nota?` · 📝 ${esc(x.r.nota)}`:''}</div>`:''}
      </div>
      ${isLast?'<span class="badge b-blu">Último</span>':''}
      ${isBest?'<span class="badge b-amb">Mejor</span>':''}
      <span style="font-weight:700;font-variant-numeric:tabular-nums;color:var(--grn-l)">${fmtTime(x.r.ms)}</span>
    </div>`;

  const back = route.desde ? `<button class="back-btn" data-action="volver">← Volver</button>` : `<button class="back-btn" data-action="tab" data-to="nadadores">← Nadadores</button>`;
  return `

    ${filterPills}

    ${sesRows?`<span class="label mt16">Tiempos (${tiempos.length}) · toca uno para ver ese entreno</span>${sesRows}`:''}`;
}
// Tiempos de un nadador en mis entrenos, del más reciente al más antiguo: [{r, ses, estilo, dist}]
function tiemposNadador(nId, filter) {
  const ses = new Map(mySes().map(s=>[s.id, s]));
  return S.resultados.filter(r => r.nId===nId && ses.has(r.sesId)).map(r => ({r, ses: ses.get(r.sesId), ...resCombo(r)}))
    .filter(x => !filter || (x.estilo===filter.estilo && x.dist===Number(filter.dist)))
    .sort((a,b) => b.ses.fecha-a.ses.fecha || (b.r.ronda||1)-(a.r.ronda||1) || (b.r.ts||0)-(a.r.ts||0));
}

// ── Borrar entrenos de prueba → papelera ──
// Borrar no elimina nada: el entrenamiento se marca «borrado» y deja de verse en el cronómetro y en la web,
// pero sus tiempos siguen guardados y se puede recuperar desde la papelera.
// Cada entrenador ve y borra los suyos; el administrador, los de todos.
let LIMP = null;   // {sel: Set de sesiones, estado}
const puedoBorrar = s => soyAdmin() || esMio(s);
// Propuestos ya marcados: los de simulación y, para el administrador, sus propias pruebas
const esDePrueba = s => esSim(s) || (soyAdmin() && (s.coachEmail ? s.coachEmail === miEmail() : /^andr[eé]s\b/i.test(String(s.coach||''))));
function abrirLimpieza() {
  LIMP = {sel: new Set(S.sesiones.filter(s=>puedoBorrar(s) && esDePrueba(s)).map(s=>s.id)), estado: null};
  nav({screen:'limpieza'}); window.scrollTo(0,0);
}
function renderLimpieza() {

  const papelera = PAPELERA.filter(puedoBorrar).sort((a,b)=>(b.borradoTs||0)-(a.borradoTs||0));
  const nRes = id => RAW_RES().filter(r=>r.sesId===id).length;

// ── Sincronizar nadadores con la web de estadísticas ─────────
// nadadores.json lo genera cada día el proceso de la web (licencia RFEN, nombre, categoría).
const CAT_EQUIPO = {BEN:['club_ben','Benjamín'], ALE:['club_ale','Alevín'], INF:['club_inf','Infantil'], JUN:['club_jun','Junior'], ABS:['club_abs','Absoluto']};
function normNombre(s) {
  return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z ]/g,'').split(/\s+/).filter(Boolean).join(' ');
}
let _sync = null;
const EQUIPOS_CAT = new Set(Object.values(CAT_EQUIPO).map(x=>x[0]));
function esEquipoClub(eqId) { return EQUIPOS_CAT.has(eqId) || !!S.equipos.find(e=>e.id===eqId && e.shared); }
async function sincronizarNadadores() {
  _sync = {estado:'Leyendo la lista del club…'}; render();
  try {
    const r = await fetch('nadadores.json', {cache:'no-cache'});
    if (!r.ok) throw new Error('No se pudo leer nadadores.json ('+r.status+')');
    const web = (await r.json()).nadadores || [];
    const res = {nuevos:0, emparejados:0, categoria:0, nombre:0, sinCambios:0, equipos:0};
    for (const [cat, [eqId, nombre]] of Object.entries(CAT_EQUIPO)) {
      if (!S.equipos.find(e=>e.id===eqId) && web.some(w=>w.cat===cat)) {
        await _db.collection('equipos').doc(eqId).set({nombre, shared:true, ts:Date.now()}); res.equipos++;
      }
    }
    const club = S.nadadores.filter(n => esEquipoClub(n.eqId));
    for (const w of web) {
      if (!/^\d{3,12}$/.test(String(w.id)) || !CAT_EQUIPO[w.cat]) continue;
      const eqId = CAT_EQUIPO[w.cat][0];
      let nad = S.nadadores.find(n=>n.rfen===String(w.id));   // la licencia manda, esté en el equipo que esté
      if (!nad) {
        const cands = club.filter(n=>!n.rfen && normNombre(n.n)===normNombre(w.n));
        if (cands.length===1) { nad = cands[0]; await _db.collection('nadadores').doc(nad.id).update({rfen:String(w.id)}); res.emparejados++; }
      }
      if (!nad) {
        await _db.collection('nadadores').doc('rfen_'+w.id).set({eqId, n:String(w.n).slice(0,200), rfen:String(w.id)}); res.nuevos++; continue;
      }
      const cambios = {};
      if (nad.eqId !== eqId) { cambios.eqId = eqId; res.categoria++; }
      if (nad.n !== w.n) { cambios.n = String(w.n).slice(0,200); res.nombre++; }
      if (Object.keys(cambios).length) await _db.collection('nadadores').doc(nad.id).update(cambios); else res.sinCambios++;
    }
    const enWeb = new Set(web.map(w=>String(w.id)));
    const fuera = club.filter(n=>n.rfen && !enWeb.has(n.rfen)).length;
    _sync = {estado:`Listo · ${res.nuevos} nuevos · ${res.emparejados} emparejados · ${res.categoria} cambian de categoría · ${res.nombre} nombres actualizados · ${res.sinCambios} sin cambios${fuera?` · ${fuera} ya no están en la web (se conservan)`:''}`};
  } catch (e) {
    _sync = {estado:'Error: '+e.message};
  }
  render();
}

}

// La hora de SALIDA/LLEGÓ se toma al apoyar el dedo (pointerdown), no al soltarlo
let _press = null;
document.getElementById('app').addEventListener('pointerdown', function(e) {
  const b = e.target.closest('.salida-btn,.llego-btn,.rel-toque');
  _press = b ? {id:b.dataset.action+'|'+(b.dataset.key||''), t:Date.now()} : null;
}, true);
// Nota rápida: mantener pulsada la tarjeta (en el agua) o la fila (llegado) sin moverse.
// En el agua hace falta más tiempo, para que un LLEGÓ algo largo nunca se convierta en nota.
// Antes se bloqueaban todos los toques 60 s hasta soltar el dedo; si la pantalla se redibujaba bajo el dedo
// (salida automática, otra llegada…) el «soltar» no llegaba a #app y el cronómetro quedaba sin responder.
// Ahora el soltar se escucha en todo el documento y el bloqueo dura como mucho 2 s.
let _lp = null, _notaPend = null;
document.getElementById('app').addEventListener('pointerdown', function(e) {
  const el = e.target.closest('.sw-card[data-key],.lleg-row[data-key]');
  if (!el || !SA) return;
  const enAgua = el.classList.contains('sw-card') && !el.classList.contains('done');
  _lp = {x:e.clientX, y:e.clientY, key:el.dataset.key, timer:setTimeout(() => {
    _notaPend = _lp && _lp.key; _ignoreClickUntil = Date.now() + 2000;
    vibrar(15);
  }, enAgua ? 800 : 600)};
});
document.addEventListener('pointermove', function(e) {
  if (_lp && Math.hypot(e.clientX-_lp.x, e.clientY-_lp.y) > 10) { clearTimeout(_lp.timer); _lp = null; }
}, true);
function finPulsacion() {
  if (_lp) { clearTimeout(_lp.timer); _lp = null; }
  if (_notaPend) { const k = _notaPend; _notaPend = null; _ignoreClickUntil = Date.now() + 400; setTimeout(() => pedirNota(k), 0); }
}
document.addEventListener('pointerup', finPulsacion, true);
document.addEventListener('pointercancel', finPulsacion, true);
document.addEventListener('touchend', finPulsacion, true);
document.addEventListener('touchcancel', finPulsacion, true);

  render();
}

    case 'salida-tanda':    desbloquearAudio(); salidaTanda(tiempoToque(btn)); break;
    case 'llego': {
      const t = tiempoToque(btn);
      // Si la lista cambió entre el toque y el soltar, el dedo apuntaba a otra fila: ignorar
      if (_press && SA && _press.t < SA.tLayout && Date.now()-_press.t < 1500) break;
      marcaNad(btn.dataset.key, t); break;
    }
    case 'deshacer':        deshacerLlegada(btn.dataset.key); break;
    case 'deshacer-parcial': deshacerParcial(btn.dataset.key); break;
    case 'llego-directo':   llegoDirecto(btn.dataset.key, Date.now()); break;
    case 'b-card': case 'b-lane': case 'b-pool': saveNotas(); boardTap(btn); break;
    case 'b-cancel':        BOARD.sel = null; render(); break;
    case 'board-cat':       saveNotas(); BOARD.cat = btn.dataset.cat || null; render(); break;
    case 'b-lane-del': {
      saveNotas();
      if (PS) { PS.grupos = PS.grupos.filter(g=>g.key!==btn.dataset.lane); BOARD.sel = null; render(); }
      break;
    }
    case 'toggle-parciales': saveNotas(); if (PS) { PS.parciales = !PS.parciales; render(); } break;
    case 'no-sale':         toggleNoSale(btn.dataset.gid); break;
    case 'edit-abrir':      if (SA) { SA.editando = true; boardReset(); render(); } break;
    case 'edit-cerrar':     if (SA) { SA.editando = false; SA.buscar = null; render(); } break;
    case 'ed-mover':        editMover(btn.dataset.gid, +btn.dataset.i, +btn.dataset.dir); break;
    case 'ed-quitar':       editQuitar(btn.dataset.gid, +btn.dataset.i); break;
    case 'ed-buscar':       if (SA) { SA.buscar = {gId:btn.dataset.gid, q:''}; render(); const i=document.getElementById('sa-search'); if (i) i.focus(); } break;
    case 'ed-buscar-cerrar': if (SA) { SA.buscar = null; render(); } break;
    case 'ed-agregar':      editAgregar(btn.dataset.gid, btn.dataset.nid); break;
    case 'ed-nueva-calle':  await editNuevaCalle(); break;
    case 'vista':           if (SA) { SA.vista = btn.dataset.v; render(); } break;
    case 'repetir-serie':   repetirSerie(); break;
    case 'ns-abrir':        if (SA) { SA.nuevaSerie = {estilo:SA.estilo, dist:SA.dist, parciales:SA.parciales, ciclo:SA.ciclo, auto:!!SA.ciclo, inicio:SA.inicio, comp:SA.comp, porNadador:SA.porNadador, relevo: SA.relevo ? {...SA.relevo, estilos:[...SA.relevo.estilos]} : null, rota: copiaRota(SA.rota), ritmo: SA.ritmo ? {...SA.ritmo} : null}; render(); } break;
    // Siguiente serie sin esperar a los que aún nadan: la del plan si hay, si no la misma
    case 'serie-ya':        if (SA) { if (SA.plan && SA.plan.series[SA.planIdx+1]) { SA.planIdx++; repetirSerie(SA.plan.series[SA.planIdx]); } else repetirSerie(); } break;
    case 'inicio':          { saveNotas(); planNombre(); const o = cicloObj(btn.dataset.t); if (o && !o.comp) { o.inicio = btn.dataset.v === 'plataforma' ? 'plataforma' : 'agua'; render(); } break; }
    case 'plan-ec':         if (SA && SA.plan) { SA.planEdit = !SA.planEdit; render(); } break;
    case 'planec-mover':    if (SA && SA.plan) { const ss = SA.plan.series, i = Number(btn.dataset.i), j = i + Number(btn.dataset.dir);
                              if (j > SA.planIdx && j < ss.length) { [ss[i], ss[j]] = [ss[j], ss[i]]; render(); } } break;
    case 'planec-quitar':   if (SA && SA.plan) { SA.plan.series.splice(Number(btn.dataset.i), 1); render(); } break;
    case 'planec-add':      if (SA && SA.plan) { const u = SA.plan.series[SA.plan.series.length-1]; SA.plan.series.push({...serieVacia(), ...(u?{estilo:u.estilo, dist:u.dist}:{})}); render(); } break;
    case 'planec-guardar':  if (SA && SA.plan && SA.plan.id && confirm('¿Guardar este orden de series en el entreno preparado para la próxima vez?')) {
                              await DB.guardarPlan(SA.plan.id, {series: SA.plan.series.map(x=>({estilo:x.estilo, dist:Number(x.dist)||null, parciales:!!x.parciales && Number(x.dist)>50, ciclo:x.ciclo||null, auto:!!x.auto, inicio:inicioDe(x), comp:!!x.comp, porNadador:!!x.porNadador, rota:rotaOk(x.rota), ritmo:ritmoOk(x.ritmo)}))});
                              alert('Guardado en el entreno preparado.'); } break;
    case 'rel-modo':        { saveNotas(); const o = cicloObj(btn.dataset.t); if (o) { o.relevo = btn.dataset.v ? (o.relevo || {tipo:'igual', estilos:[...ESTILOS_RELEVO]}) : null; if (o.relevo) { o.parciales = false; o.auto = false; o.ciclo = null; o.comp = false; o.porNadador = false; o.rota = null; } render(); } break; }
    case 'ritmo-ref':       { saveNotas(); planNombre(); const o = cicloObj(btn.dataset.t); if (o) { const a = ritmoOk(o.ritmo) || {}; o.ritmo = ritmoOk({...a, ref: btn.dataset.v}); render(); } break; }
    case 'rota-toggle':     { saveNotas(); planNombre(); const o = cicloObj(btn.dataset.t); if (o) { o.rota = o.rota ? null : rotaDefecto(Number(o.dist) >= 100 ? o.dist : 200);
                              if (o.rota) { o.relevo = null; o.parciales = false; o.comp = false; o.dist = rotaTotal(o.rota); } render(); } break; }
    case 'rota-add':        { saveNotas(); planNombre(); const o = cicloObj(btn.dataset.t); if (o && o.rota && o.rota.tramos.length < 8) { o.rota.tramos.push(50); o.rota.desc.push(ROTA_DESC_DEF); o.dist = rotaTotal(o.rota); render(); } break; }
    case 'rota-quitar':     { saveNotas(); planNombre(); const o = cicloObj(btn.dataset.t); if (o && o.rota && o.rota.tramos.length > 2) { o.rota.tramos.pop(); o.rota.desc.pop(); o.dist = rotaTotal(o.rota); render(); } break; }
    case 'rel-tipo':        { saveNotas(); const o = cicloObj(btn.dataset.t); if (o && o.relevo) { o.relevo.tipo = btn.dataset.v === 'estilos' ? 'estilos' : 'igual'; render(); } break; }
    case 'rel-salida':      desbloquearAudio(); relevoSalida(tiempoToque(btn)); break;
    case 'rel-toque':       relevoToque(btn.dataset.g, tiempoToque(btn)); break;
    case 'rel-undo':        relevoDeshacer(btn.dataset.g); break;
    case 'pornad-toggle':   { saveNotas(); planNombre(); const o = cicloObj(btn.dataset.t); if (o) { o.porNadador = !o.porNadador; render(); } break; }
    case 'comp-toggle':     { saveNotas(); planNombre(); const o = cicloObj(btn.dataset.t); if (o) { o.comp = !o.comp; if (o.comp) o.inicio = 'plataforma'; render(); } break; }
    case 'volver':          nav(route.desde || {screen:'nadadores'}); window.scrollTo(0,0); break;
    case 'ciclo-auto':      { saveNotas(); planNombre(); const o = cicloObj(btn.dataset.t); if (o) { o.auto = !o.auto; o.ciclo = o.auto ? CICLO_DEF : null; render(); } break; }
    case 'ciclo-sa':        if (SA && SA.ciclo) { SA.auto = !SA.auto; if (SA.auto) SA.tUltSalida = Date.now(); render(); } break;   // al reanudar, el ciclo cuenta desde ahora
    case 'ns-cancelar':     if (SA) { SA.nuevaSerie = null; render(); } break;
    case 'ns-estilo':       if (SA && SA.nuevaSerie) { SA.nuevaSerie.estilo = btn.dataset.val; render(); } break;
    case 'ns-dist':         if (SA && SA.nuevaSerie) { SA.nuevaSerie.dist = Number(btn.dataset.val); render(); } break;
    case 'ns-parc':         if (SA && SA.nuevaSerie) { SA.nuevaSerie.parciales = !SA.nuevaSerie.parciales; render(); } break;
    case 'ns-empezar':      if (SA && SA.nuevaSerie && SA.nuevaSerie.dist && (SA.nuevaSerie.estilo || (SA.nuevaSerie.relevo && SA.nuevaSerie.relevo.tipo==='estilos'))) repetirSerie(SA.nuevaSerie); break;
    case 'pdf':             await generarPDF(btn.dataset.ses||route.sesId, btn); break;
    case 'pdf-compartir':   await generarPDF(btn.dataset.ses||route.sesId, btn, true); break;
    case 'finalizar-sesion': await finalizarSesion(); break;
    case 'exportar':     await exportar(btn.dataset.ses||route.sesId); break;
  }
  if (route.screen==='en-curso') { if (!_clk) startClock(); }
});

document.getElementById('app').addEventListener('keydown', async function(e) {
  if (e.key!=='Enter') return;
  if (e.target.id==='coach-input') {
    const v=e.target.value.trim(); if(!v) return;
    saveCoach(v); render();
  } else if (e.target.id==='eq-input') {
    const v=e.target.value.trim(); if(!v) return;
    e.target.value=''; await DB.crearEquipo(v);
  } else if (e.target.id==='nad-input') {
    const v=e.target.value.trim(); if(!v) return;
    e.target.value=''; await DB.crearNadador(route.eqId, v);
  }
});

document.getElementById('app').addEventListener('change', function(e) {
  if (e.target.dataset.relnad && SA) { (SA.relNad = SA.relNad || new Map()).set(e.target.dataset.relnad, e.target.value); render(); return; }
  if (e.target.dataset.bloque && PS && PS.bloque) { planNombre(); PS.bloque[e.target.dataset.bloque] = e.target.value; render(); return; }
  if (e.target.dataset.ritmomas != null || e.target.dataset.ritmotol != null) {
    planNombre(); const t = e.target.dataset.ritmomas ?? e.target.dataset.ritmotol, o = cicloObj(t); if (!o || !o.ritmo) return;
    const txt = e.target.value.trim().replace('−', '-'), v = parseSegundos(txt);
    if (e.target.dataset.ritmomas != null) {
      if (txt && v === null) { alert('Escribe los segundos que se suman al ritmo (como mucho 60), por ejemplo +10, +4, 4,5 o -2'); render(); return; }
      o.ritmo = ritmoOk({...o.ritmo, mas: txt ? v : null, tol: o.ritmo.tol});
    } else {
      if (!v || Math.abs(v) < 10 || Math.abs(v) > 1000) { alert('Escribe el margen en segundos, de 0,1 a 10 (por ejemplo 1 o 0,5)'); render(); return; }
      o.ritmo = ritmoOk({...o.ritmo, tol: Math.abs(v)});
    }
    render(); return;
  }
  if (e.target.dataset.ritmomano != null) {
    planNombre(); const o = cicloObj(e.target.dataset.ritmomano); if (!o || !o.ritmo) return;
    const v = parseRitmo(e.target.value);
    if (e.target.value.trim() && !v) { alert('Escribe el ritmo cada 100 m así: 1:20.0'); return; }
    o.ritmo = ritmoOk({...o.ritmo, mano: v}); render(); return;
  }
  if (e.target.dataset.rotatr != null || e.target.dataset.rotadesc != null) {
    planNombre(); const o = cicloObj(e.target.dataset.t); if (!o || !o.rota) return;
    if (e.target.dataset.rotatr != null) o.rota.tramos[Number(e.target.dataset.rotatr)] = Number(e.target.value);
    else o.rota.desc[Number(e.target.dataset.rotadesc)] = Number(e.target.value);
    o.dist = rotaTotal(o.rota); render(); return;
  }
  if (e.target.dataset.relest != null) { const o = cicloObj(e.target.dataset.t); if (o && o.relevo) { o.relevo.estilos[Number(e.target.dataset.relest)] = e.target.value; render(); } return; }
  if (e.target.dataset.planec && SA && SA.plan) { const x = SA.plan.series[Number(e.target.dataset.i)]; if (x) { if (e.target.dataset.planec==='dist') { x.dist = Number(e.target.value); if (x.dist<=50) x.parciales = false; } else x.estilo = e.target.value; } render(); return; }
  if (e.target.dataset.estnad && SA) { SA.estiloNad.set(e.target.dataset.estnad, e.target.value); render(); return; }
  if (e.target.dataset.limp && LIMP) { e.target.checked ? LIMP.sel.add(e.target.dataset.limp) : LIMP.sel.delete(e.target.dataset.limp); render(); return; }
  if (e.target.dataset.action==='ed-calle' && e.target.value) {
    editCambiarCalle(e.target.dataset.gid, +e.target.dataset.i, e.target.value);
  }
});

document.getElementById('app').addEventListener('input', function(e) {
  // Buscador del tablero de calles
  if (e.target.id==='board-search') {
    BOARD.q = e.target.value;
    render();
    return;
  }
  // Buscador inline por calle: input tiene data-gkey
  const gkey = e.target.dataset.gkey;
  if (gkey && PS && e.target.id.startsWith('gs-')) {
    PS.grupoSearch[gkey] = e.target.value;
    const pos = e.target.selectionStart;
    render();
    const el = document.getElementById('gs-'+gkey);
    if (el) { el.focus(); try { el.setSelectionRange(pos,pos); } catch {} }
  }
  // Ciclo de salida: se guarda al escribir, sin redibujar (no se pierde el foco)
  if (e.target.dataset.ciclo) {
    const o = cicloObj(e.target.dataset.ciclo);
    if (o) o.ciclo = parseCiclo(e.target.value);   // vacío o inválido: se usarán 3 s
  }
  // Campo de notas
  if (e.target.id==='notas-input' && PS) {
    PS.notas = e.target.value;
  }
});

// ── Init ─────────────────────────────────────────────────────
loadCoach();
dbInit();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(e=>console.warn('sw', e));
</script>
